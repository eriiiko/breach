# tools/staging_machines.toml -- the staging gate's per-machine table
# (tools/staging_gate.py), keyed by hostname (platform.node(), any case).
#
# cpu_build / cuda_build: the build this machine uses (docs/dev_setup.md,
# "Which Python each machine uses"): a script under cpp/ run in the staging
# worktree, or "cmake" for the plain configure + build of dev_setup Step 6.
#
# known_red: a test that is red on THIS machine for a reason outside every
# branch (red on a pristine main here too). The gate reports it as KNOWN,
# never as a staging red; it matches the exact node id (and its parametrized
# cases, "<id>[...]"), so it can never hide another red. Each entry says why
# and where that was found; delete it the day the cause is fixed.

