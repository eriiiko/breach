# Cycle type (scale 2): the AIRLOCK BYPASS -- §1.3 / §2 (the spec's example, verbatim).
# ONE walk leg (an airlock pair, L5); the other leg is not walkable: a
# vent_only link or a breakable wall that joins the two cells for gas.
[cycle]
name = "airlock_bypass"
move = "edge_to_cycle"
phase = [2]
rooms_per_leg = [1, 1]
crosses_cell = true             # the ONLY type allowed to; its walk leg must be an airlock pair (L5)
tactic = "You cannot walk around the airlock; smoke and teargas can."

[[leg]]
walk = true
edges = ["airlock"]

[[leg]]
walk = false
edges = ["vent_only", "breakable"]   # the grammar picks one per application
