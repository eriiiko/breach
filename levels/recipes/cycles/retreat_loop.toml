# Cycle type (scale 2): the RETREAT LOOP -- docs/levelgen_cycle_types_and_recipes_2026-10-31.md
# rev 2.1 §1.3 / §2 ("the same file [as the flank pair] with one wide leg of
# one room"). `second_leg` on a department's entry edge: the existing path
# passageway-stub-END is one leg, this file's one wide room (a second stub
# into the same end room) the other -- a 4-cycle, never a triangle.
[cycle]
name = "retreat_loop"
move = "second_leg"
phase = [2]
tactic = "A hub with two ways back toward your own end: you can always fall back without being cornered."

[[leg]]                         # [archetype rev 2]: ONE leg -- passageway-entry-END is the other
walk = true
rooms = [1, 1]
width = "wide"
edges = ["door", "open"]
