# Archetype recipe (scale 4): the FREIGHTER -- docs/levelgen_archetype_recipe_2026-10-31.md
# §1 (the spec's file) with the §7.1 build-session amendments (2026-11-06):
# lobby x 9-11 (layout doc §13 A1), the secret annex's size. Loaded, refused by
# name and executed by tools/ship_grammar.py. Every count is a QUOTIENT count
# (one wing + the axis band); the CONTENT (which departments, at what odds) is
# Erik's to veto (archetype doc §7). Everything is a name or a count range: no
# geometry, no physics number.
[archetype]
name = "freighter"
skeleton = "freighter"          # a skeleton the layout stage implements in code (tools/ship_layout.py); its rooms and edges come with it
sizes = ["medium", "large"]     # gen_ship.SIZES presets this recipe fits; small stays plan_graph's arena
passageway = { across = [6, 8] }       # the wing passageway's width
lobby = { x = [9, 11] }                # the wing lobby's x-extent (§7.1 / layout §13 A1: the engineering airlocks' vestibules stand in it)
band = { sections = [3, 5] }           # INTERSECTED with the preset's own range (medium: 3-4); includes engineering's block
spawn = { exits = [1, 3] }      # drawn uniformly in phase 2; capped at what the skeleton can realise
zombies = "axis_section"        # the horde's room: the aft-most main-cell band section (the one the lobbies face)
secrets = { budget = 1, size = [6, 16] }   # units per ship (a wing secret is a mirrored pair after reflection); the annex's w and h
allow_cross_cell_leak = false   # L5's leak-path clause; true is REFUSED until the damper (#49) exists

[cells]
promote = []                    # main-cell departments this archetype makes their own cell (the department file's `cell` is the default)

# ---- the axiom: departments present in every ship of this kind ----
[[axiom]]
department = "engineering"      # REQUIRED on the freighter skeleton: the lobbies' airlocks land on its engine room
placement = "axis"

[[axiom]]
department = "crew_quarters"
placement = "wing"              # once per wing: every count in this file is a QUOTIENT count

# ---- phase 1: grow (departments) ----
[[apply]]
phase = 1
department = "cargo_hold"
count = { medium = [1, 1], large = [1, 1] }

[[apply]]
phase = 1
department = "medbay"           # v1: without its isolation room (a room-level cell; §7.1)
count = { medium = [0, 0], large = [1, 1] }

[[apply]]
phase = 1
department = "armory"
count = { medium = [0, 0], large = [1, 1] }   # always on large: three wing departments deal as 2 + 1 and one department cannot fill a 41-49 row

# garden_dome and pool_hall: NOT in v1 -- their water stamps are unbuilt; the loader would refuse them

# ---- phase 2: tactical patterns (ship-level cycle types; then the spawn exits draw) ----
[[apply]]
phase = 2
cycle = "retreat_loop"
on = "department-entry"         # a wing department with an attach = "end" room
count = { medium = [0, 0], large = [0, 1] }

[[apply]]
phase = 2
cycle = "flank_pair"
on = "slab-lobby"
count = { medium = [0, 1], large = [0, 1] }

[[apply]]
phase = 2
cycle = "maintenance_ring"      # large only (band width >= 20); mutually exclusive with the bypass per ship
on = "engineering.engine_room"
count = { medium = [0, 0], large = [0, 1] }

[[apply]]
phase = 2
cycle = "airlock_bypass"
on = "lobby-engine_room"
count = { medium = [0, 1], large = [0, 1] }

[[apply]]
phase = 2
cycle = "pocket"
on = "department-room"
count = { medium = [0, 0], large = [0, 2] }     # none on medium: a 20-long department holds one end-zone corner room, the secret annex's

# ---- phase 3: terminalise -- no entries by choice: fixtures are department data, the secret draw is the budget ----

# ---- phase 4: annotate (ducts) ----
[[apply]]
phase = 4
cycle = "duct_link"
on = "same-cell-rooms"
count = { medium = [0, 1], large = [0, 2] }

# ---- validation profile (L2's third component; L8): metric gates from a closed registry; run after layout ----
[validation]
bot_walkable = true             # A* between the two slabs with airlock outer doors CLOSED
spawn_distance = { medium = [60, 160], large = [110, 280] }   # the bots' A* steps between the slab centres, after embed (measured 84-131 / 142-231)
cells = [2, 3]                  # pressure cells per ship
rooms = { medium = [20, 48], large = [40, 96] }              # rooms per ship, both wings (measured 26-40 / 50-82)

# ---- difficulty profiles: each key names its operator ----
[profiles.easy]
cycles_shift = -1               # added to every phase-2 and phase-4 cycle range, floored at 0
secrets = 0                     # ABSOLUTE budget
zombies_scale = 0.5             # multiplies the generator's zombies argument

[profiles.standard]             # the file as written

[profiles.hard]
cycles_shift = 1                # capped at the layout's realisable maximum per type
promote = ["armory"]            # ABSOLUTE set, replaces [cells].promote: the armory becomes its own cell
zombies_scale = 1.5
