# Room roles (scale 1.5): a room with its own physics signature, reused across
# departments -- docs/levelgen_cycle_types_and_recipes_2026-10-31.md §3.3,
# VERBATIM. Every value NAMES a config.toml row ([heat_sources.*],
# [payloads.*], [materials.*]); a role never carries a physics number.
[galley]
heat_source = "stove"           # a heat-source preset: heat_per_s, radius, max_temp live in config.toml
heat_source_enabled = true      # Erik 2026-10-31: on from tick 0; "perhaps we'll look over this later"
fuel = "kindling"

[o2_store]
hazard = "o2_store_rupture"     # a [payloads.*] row on a heat-triggered charge
trigger = "heat"

[aquarium]
water = "full"
edges_out = ["window"]          # it meets the ship only through glass

[magazine]
hazard = "magazine_cookoff"
trigger = "heat"
