# airlock_demo — the Arc B automatic-airlock HUMAN-TEST level.
# NEW level: never migrated, never in any golden/digest suite. Flat dev art.
#
# Layout (9 rows x 20 cols, 1.0 m tiles):
#   cols 1..6   ship interior (air) — the marine starts here
#   col  7      INNER door (v, rows 2..6) — interior <-> chamber
#   cols 8..11  the airlock CHAMBER (air): presence plate + pump port + probe
#   col  12     OUTER door (v, rows 2..6) — chamber <-> space
#   cols 13..19 open SPACE (vacuum) — the far side
#
# The whole interior/corridor/space is 5 rows TALL (rows 2..6) — a 3x3 marine
# (footprint 3) needs the full 3x3 block clear to enter a tile (is_passable_
# block), so a corridor only 3 tall admits exactly ONE anchor row and strands
# the unit (the B7 HUMAN-TEST bug Erik hit). 5 tall gives 3 valid anchor rows
# and real maneuvering room. Doors span the full 5-tile opening.
#
# The automatic cycle (airlock_controller, impl doc §7): a marine steps into
# the chamber -> both doors seal -> the pump EVACUATES the chamber toward the
# far (vacuum) target -> the outer door opens with no rush -> the marine exits
# to space -> the outer door reseals -> the pump REPRESSURIZES the chamber ->
# the inner door reopens. The presence plate sits at chamber centre, OFF both
# door spans (N5), so the triggering marine never blocks its own airlock.
#
# BIDIRECTIONAL (B7 — Erik's Option 2): the loop is closed by a CHAMBER
# PRESSURE SENSOR (`chamber_p`) through two deciders — `at_far` (chamber <=
# far target) ends EQUALIZE, `at_near` (chamber >= near target) ends
# REPRESSURIZE. The pump runs open-loop; the sensor decides when each leg is
# done, so REPRESSURIZE genuinely refills the chamber (no retargetable pump).
#
# FEEL-ADJACENT — Erik plays it before any merge (HUMAN-TEST gate).
# Launch:  conda run -n data python main.py --level airlock_demo
# Keys:    O toggle door under cursor | J gas | U water | I ignite | F6 HUD

version = "2"
name = "airlock_demo"

tilemap = "tilemap.csv"
tile_size_m = 1.0
diffuse = "diffuse.png"

[[spawn]]
name = "Alpha"
team = 0
x = 3.0
y = 4.0
footprint = 3

[[entity]]
id = "inner_door"
class = "door"
x = 7
y = 2
orientation = "v"
length_m = 5.0
initial_state = "open"

[[entity]]
id = "outer_door"
class = "door"
x = 12
y = 2
orientation = "v"
length_m = 5.0
initial_state = "closed"

[[entity]]
id = "pump_1"
class = "pump"
x = 9
y = 1
port_dx = 0
port_dy = 1
rate = 8.0
target_atm = 0
hysteresis_band = 13107

[[entity]]
id = "plate"
class = "sensor_motion"
x = 9
y = 4
radius = 3.0

[[entity]]
id = "chamber_p"
class = "pressure"
x = 10
y = 1
sample_dx = 0
sample_dy = 1

[[entity]]
id = "dec_far"
class = "decider"
comparator = "le"
threshold = 6554

[[entity]]
id = "dec_near"
class = "decider"
comparator = "ge"
threshold = 58982

[[entity]]
id = "ctrl"
class = "airlock_controller"
far_door = "outer"
target_far_atm = 0
target_near_atm = 65536

[[wire]]
from = "plate.value"
to = "ctrl.presence"

[[wire]]
from = "inner_door.is_open"
to = "ctrl.inner_open"

[[wire]]
from = "outer_door.is_open"
to = "ctrl.outer_open"

[[wire]]
from = "inner_door.alive"
to = "ctrl.inner_alive"

[[wire]]
from = "outer_door.alive"
to = "ctrl.outer_alive"

[[wire]]
from = "chamber_p.value"
to = "dec_far.in"

[[wire]]
from = "chamber_p.value"
to = "dec_near.in"

[[wire]]
from = "dec_far.out"
to = "ctrl.at_far"

[[wire]]
from = "dec_near.out"
to = "ctrl.at_near"

[[wire]]
from = "ctrl.inner_close"
to = "inner_door.close"

[[wire]]
from = "ctrl.inner_open_cmd"
to = "inner_door.open"

[[wire]]
from = "ctrl.outer_close"
to = "outer_door.close"

[[wire]]
from = "ctrl.outer_open_cmd"
to = "outer_door.open"

[[wire]]
from = "ctrl.pump_inject"
to = "pump_1.inject"

[[wire]]
from = "ctrl.pump_extract"
to = "pump_1.extract"
