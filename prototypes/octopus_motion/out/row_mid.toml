radius_tip_m = 0.00525   # scaled L^1
tissue_density = 1042.0   # measured (Yekutieli I), kg/m^3
water_density = 1022.0   # sea water, kg/m^3
body_mass_kg = 509.631   # SIZES: mantle 0.93 x 1.08 m as a prolate ellipsoid 0.93 x 0.93 x 1.08 at 1042 kg/m^3 (the law would give 347 kg)
body_radius_m = 0.465   # SIZES: half the mantle width (the law would give 0.525 m)
body_c_drag = 1.0   # 2-D choice, dimensionless
body_crawl_area_m2 = 0.43245   # SIZES radius, the 2-D form (2 r) x r
body_rot_damp = 25.5256   # scaled L^5 (N m s)
