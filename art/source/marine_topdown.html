<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breach Marine - True Top Down (90°)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  
  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    color: #889988;
  }
  
  .container {
    text-align: center;
  }
  
  h1 {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #556655;
    margin-bottom: 30px;
  }
  
  .views {
    display: flex;
    gap: 80px;
    align-items: flex-end;
    justify-content: center;
    flex-wrap: wrap;
  }
  
  .view-group {
    text-align: center;
  }
  
  .scale-label {
    font-size: 11px;
    color: #445544;
    letter-spacing: 2px;
    margin-top: 10px;
  }
  
  .small-scales {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin-top: 40px;
  }

  .info {
    margin-top: 30px;
    font-size: 11px;
    color: #445544;
    letter-spacing: 1px;
  }
  
  .comparison {
    margin-top: 50px;
    padding-top: 30px;
    border-top: 1px solid #1a2a1a;
  }
  
  .comparison h2 {
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #445544;
    margin-bottom: 20px;
  }
  
  .rotation-row {
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
  }
  
  .rot-label {
    font-size: 10px;
    color: #334433;
    letter-spacing: 1px;
    margin-top: 6px;
  }
</style>
</head>
