[rendering]
# Resolution of the world composite RT in pixels per tile — the sharpness
# CEILING for everything (art, lights, overlays): art above this is
# downsampled on entry, zoom beyond it shows scaled-up RT pixels. The v2 art
# is 78 px/tile; 48 matches the deepest practical on-screen zoom (sharp in
# play), 78 = true native (RT grows ~2.6x, GPU fill cost rises with it).
# Read at renderer construction (restart, not Ctrl+R).
world_px_per_tile = 48.0
# Pressure colormap: [pressure, R, G, B, alpha]
# Linear interpolation between stops. Tweak and restart to iterate.
pressure_scale = 2.0    # scales deviation from 1.0: displayed = 1 + (raw - 1) * scale
pressure_stops = [
    [0.0,    0,   0,   0,   0],       # vacuum: fully transparent
    [3.3,  255, 255, 255,   5],       # normal air: faint white veil
    [6.0,  255, 255, 255,  15],       # slight overpressure: steam
    [7.0,  200,  50,  30, 120],       # shockwave: dark red
    [8.0,  255, 140,  30, 180],       # blast: orange
    [9.0,  255, 220,  80, 220],       # intense: yellow
    [10.0, 255, 255, 255, 255],       # max: white
]

[combat]
blast_damage_threshold = 5
unit_absorption = 0.85
unit_reflectivity = 0.10
shot_tracer_duration = 0.4

# --- Crit arc multipliers (mechanics/06 §5, W2) ------------------------------
# On a connecting projectile hit: crit% = weapon.crit_chance x arc multiplier,
# classified from the shot's incoming direction vs the TARGET's synced facing
# (arc widths are species-profile data: EnvironmentProfile.front/behind_arc_deg).
# STANDARD VALUES (mechanics/06 §5: x1 front, x2 flank, x4 behind — Erik's
# dials). All shipped weapons carry crit_chance = 0, so no roll is ever drawn
# in-game yet (the lazy-roll rule); a crit multiplies the packet amount by
# weapon.crit_mult before mitigation.
crit_front_mult = 1.0
crit_flank_mult = 2.0
crit_behind_mult = 4.0

# --- Unit heat damage (engine/06 §4, proposal §4.2) -----------------------
# A LIVING unit sampled at its footprint takes radiant heat damage from the
# already-occluded `heat` buffer (units are full ray-blockers, so heat[tile]
# IS the incident, distance-attenuated, occluded radiant flux at that tile):
#
#   Phi     = max(heat over footprint) / HEAT_SCALE          # incident flux
#   Phi_abs = Phi * unit_absorption * (1 - unit_reflectivity) # 0.85 * 0.90 = 0.765
#   T_felt  = heat_ambient_ref + heat_flux_to_temp * Phi_abs  # radiation -> felt temp
#   over    = T_felt - temperature_max                        # damage band (per-unit profile)
#   dmg     = environmental_damage_rate * (1 + heat_overtemp_scale * over) * dt_tick
#   -> DamagePacket(dmg, HEAT) through the mechanics/06 pipeline: the zombie
#      x4 is resist_mult[HEAT] on species.ZOMBIE_MITIGATION (same position,
#      pre-quantize), a marine's neutral table is an exact no-op.
#
# Defaults are tuned so a unit in a strong beam cooks while a warm room is
# survivable (temperature_max defaults to 60 in EnvironmentProfile):
#   - faint warmth (Phi ~1):  T_felt ~26  -> over < 0  -> no damage (survivable)
#   - modest beam  (Phi ~10): T_felt ~81  -> over ~21  -> ~2 HP/s on a marine
#   - strong beam  (Phi ~100):T_felt ~632 -> over ~572 -> ~30 HP/s (cooks in ~3 s)
# environmental_damage_rate / temperature_max come from each unit's
# EnvironmentProfile (config keys below are the global fallback if absent).
# dt_tick = 1/ticks_per_second keeps the real DPS tick-rate independent.
heat_flux_to_temp = 8.0          # felt-degrees per absorbed heat-unit (k_flux_to_temp)
heat_ambient_ref = 20.0          # baseline felt temperature, no beam (T_ambient_ref)
heat_overtemp_scale = 0.05       # damage ramp above the band (k_over), small +ve
temperature_max = 60.0           # global fallback band ceiling if a unit has no EnvironmentProfile
environmental_damage_rate = 1.0  # global fallback env-damage rate (per unit/sec) if no profile

# --- The physics<->unit exchange layer (mechanics/05) ------------------------
# Constants for the coupling-table rows that are not weapon numbers. First
# resident: the wave_p impulse-push row + its KNOCKED_DOWN trigger
# (mechanics/05 §1 / 06 §4; simulation/exchange.apply_wave_push, invoked at
# Simulation.step 9c2 — after heat damage, before the recorder snapshot).
#
#   (gx, gy) = reduce_grad(wave_p, footprint)          # Q16.16 counts, uphill
#   dv       = k_push * (-g / 65536) / unit.mass       # tiles/s, per tick
#   dx       = clamp(dv * dt_tick, +-push_max_tile_per_tick)   # the nudge
#   knocked  = dvx^2 + dvy^2 >= (knockdown_dv_threshold * stability)^2
#
# ALL FOUR ARE STANDARD-VALUE PLACEHOLDERS FOR ERIK'S TUNING (mechanics/06
# §8). Calibrated 2026-07-05 against a grenade (radius 5, pressure 10.0,
# unit_damage 60, mass-80 marine, 24 tps, 48x48 open room):
#   - meaningful blast DAMAGE reaches ~4.6 tiles (geometric falloff vs the
#     blast_damage_threshold);
#   - with k_push=400 / threshold=6.0 the KNOCKDOWN ring reaches ~9-10 tiles
#     (peak per-tick |dv| tiles/s by distance: d=4: 11.3, d=6: 9.1, d=7: 8.0,
#     d=8: 6.4, d=9: 7.0, d=10: 5.8, d=12: 5.7, d=14: 4.5, d=16: 3.3) —
#     i.e. knockdown_radius ~= 2x damage_radius, the mechanics/06 §4
#     "knocks marines sprawling without killing them" signature;
#   - the visible motion is a BUFFET: peak single-tick hop 0.3-0.5 tile with
#     a partial spring-back as the pulse's tail passes (linear acoustics:
#     a passing wave's net impulse largely cancels — measured net drift
#     +-0.2 tile, max forward excursion ~0.2-0.4 tile at k_push=400). A
#     SUSTAINED 1-tile-class throw would need the atmosphere-dome (blast
#     wind) term — a separate coupling row, Erik's design call, not in v1.
#
# HOT-RELOAD: all four apply LIVE via Ctrl+R — apply_wave_push reads
# CFG.exchange every tick, and config.py re-derives knockdown_getup_ticks
# from the seconds on every reload. Edit -> Ctrl+R -> re-throw, no restart.
[exchange]
# k_push — how hard shockwaves shove bodies. Feel: at 400 a grenade buffets
# marines 0.3-0.5 tile; the same dial scales the knockdown dv, so raising it
# WIDENS the knockdown ring too. Interesting range ~100 (a nudge you barely
# see) .. 2000 (ragdoll cannon: everything near a blast hits the cap and
# goes down).
k_push = 400.0                   # impulse gain: dv = k_push * grad / mass (tiles/s per unit gradient)
# push_max_tile_per_tick — motion sanity rail, NOT the knockdown gate (the
# trigger uses the uncapped dv). Feel: the max per-tick hop a violent
# gradient can produce. Interesting range 0.1 (stiff) .. 1.0 (teleporty at
# point blank); above ~1 a hop can visually skip a tile.
push_max_tile_per_tick = 0.5     # sanity cap on the per-tick displacement (tiles)
# knockdown_dv_threshold — the topple gate at stability 1.0. Feel: LOWER =
# blasts floor people farther out (at 6.0 a grenade's knockdown ring is
# ~9-10 tiles, ~2x its damage ring). Interesting range ~3 (twitchy — any
# passing wave floors you) .. 12 (stoic — only point-blank blasts topple).
knockdown_dv_threshold = 6.0     # |dv| (tiles/s) at stability 1.0 that triggers KNOCKED_DOWN
# knockdown_getup_seconds — prone time (no move/act, sprite sideways). Feel:
# the crowd-control payoff window after a good grenade. Interesting range
# 0.5 (a stumble) .. 4.0 (a real opening). Re-knocks refresh the timer.
knockdown_getup_seconds = 1.5    # prone time; config.py derives knockdown_getup_ticks (36 @ 24 tps)

# --- The W3 gas coupling rows (mechanics/05 §1: gas[teargas] / gas[poison]) --
# Both rows read the unit footprint with the heat row's reduction (max — the
# densest gas tile on the body is the exposure that matters), threshold-gated
# (Q16.16 integer compare, quantized once per pass), NO RNG. ALL FOUR ARE
# STANDARD-VALUE PLACEHOLDERS FOR ERIK'S TUNING (mechanics/06 §8).
# teargas_blind_density — footprint-max teargas density above which a unit is
# BLINDED (can_aim suppressed -> fires with the SNAP cone even on aimed
# orders). Feel: LOWER = the cloud edge already stings. Interesting range
# ~0.05 (wisps blind) .. 0.5 (only the thick core).
teargas_blind_density = 0.15
# teargas_blind_seconds — BLINDED duration per qualifying tick (refresh-
# stacked: standing in the cloud re-ups it every tick; it outlasts leaving
# the cloud by this much). Interesting range 0.5 (blink it away) .. 3.0
# (staggering out half-blind).
teargas_blind_seconds = 1.0
# poison_min_density — footprint-max poison density below which no dose
# accumulates (the cloud's harmless fringe). Interesting range 0.02 .. 0.2.
poison_min_density = 0.05
# poison_dps — POISON damage per second at FULL density (1.0); the per-tick
# packet scales linearly with the footprint-max density (dps * density / tps
# through the mechanics/06 pipeline -> marine resist 1.0, zombie resist 0.0:
# they don't breathe — and poison must NOT become the anti-horde cheese;
# fire is the answer). Interesting range ~2 (a lingering hazard) .. 20
# (a death sentence to stand in).
poison_dps = 6.0

[recorder]
# Physics ring-buffer length in seconds. config.py derives the integer slot
# capacity via round(replay_seconds * ticks_per_second). 100 s -> 1200 @ 12 tps.
replay_seconds = 100.0
