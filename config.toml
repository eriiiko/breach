# fire_pressure_gain TOMBSTONE (P-R2, 2026-07-31): dead key — the plume->T shim it fed (FireParams::fire_pressure_gain, the one temperature[] writer bypassing heat_inv_shift) was deleted; see docs/radiation_raycaster_extinction_ruling_2026-07-31.md A2.
p_expand_ref      = 1.30   # self-limiting plume saturation ceiling (atm + thermal-expansion headroom)
# smoke_emission TOMBSTONE (P-S1, 2026-08-15): dead key — the ex-nihilo fire
# smoke scatter it fed was DELETED (Erik's single-source ruling,
# docs/smoke_single_source_design_2026-07-24.md; killed the smoke->N2
