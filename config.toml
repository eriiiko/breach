[clock]
ticks_per_second = 24
phases_per_round = 2
phase_duration_seconds = 5.0
ap_per_phase = 2
# OnePhaseWEGO (onephase_wego design §2): ONE phase per round, ~4 s. Read only
# by the OnePhaseWEGO ruleset — TwoPhaseWEGO keeps phase_duration_seconds x
# phases_per_round above, untouched. 4.0 s @ 24 tps = 96 ticks/round; the
# design calls 4 s "the expected neighborhood, not a promise" — this is the
# round-length dial of §20 item 2.
round_duration_seconds = 4.0

# ---------------------------------------------------------------------------
# OnePhaseWEGO dials (onephase_wego design; §20 item 2 is this whole block).
# Read ONLY by the OnePhaseWEGO ruleset and its systems — nothing here is
# consulted under TwoPhaseWEGO / ContinuousRealtime, so no shipped golden can
# move when these change. Authored per-second / per-degree; config.py derives
# the integer tick counts (the tick-rate-independence convention).
# ---------------------------------------------------------------------------
[onephase]
# --- Time is the only currency (§3) ---
gcd_seconds = 0.5             # global cooldown; triggered by ACTIONS, never by
                              # movement, and never re-triggered inside one
                              # weapon's own salvo (§3)
weapon_swap_seconds = 0.75    # its own non-global cooldown; swapping is
                              # otherwise free (design intent: lots of swaps)

# --- Movement (§4/§6): speed is METRES PER SECOND ---------------------------
# Positions are continuous Q16.16 in a world with a physical tile size, so a
# speed authored in ticks-per-TILE silently means different things on levels
# with different tile_size_m — a marine crossing a 0.333 m tile in 8 ticks is
# doing 1 m/s, the same 8 ticks on a 1.0 m test tile is 3 m/s. Authoring m/s
# and deriving the cadence from the LEVEL's tile size fixes that: the marine
# moves at the same physical speed everywhere.
#
# 1.0 m/s reproduces the shipped feel on the 0.333 m/tile levels EXACTLY (the
# old 8 ticks/tile), so switching units changed nothing. It is a slow walk,
# though — a jog is ~3, a loaded sprint ~5 — and §5 says Move IS the old
# Sprint, so this dial probably wants raising once Erik has felt it.
move_speed_mps = 1.0

# --- Aim-relative fractions (§6), applied on top of the speed above ---------
move_speed_pct = 1.0                 # Move, no engagement — this IS the old Sprint
move_shoot_speed_pct = 0.7           # move & shoot, target ahead (band 0.6-0.75)
move_shoot_reverse_speed_pct = 0.25  # backpedaling with the gun on the door
reverse_angle_deg = 90.0             # aim-vs-travel angle at or beyond which a
                                     # move & shoot counts as REVERSING

# --- Accuracy = spread angle (§7). Multipliers on the weapon row's spread. ---
spread_move_shoot_mult = 2.0   # firing on the move opens the cone
spread_reverse_mult = 3.0      # backpedaling opens it further
spread_overwatch_mult = 0.85   # a narrowed overwatch cone aims slightly better

# --- Vision v1 (§8): UNLIMITED range; walls are the only limit ---
vision_cone_half_deg = 55.0      # facing cone half-angle
awareness_radius_tiles = 4.0     # short 360 deg hearing/peripheral radius
vision_profile_samples = 5       # silhouette sample points per axis for the
                                 # "largest exposed profile" metric (§9)

# --- Overwatch (§9) ---
overwatch_cone_half_deg = 55.0       # default when the player sets no width
overwatch_cone_min_half_deg = 10.0   # narrowest the player may dial
overwatch_cone_max_half_deg = 120.0  # widest

# --- Facing determines defense (§9): attacked from outside your arc ---
flank_damage_mult = 1.5            # any unit, hit from outside its facing arc
overwatch_rear_damage_mult = 1.75  # overwatch has a wider/harsher rear penalty
facing_arc_half_deg = 90.0         # the "front" arc half-angle for the above

# --- Ambush (§10) ---
ambush_stagger_ticks = 0   # §20 item 6: 0 = perfectly simultaneous volley;
                           # raise for a ragged-volley feel if play wants it

# --- Planning (§16) ---
planning_clock_seconds = 0.0   # submit-within-N timer; 0 = untimed (single
                               # player). Multiplayer sets it.
idle_return_fire = true        # §13 idle stance: return fire (false = do
                               # nothing — the §20 item 5 alternative)

[movement]
# Per-second tunables (tick-rate independent). config.py derives the integer
# *_ticks_per_tile counts via max(1, round(seconds * ticks_per_second)).
# Values chosen to reproduce the legacy 12-tps integers (9, 6, 4).
marine_attack_seconds_per_tile = 0.75       # 0.75 s/tile -> 9 ticks @ 12 tps
marine_cover_seconds_per_tile = 0.5         # 0.5  s/tile -> 6 ticks @ 12 tps
marine_sprint_seconds_per_tile = 0.33333333 # 1/3  s/tile -> 4 ticks @ 12 tps
xeno_sprint_ticks_per_tile = 1

[physics]
wave_c = 66.0                        # wave speed (tiles/s), ~c / 3 m/s physical
wave_damping = 3.0                    # wave velocity damping (1/s)
wave_transfer = 0.5                   # wave_p -> atmosphere transfer rate (1/s)
source_feed_rate = 200.0              # wave_source -> wave_p feed rate (1/s)
d_atm = 200.0                         # atmosphere diffusion (IMEX = no CFL limit!)
# Patch 2b (2026-06-22): smoke now moves on the REAL dt (the double-applied
# smoke_dt_scale=3.0 -> 9× fudge is GONE). advection_rate was bumped ×9 (100->900)
# to preserve the visible wind-ride; the smoke DIFFUSION is now ~9× weaker than
# the shipped build, so d_smoke (and the per-gas [gases.*] diffusion table) WANT A
# RE-TUNE by eye. "Tuning isn't sacred" — these are sensible defaults, not final.
d_smoke = 0.1                          # FLAG: ~9× weaker effective diffusion now (dt_scale removed) — re-tune
advection_rate = 900.0                # smoke wind-ride coefficient on the real dt (was 100 × dt_scale²=9)
breach_rate = 5.0                     # relaxation rate toward vacuum at hull breaches (1/s)
max_source_per_step = 10.0             # max wave energy fed per substep (IMEX handles big spikes)
wind_diffusion_scale = 50.0            # wind-dependent diffusion: D = d_smoke * (1 + scale * |wind|)
smoke_sink_strength = 2.0              # smoke-side sink-pull toward nearest breach (cells/hop along the breach-ward gradient, capped at 1 to follow the BFS path). 0 = off (sealed-room behaviour); >=1 = full per-hop pull. Sealed room always untouched. Binds at PhysicsRunner construction (restart, not Ctrl+R).
smoke_vent_hops = 16                   # Patch 2b: K = vent hops/tick — how many 1-cell breach-sink passes run each tick, decoupled from the wave CFL. Default ≈ the old n_wave so venting starts where it was. Erik tunes by eye (more = faster drain).
explosion_smoke_noise = 0.85           # per-tile contrast of the explosion smoke deposit (add_explosion_smoke). The per-tile multiplier is drawn uniform in [1 - noise, 1.0]: noise=0 => flat blob (no texture); noise=0.6 => the old [0.4,1.0] look; noise=0.85 (default) drops the floor to 0.15 so some tiles read near-empty (ragged holes / missing patches) giving the cloud visible initial texture for advection to grab; noise=1.0 => full contrast ([0.0,1.0], maximal holes). Seeded RNG => deterministic.
unit_permeability = 0.5                # gas/smoke permeability of a living unit's footprint (0 = seals, 1 = open; 0.5 = porous body slows flow)
unit_wave_absorb = 0.5                  # shockwave energy a living unit's footprint absorbs (0 = none, 1 = full; high = a body soaks the blast)
wave_absorb_strength = 8.0             # global scale on per-cell wave_absorb damping (tuned so units visibly soak the wave without nuking it)
burst_enabled = true                   # over-pressure wall failure (emergent pressure-relief valve)
burst_max_per_tick = 16                # cap on walls that may burst in one tick (anti-runaway)
physics_dt = 0.001                # 1ms (CFL stable for c=300 tiles/s)
physics_substeps = 8              # 8 * 1ms = 8ms physics per game tick

# Temperature / conduction constants (engine/06 §2, proposal §7.2). Q16.16
# domain shared with `heat` (TEMP_SCALE == HEAT_SCALE). The self/face shift
# tables are derived from `conductivity` ONCE at load using these; the runtime
# conduction pass is a pure signed-add + arithmetic right shift (no float, no
# divide) -> deterministic / bit-identical cross-machine.
[physics.thermal]
TEMP_SCALE   = 65536    # Q16.16, = HEAT_SCALE (shared temperature/heat domain)
SHIFT_AT_REF = 2        # metal self-rate = 1/4 (fastest stable on a 4-nbr grid)
SHIFT_MIN    = 2        # rate floor / stability bound: 4 faces * 1/4 = 1 (convex)
KAPPA_REF    = 50.0     # reference conductivity (hull) for the log bucket
NO_FACE      = 63       # sentinel: kappa==0 face / grid edge -> zero conduction
# Ambient cooling (engine/06 §3, proposal §3.3). Newtonian decay toward ambient
# (T_ambient == 0, since temperature stores ΔT above a reference): T -= T >> shift.
# Interior tiles use COOL_SHIFT; a tile whose 4-neighbourhood touches vacuum (or
# atmosphere < o2_vacuum_thresh) sheds via the smaller COOL_SHIFT_VACUUM, so a
# space-facing breached wall cools 4× faster. Pure signed-add + arithmetic right
# shift -> deterministic. These are the burn-out tuning dials.
#
# COOL-SHIFT AXIS (2026-07-30): the decay shift is now a PER-MATERIAL column
# (`cool_shift` on every [materials.*] row) — one global number cannot serve a
# thin hull plate and a wooden crate at once. These two globals are KEPT and
# still do two jobs:
#   * COOL_SHIFT is the DEFAULT for a material row that omits `cool_shift`
#     (and the solver's own fallback when no per-tile grid is supplied);
#   * the PAIR defines the VACUUM OFFSET: a vacuum-exposed tile cools at
#     max(SHIFT_MIN, cool_shift[tile] - (COOL_SHIFT - COOL_SHIFT_VACUUM)),
#     i.e. "two shifts faster == 4x" stays one rule for every material. With
#     every row seeded at 5 that reproduces 5/3 exactly.
COOL_SHIFT        = 5    # interior decay: T -= T >> 5 (~1/32 per tick, ~32-tick e-fold)
COOL_SHIFT_VACUUM = 3    # space-exposed decay: T -= T >> 3 (~1/8 per tick, 4× faster)
o2_vacuum_thresh  = 0.3  # atmosphere below which a 4-neighbour counts as vacuum-exposed

# EOS refactor P2 — unified temperature, gas-T dials (docs/eos_refactor_design.md
# §4, §9). TUNING DIALS (feel-gated, first real pass at P5); sane starting points.
gas_advection_rate = 900.0  # gas-T wind->displacement scale; SAME convention/value
                             # as [physics].advection_rate (smoke) — hot air rides the
                             # wind at smoke's visual rate until P3 makes `wind` a real
                             # velocity, at which point this dial goes away.
c_v               = 1.0     # gas heat capacity for the radiation deposit
                             # ΔT = ΔE/(N·c_v) (§4.3). 1.0 = neutral scale (ΔT≈ΔE at
                             # ambient N=1.0); no real-gas anchor yet (P3 territory).
n_floor_heat      = 0.01    # floor on the per-tile N divisor (the real bulk N_total
                             # since P3) for the SAME deposit divide, SHARED by BOTH
                             # deposit sites — this Pass-1 gas branch AND combustion's
                             # aggregate deposit (combustion.cpp:799-803, ONE floor in
                             # the system) — INDEPENDENT of o2_vacuum_thresh / any
                             # other floor.
                             # RULING (energy-books arc, design v2.2 §2.2, Erik
                             # 2026-08-17): now a LOW, tunable VALUE-HYGIENE dial —
                             # default 0.01 (was 0.05), swept DOWNWARD during tuning.
                             # Its STABILITY job is GONE: P-E1 closed the EOS
                             # transport books (deposit spikes at thin cells dilute
                             # honestly on contact now, instead of minting via the old
                             # SL T-copy) and T_MAX_PHYS is the real value backstop
                             # for a single-tick spike (a COUNTED clamp — see that
                             # dial). The v1 single-tick criterion below this comment
                             # (n_floor_heat >= heat_tick_max/(T_MAX_PHYS*c_v)) is
                             # STALE — it argued for RAISING the floor to protect
                             # T_MAX_PHYS, which no longer needs protecting from this
                             # angle. The OLD 0.2-trial warning ("measurably perturbed
                             # marginal ignition timings") is MOOT IN THIS DIRECTION:
                             # a LOWER floor deposits MORE into thin cells (dividing
                             # by a smaller floor raises ΔT), so marginal ignition
                             # trends FASTER, not slower, as the floor drops — the
                             # opposite of the 0.2-raise trial's regime. The
                             # reciprocal divide's precision was verified sane down to
                             # 0.001 (tools/e2b_floor_reciprocal_probe.py); the v1
                             # 0.25-shared-with-the-trust-gate ruling is retired (see
                             # n_work_ref, [physics.eos], for the unrelated trust-gate
                             # dial — plumbed this patch, mechanism lands at P-E4).
T_MAX_PHYS        = 16000.0 # v2.4 counted physical-maximum rail on the temperature
                             # FIELD (K above ambient), ~2x the design's stated 9000 K
                             # extreme — clamps every T deposit/write path (EOS step 4c,
                             # thermal Pass 1, combustion), each with a hit counter.
                             # Stands in for the fast equilibration a real near-vacuum
                             # gas would have (its T is thermodynamically ill-defined).
                             # Full rationale: cpp/src/eos_solver.h. PROVISIONAL,
                             # Erik review at P5.

# Fire / ignition-from-temperature (engine/06 §4, proposal §6 step 4b). The READ
# side of the temperature substrate: a flammable tile whose `temperature` (set by
# the conduction pass above) crosses its quantized `ignition_temp` AND has oxygen
# ignites via `fire = max(fire, ignition_seed)`. This is a SECOND ignition path
# that runs alongside the existing cellular fire spread (it does not replace it).
# Dormant in-game until fire/beams emit heat (temperature is ~0 with no sources).
# EOS refactor P4 (docs/eos_refactor_design.md §6): o2_threshold now reads the
# REAL N_O2 scale, not the old atmosphere/P (~1.0 ambient) scale — see the
# o2_threshold/P_min/P_full recalibration note in the fire feedback block below.
[physics.fire]
ignition_seed = 0.12   # seed fire intensity a temperature-ignited tile gets (I_seed) — P-K0: promoted from tools/fire_tune_loop.py TUNE (P-F1b + Erik's 2026-08-13 session; was 0.1)
# o2_threshold RETIRED (continuous-O2 law, docs/continuous_o2_law_design_2026-07-24
# .md §2.4): ignition now reads the O2 MOLE FRACTION and ignites iff X > o2_frac_ext
# (the SAME extinction limit the fire sustain uses — one law), NOT an absolute-N_O2
# mean. Left here so old configs do not hard-error; no longer read.
o2_threshold  = 0.01  # RETIRED — see o2_frac_ext (fire feedback block below)

# --- Signed-logistic fire FEEDBACK (fire_design_proposal §2/§3/§5) ------------
# Cellular spread is DELETED: spread is now radiation -> heat -> temperature ->
# ignition (apply_temperature_ignition above). The fire step is purely the
# life/death of an already-lit tile. Per burning tile of intensity I in [0,1]:
#   T     = temperature[i] / TEMP_SCALE              (game units; ignition_temp=300 wood)
#   F     = clamp01(wall_hp[i] / hp_of_THIS_tile)    (fuel fraction remaining, per
#           MATERIAL — the [materials.*] hp column, via GameMap.fuel_recip; see the
#           fuel_ref tombstone below)
#   O2    = mean REAL gas[o2] over open (non-solid,non-vacuum) 4-neighbours
#           (EOS refactor P4 — was the atmosphere/P proxy; design §6, item 3)
#   W     = |wind| from the SHARED wind field (= -grad p, incl. shockwaves)
#   hot   = clamp01((T - fire_T_ext) / fire_T_span)
#   o2    = smoothstep(P_min, P_full, O2)            (the REAL local O2 gate)
#   avail = F * o2
#   grow  = k_grow * avail * hot * I*(1-I) * (1 + k_wind_fan*W)   (logistic, wind-fanned)
#   die   = k_die*(1 - avail*hot)*I + k_wind_strip*W*(1-I)*I      (decay + wind blow-out)
#   I    += dt*(grow - die);  clamp01;  if I < I_min -> 0 (snap-extinguish)
# Plume: temperature[i] += the plume->T shim deposit (fire_pressure_gain-scaled,
#   self-limiting on `atmosphere[i]/p_expand_ref` — unchanged by P4, still reads
#   REAL pressure, not O2) -> p* rises -> wind points OUTWARD -> smoke pushed away.
# A sealed-room fire over-pressurises -> may pop a weak wall (find_burst_walls) -> vents
# -> P falls -> starves; ALSO now (P4) the room's REAL O2 depletes as it burns ->
# o2 -> 0 -> starves even in a wall that never bursts. Both emergent. Erik tunes
# all of these live.
k_grow            = 0.5    # logistic growth gain (1/s) — TEMPO only since P-R3. P-K0: promoted from TUNE (P-F1b 4.0->2.0, Erik 2026-08-13 2.0->0.5, slower ramp)
k_die             = 0.008  # decay rate when starved/cold (1/s). P-K0: promoted from TUNE (P-F1b 2.0->0.008 — the death wall; puts extinction at X=0.1335, just above o2_frac_ext=0.13, so the oxygen limit is binding)
# THE CAPACITY LAW (P-R3, 2026-07-31 — docs/radiation_raycaster_extinction_
# ruling_2026-07-31.md A3, on Erik's ruling R-b). The growth term's carrying
# capacity used to be the hardwired constant 1 (the `(1-I)` factor); it is now
# RESOURCE-PROPORTIONAL, `I_cap = I_cap_per_avail * avail * hot`:
#     gap  = avail*hot - I/I_cap_per_avail        (SIGNED; negative = shrink)
#     grow = k_grow * I * gap * (1 + k_wind_fan*W)
#     I_eq = c*(a - r*(1-a)) ~= c*a,  a = F*o2f*hot,  r = k_die/k_grow
# WHY: `r` used to set BOTH the equilibrium intensity AND the extinction wall
# (`I_eq = 1 - r(1-a)/a`), so asking for a small fire (I_eq 0.21) left only
# 1.242x of headroom on the product `F*o2f*hot`. Measured consequences (ruling
# §5): only 19.5% of a crate's hp could EVER burn — fuel-governed death was
# unreachable at any dial — and `o2_frac_ext` = 0.13 below was dead code,
# because the logistic wall bit first at X = 0.1944. Now each dial has one job:
# `I_cap_per_avail` = SIZE, `k_grow` = TEMPO, `k_die` = where the death wall
# sits. `<= 0` legally means "capacity ceiling OFF" (unbounded growth).
I_cap_per_avail   = 14.0   # capacity per unit availability: I_cap = c·a — the SIZE dial; ruling 2026-07-31 A3. P-K0: promoted from TUNE (P-F1b 2.53->14.0, SIZE)
# fire_T_ext: SUPERSEDED as the extinction floor (P-R3, ruling A3 ride-along).
# It is a PER-MATERIAL quantity — it sits on the same physical axis as the
# per-material `ignition_temp` — and this global, at 350, exceeded BOTH shipped
# ignition temps (wood 300, furniture 280), so a tile could ignite at 300 and be
# permanently below its own extinction floor. It is now DERIVED per material as
#     fire_T_ext[mat] = ignition_temp[mat] - ignition_to_ext_delta
# (furniture 280-100 = 180, wood 300-100 = 200), baked into
# GameMap.fire_T_ext_plane, which makes `fire_T_ext < ignition_temp` STRUCTURAL
# instead of a rule a config author has to remember. KEPT (like fuel_ref /
# o2_frac_amb below) because the solver still uses it as the FALLBACK when a
# caller supplies no per-tile plane; the live engine always supplies one, so
# this value no longer affects the game. Editing it will NOT move the fire —
# edit the material's `ignition_temp`, or the Δ below.
fire_T_ext        = 350.0  # FALLBACK extinction temperature (inert in the live engine)
ignition_to_ext_delta = 200.0  # fire_T_ext[mat] = ignition_temp[mat] - Δ (ONE global, zero new per-material columns; ruling 2026-07-31 A3). P-K0: promoted from TUNE (P-F1b 100->200, knee geometry — the FOOT)
fire_T_span       = 180.0  # width of the `hot` ramp above fire_T_ext (STAYS global — a WIDTH, not a foot). P-K0: promoted from TUNE (P-F1b 150->180, knee geometry — the WIDTH)
# fuel_ref: SUPERSEDED as the fuel normaliser (fuel-fraction axis, 2026-07-30).
# F means "the fraction of THIS tile's fuel remaining", so its divisor is the
# tile's OWN material hp — a PER-MATERIAL quantity. This global is 60.0, which is
# WOOD's hp, so every other flammable material read a permanently wrong fraction:
# a full-health furniture crate (hp 30) reported F = 0.5, half burnt out before it
# was ever lit. Since sustain needs k_die/k_grow < a/(1-a) with a = F*o2f*hot, that
# halving alone put a crate fire below the ceiling at ambient O2 at ANY intensity
# or temperature (measured 2026-07-30: the crate's T rose correctly and the fire
# still died). Lowering this global is NOT the fix — at 30, wood (hp 60) would sit
# clamped at F = 1 until it had already lost half its mass, destroying its
# burn-down curve. The divisor is now baked per material from [materials.*].hp
# into GameMap.fuel_recip. KEPT (like o2_frac_amb / o2_threshold above) because
# the solver still uses it as the FALLBACK divisor when a caller supplies no
# per-tile plane; the live engine always supplies one, so this value no longer
# affects the game. Editing it will NOT move the fire — edit the material's hp.
fuel_ref          = 60.0   # FALLBACK wall_hp normaliser (inert in the live engine)
# EOS refactor P4 RECALIBRATION (design §6): P_min/P_full used to be read against
# `atmosphere` (P), where ambient == 1.0. They now read REAL gas[o2], where
# ambient == ~0.21 (the P1 calibration: 0.21*N_amb O2 / 0.79*N_amb inert_N2, P1
# §2.1). P4's first rescale preserved the OLD 60%-of-ambient cutoff fraction
# (P_min = 0.60*0.21 = 0.126, P_full = 0.21).
# v2.4 SECOND RESCALE (eos-p3fix-thermal-ceiling; PROVISIONAL, Erik review at
# P5): onto the HOT-ZONE-EQUILIBRIUM scale. Derivation: at ideal-gas pressure
# equilibrium (P = C*N*T), the gas density beside a flame is
#     N_local ~= N_amb * T_amb_abs / T_air_abs
# so air at flame-zone temperatures (measured ~3-4 kK-rel with the v2.4
# absorption-proportional deposit) holds N ~= 0.07-0.09, i.e. N_O2 ~= 0.015-
# 0.02 — the 0.126 gate implicitly assumed NEAR-AMBIENT density at the flame
# edge, an atmosphere-proxy-era assumption P = C*N*T revokes. (Real fires keep
# their flame edge oxygenated by buoyant entrainment — fresh air drawn in at
# the base; this 2D no-gravity model has no buoyancy, so the gate scale
# compensates.) Measured sweep (branch report): 0.01/0.03 restores STRONG
# O2-differentiation (sealed 172 / vented 49 / flooded 39 ticks) and the
# original ignition budgets (dragon dist-3 t=28) through genuine oxygen
# physics; 0.02/0.05 differentiates weakly (44/42/39); 0.005/0.02 never
# starves a sealed fire.
# v2.5 re-measure (P5.1 stoichiometric fuel, design §5 v2.5 / decisions #17):
# the trio is now sealed 265 / vented 48 / flooded 39 — the ember-scale fuel
# drain weakens F and a weaker sealed flame starves its room more slowly.
# Ordering preserved, still bit-stable under the 1e-5 dial perturbation gate
# (test_payoff_orderings_perturbation_robust).
# Continuous-O2 law (docs/continuous_o2_law_design_2026-07-24.md): the O2 sustain
# factor is now LINEAR in the local O2 MOLE FRACTION X = Σn_o2/Σn_total over open
# neighbours, with an extinction limit — o2f = clamp01((X - X_ext)/(X_amb - X_ext)).
# This REPLACES the smoothstep(P_min, P_full) on ABSOLUTE n_o2 below. The fraction
# is invariant under thermal expansion, so the v2.4 hot-zone-equilibrium rescale
# saga (the whole P_min/P_full recalibration note above) is CLOSED — only true
# vitiation (products displacing O2), not hot thin gas, starves a fire.
#   o2_frac_ext  = X_ext  (flame-extinction limit; 0 => Erik's pure X/X_full proportional)
#   o2_frac_full = X_full (the FULL-RESPONSE reference: the O2 mole fraction at which
#                          o2f reaches 1. This is NOT the ambient atmosphere.)
#   o2_frac_amb  = X_amb  (what the ambient atmosphere IS; per-map, reads the level's
#                          [ambient] o2_frac. NO LONGER read by the fire/combustion laws.)
# FULL-RESPONSE REFERENCE SPLIT (2026-07-30): the denominator used to be X_amb, so
# ambient air always gave o2f = 1 and the clamp01 made AMBIENT the ceiling — every
# enrichment route (O2 reservoirs, leaks, wind delivery) was invisible BY CONSTRUCTION
# (at X = 0.30 the raw ratio 2.125 clamped straight back to 1.0). Normalizing by PURE
# O2 makes o2f a true physical fraction — "O2 above extinction, normalized to pure
# oxygen" — the clamp effectively never binds, and headroom always exists. Ambient air
# now lands at (0.21 - 0.13)/(1 - 0.13) = 0.092. This is a NORMALIZATION FIX, not a new
# feature: setting o2_frac_full = o2_frac_amb reproduces the pre-split law exactly.
# RE-TUNE PENDING (design §5): X_ext is a feel dial re-fit jointly with k_grow/k_die/
# wall_damage/burn_rate AFTER this + the sky-exchange build merge. The split rescales
# the whole avail axis by ~10x, so k_die/k_grow moves with it — Erik's loop, not here.
o2_frac_ext       = 0.13   # X_ext — physical flame-extinction O2 mole fraction (~13%)
o2_frac_full      = 1.0    # X_full — o2f reaches 1 at PURE O2. NOT ambient, NOT per-map.
o2_frac_amb       = 0.21   # X_amb — what the ambient atmosphere IS (overridden per-map by [ambient] o2_frac)
P_min             = 0.01   # RETIRED (see o2_frac_ext/amb above) — smoothstep low edge on absolute n_o2
P_full            = 0.03   # RETIRED — smoothstep full edge on absolute n_o2
