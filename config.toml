# --- W4 SPRAY rounds (mechanics/03 §5): per-tick cone deposits. damage = 0 —
# a spray NEVER touches a unit directly (two-terminals invariant): the
# Dragon-7 heats the WORLD and the existing heat|max exchange row does the
# unit damage; the Miasma Vent gasses the world and the gas[poison] row does.
# Per member tile the deposit is column / max(1, isqrt(dx^2+dy^2)) — the
# documented integer 1/distance falloff — quantized once at the FieldEdit
# write boundary.
[ammo.fuel_standard]
family = "fuel_tank"
damage = 0                            # sprays apply no packets, ever
dtype = "heat"                        # bookkeeping only (no packet path)
ap = 0
# heat_deposit — flame heat energy per tick at distance 1 (falloff /dist).
# STANDARD VALUE, derived from the engine/06 convert path (Erik's dial).
# W6 RESCALE (rides the dragon_7 range_m = 10 rescale — same derivation
# discipline as W4's 400, new target):
#   convert:  temperature += heat >> log2(thermal_mass); wood mass 8 -> D/8
#   cooling:  T -= T >> COOL_SHIFT(5) per tick        -> ~1/32 loss (interior)
#   so at a sustained per-tile deposit D:  T(n+1) = (T(n) + D/8) * 31/32
#   -> steady state T_inf = 31*D/8 ~= 3.875*D,  T(n) = T_inf*(1-(31/32)^n)
# TARGET: ignition reach must TRACK the new 10 m range on the playground grid
# (0.333 m/tile -> range_tiles 30). The falloff divisor is the integer TILE
# distance d, so sustained-jet ignition needs T_inf(d) = 3.875 * D/d >= 300
# (wood), i.e. D >= 77.4 * d; the far edge d = 30 needs D >= 2323 ->
# heat_deposit = 2400 (the round standard value; full-cone reach ~31 tiles).
# Time-to-ignite from T(n): within ONE 36-tick burst (1.5 s) the jet crosses
# 300 out to d ~ 21 (T_inf >= 440); within ~1 s (24 ticks) out to d ~ 16
# (5.5 m) — "most of the cone within ~1 s", the near half instantly:
#     d 2  (D 1200, T_inf 4650): ~2 ticks     d 8  (D 300, T_inf 1162): ~9
#     d 16 (D 150,  T_inf  581): ~24          d 21 (D 114, T_inf  443): ~36
#   beyond d ~ 21 the direct jet needs a second burst — and in practice the
#   fires it started radiate (k_fire_heat) and cascade the front outward.
# NOTE the derivation is grid-anchored: d is TILES, so on the 1.0 m/tile test
# worlds (range_tiles 10) the same 2400 ignites the WHOLE cone near-instantly
# — pinned there as the ignition-reach gate. Interesting range: ~800 (torch:
# reach ~10 tiles) .. 4800 (the dragon_9_heavy value — reach ~62 tiles).
heat_deposit = 2400.0
# fuel_gas haze rides the same cone (engine/05 §6.2 slice; flammable = the
# future per-gas combustion hook, M3). Small on purpose — an ignition-hazard
# accent, not the damage mechanism. 0.15/tick at dist 1, falloff /dist.
gas_species = "fuel_gas"
gas_amount = 0.15

[ammo.toxin_standard]
family = "toxin_tank"
damage = 0
dtype = "poison"                      # bookkeeping only (no packet path)
ap = 0
# Sustained poison emission — bigger than the grenade cloud's one-shot
# deposit (poison_cloud: 1.0 once) because it accrues EVERY tick of a
# 36-tick burst against transport/diffusion: 0.35/tick at dist 1 paints the
# near cone to lethal density (the [0,1] clamp saturates) in ~3-4 ticks and
# HOLDS it there while the vent is open. Damage rides the W3 gas[poison]
# exchange row (poison_dps x density; zombies immune — they don't breathe);
# NO blindness: poison is not teargas (no can_aim coupling on this species).
# STANDARD VALUE — interesting range 0.1 (a creeping haze) .. 1.0 (an
# instant wall of chlorine).
gas_species = "poison"
gas_amount = 0.35

