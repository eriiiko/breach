# 0.15 base x arc multiplier (x1 front / x2 flank / x4 behind) -> a strike
# from BEHIND crits at 60% for 70 damage — one silent near-kill on an
# unaware human (hp 100). STANDARD VALUE, Erik's dial: interesting range
# crit_chance 0.05 (utility blade) .. 0.30 (monomolecular edge).
crit_chance = 0.15
crit_mult = 2.0
# melee_damage/melee_dtype = the strike packet (weapon-row columns — no ammo
# row to carry them). 35 KIN: two body hits or one behind-arc crit + one to
# drop a marine-class target. STANDARD VALUE: 20 (shiv) .. 50 (power blade).
