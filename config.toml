wall_damage       = 0.03   # wall HP lost per second per unit intensity (KEPT — the burn-out brake). P-K0: promoted from TUNE (P-F1b 0.4->0.03, BURN DURATION: 8 min kindling / 24 min furniture)

# --- K2: fire as a sim-side heat ray source (proposal §1, fire_design_notes) --
# Each burning tile (fire > 0) becomes a short-range heat `LightSource` cast IN
# THE SIM at the START of the physics step, BEFORE the TemperatureSolver, so this
# tick's fire heat converts to temperature this same tick. The cast deposits ONLY
# into `gmap.heat` (Q16.16, saturating-add, attenuated by `heat_atten` per K1) —
# the render-side light glow is a separate later step. DETERMINISTIC: fixed ray
# count, fixed angles (no RNG), fixed row-major source order, integer add.
#
# Per burning tile of intensity I (fire value in [0,1]):
#   heat       = k_fire_heat * I                 (the gameplay payload — energy)
#   max_range  = range_base + range_per_I * I    (tiles; hotter fire reaches farther)
#   intensity  = intensity_base + intensity_per_I * I   (ray light weight; ~render)
#   ray_count  = fire_ray_count  (FIXED 8, no auto, no jitter)
#   color      = warm orange (render-only tint; heat is the sim payload)
#
# k_fire_heat is tuned (proposal §1 target): a lone burning tile (I=0.8) self-
# heats its own wood cell and conducts toward an adjacent wood wall's ignition_temp
# (300) so the neighbour crosses it over a FEW SECONDS (~1.5 s here — toward but
# not instantly past), while the existing cellular fire spread (spread_rate 0.3,
# neighbour ignition in a few ticks) still DOMINATES the spread. The heat path
# mainly adds unit damage + a slow secondary heat-ignition; it does NOT firestorm
# the map in a couple of ticks. Erik tunes this live. (`temperature` is ΔT in
# game units above a 20° reference, not literal Celsius — a fire reads hot.)
# PURE-DENSITY RE-TUNE (engine/08 §Falloff is density, 2026-06-28): the raycaster
# now divides each source's emitted power by its ray count (energy = power/N), so
# `heat` here is the burning tile's TOTAL heat power, no longer a per-ray amount.
# The old per-ray value (200) summed to ~8× at the source over the 8 fixed rays;
# to preserve the same deposited energy (and ignition/kill behaviour) it is scaled
# by fire_ray_count -> 1600. (Heat now radiates with a physical 1/r reach instead
# of the old steep 1/(1+d²) — slightly longer reach is the intended improvement.)
# k_fire_heat TOMBSTONE (P-R4, 2026-08-01): dead key — THE PAINTER IS GONE. The
# one-way `heat = k_fire_heat * I` deposit violated the arc's one rule twice (it
# deposited the same per-ray energy at EVERY marched cell — a 5-cell ray
# deposited 5x its payload — and nothing was ever debited from the source), and
# it is replaced by an antisymmetric net-T⁴ EXCHANGE whose magnitude comes from
# the emitters' own temperatures through `rad_scale` below. Nothing reads this
# key; it is left as a comment so an old config does not hard-error.
# See docs/radiation_raycaster_extinction_ruling_2026-07-31.md A1.
#
# --- P-R4: the net-T⁴ radiation exchange (ruling A1) --------------------------
# For every (emitter s, absorbing marched cell r) pair the ray march enumerates:
#   net       = a_s * a_r * tau * w * (E°[T_s] - E°[T_r])   (signed, Q16.16 counts)
#   rad_net[r] += net;   rad_net[s] -= net                   (the SAME integer)
#   survival  *= (1 - a_r)                                   (AFTER the deposit)
# with a_x = the material's `heat_atten` (absorptivity == emissivity, Kirchhoff),
# tau the running material transmittance, w = 1/fire_ray_count, and E° the baked
# black-body table E°(T) = rad_scale * (293 + 3*T_game)^4 — the canonical
# game-T -> Kelvin map now lives in [physics.temperature_scale]
# (kelvin_ambient=293, k_temp_to_kelvin=3); this is the SAME map baked into
# the raycaster's E° table, render blackbody, and the tuning tools (P-K2,
# docs/temperature_scale_unification_design_2026-08-13.md §2/§3a-b).
#
# rad_scale — THE EMISSION CALIBRATION. It folds sigma, the 0.833 m² tile face,
# the per-tick dt and the game->Kelvin mapping into one number: heat counts per
# K^4. RE-ANCHORED AT P-K2 for the ×3 map (was 1.0e-5, derived under the old
# ×2 map 293 + 2*T_game): the value is chosen to PRESERVE EMITTED FLUX at the
# P-F1b plateau anchor T_a = 300 game, which reads K=893 under the old map and
# K=1193 under the new one —
#     rad_scale' = 1.0e-5 * (893/1193)^4 = 1.0e-5 * 0.313938 = 3.1394e-6
# (the ONE shipped literal — exactly one so two machines syncing config.toml
# via git can't diverge). Flux is IDENTICAL at the plateau; E'/E ratio vs. the
# old map: 0.31 @ T=0, 0.87 @ 200, 1.00 @ 300 (the anchor), 1.09 @ 400,
# 1.21 @ 600, 1.34 @ 1000, asymptote 1.59 — never exceeds 2x.
#
# The config's own two-tile ignition inequality, RE-DERIVED under the ×3
# anchors (was: furniture a=0.5, his=3, cool_shift=9, a 443-game emitter
# K_s=1179, the 280-game ignition point K_r=853, needing rad_scale >= 6.5e-6
# at two tiles, ×1.54 margin under the shipped 1.0e-5):
#     T_r/2^cool_shift = a_s*a_r*(n_rays/8)*rad_scale*(K_s^4 - K_r^4) / 2^his
# with the SAME furniture a=0.5, his=3, cool_shift=9 but K_s = 293+3*443 =
# 1622 and K_r = 293+3*280 = 1133, the required rad_scale for ignition at two
# tiles is ~1.73e-6; the shipped 3.1394e-6 clears it with ×1.82 margin (up
# from ×1.54 — the steeper ×3 map makes ignition EASIER at a given rad_scale,
# not harder). RE-TUNE AT P-R5 with cool_shift (the two multiply).
rad_scale            = 3.1394e-6 # heat counts per K^4 in the baked E° table
# T_emit_gate — who CASTS. Emitters are burning tiles UNION thermal solids at or
# above this temperature. RECEIVERS ARE FREE: the net form accounts a cold tile
# fully on the flame's own rays, so a crate never needs to emit to be heated
# correctly. This gate only decides who can radiatively LOSE heat and warm
# others. 180 game = 653 K (Erik, 2026-07-31). LOWER = the FEEL lever (warm
# objects gently toasting their surroundings) and costs emitter count; HIGHER =
# the COST lever and costs post-fire glow. Ruling A1.8.
# P-K0: promoted from TUNE (P-F1b 180->310 — at 180 a receiver became an
# emitter too early and its ceiling collapsed to E_s/15, stalling spread).
T_emit_gate          = 310.0  # game units; below it a hot solid does not cast
# --- P-F1a / v7 rule 4: RADIATION_RANGE --------------------------------------
# The reach of an EMISSION ray, in tiles. A STABILITY-CLASS CONSTANT, NOT A FEEL
# DIAL — do not tune it for look.
#
# WHY IT EXISTS. Under P-R4 an emission ray died at `range_base +
# range_per_intensity * I` (~2-5 tiles), so "the ray ran out of reach" and "the
# ray left the world" were different events and the books could not tell them
# apart. That is the CORRIDOR LEAK: a fire in a long room lost less than the
# same fire in a short one, because its rays expired mid-air and were charged to
# nobody. Setting the range at or above the GRID DIAGONAL makes reach-termination
# structurally unreachable before the world edge, so "genuinely escapes" ==
# "left the world", map-independent — which is what lets rule 4's sky term be
# the ONLY ledger entry and lets gate (ii) close exactly.
#
# THE FLOOR. The largest shipping level is 128 x 256 => diagonal
# sqrt(128^2 + 256^2) = 286.22 => the floor is 287. 320 carries ~12% headroom for
# a larger level without a law change. RAISING it is always safe; LOWERING it
# below the diagonal of any shipped level reopens the leak.
#
# THE COST, and what pays for it. A long ray costs march STEPS, not deposits —
# an air cell is one DDA step and a bounds test. What makes that affordable is
# the MANDATORY PURE-RADIATION FAST PATH: emission rays skip ALL RGB, direction
# and gas-optics work (no exp anywhere), doing only the integer exchange terms
# and the heat_atten survival. Fire's VISIBLE LIGHT is a SEPARATE, SHORT second
# cast that still uses `range_base`/`range_per_intensity` below and the unchanged
# light machinery — so the render output is untouched.
RADIATION_RANGE      = 320.0  # tiles; MUST be >= the largest level's diagonal (287)
fire_ray_count       = 8      # FIXED rays per burning tile (no auto-count, no RNG dither)
# range_base / range_per_intensity: RENDER + LEGACY duty only since P-F1a. They
# set (a) the short visible-light cast's reach and (b) D3's `damage_range` — the
# deterministic distance guard on the rad_flux SENSOR write, which keeps unit
# radiant damage at exactly its old reach (v7.1 item 4) even though the emission
# ray now crosses the map. They do NOT bound an emission ray.
range_base           = 2.0    # max_range = range_base + range_per_intensity * I  (tiles)
range_per_intensity  = 3.0
intensity_base       = 0.3    # ray light intensity = intensity_base + intensity_per_I * I
intensity_per_intensity = 0.7
color                = [1.0, 0.45, 0.12]   # warm orange (render-only; heat is colourless)
# coarse_cluster TOMBSTONE (P-R1, 2026-07-31): dead key — Raycaster::coarse_cluster and the orphaned update_from_fire path it only ever fed (no production caller) were both deleted when the fire source build moved into C++ (cast_from_fire_plane); see docs/radiation_raycaster_extinction_ruling_2026-07-31.md A4.2.

# Water pipe model (engine/07 §2, water plan W2). The C++ WaterSolver advances
# gmap.water_depth (metres of standing water) each tick: damped velocity kick +
# donor-cell upwind flux + per-cell outflow limiter. All keys are RESTART-BOUND
# (engine/12 §5: PhysicsRunner binds once at construction; Ctrl+R does NOT
# re-bind solver params). `dx` has no key — it binds from the level's
# tile_size_m, never assumed. No `substeps` key either: the count is derived
# house-style from the solver's CFL bound, n = ceil(sim_time / max_dt()) — 3 at
# 24 tps with the shipped k_p = 0.5 (2 with k_p = 0). ratio_cap/flood_eps drive
# the W3 displacement; boil_* drive the W5 flash-boil (steam_yield is SHARED
# with the fire side's evaporative heat-boil, so all steam puffs consistently).
# gamma_r/h_cap/k_amp/k_splash drive the W6a ripple — the VISUAL-ONLY surface
# wave (canon §6): it never feeds back into transport.
[physics.water]
g = 9.81          # m/s^2
damping = 1.0     # 1/s pipe friction (prototype-validated: fluid_test.py used 1.0)
v_max = 8.0       # m/s velocity clamp (paired with the C++ outflow limiter)
depth_eps = 1e-5  # m dry snap
k_p = 0.5         # pressure head m/atm — ON (W4): THE tuning dial. Physical 10.3 is excluded by feel
                  # (wave_p rings ~1 s vs a real blast's ms) AND by numerics: the head stiffens the wave,
                  # c_eff = sqrt(g*h*(1 + k_p*P/free_h)) — near-flooded cells (free_h -> 0) are the worst case.
ceiling_h = 2.5   # m air column (W3 displacement + the solver's h_ref CFL reference)
ratio_cap = 1.5   # max per-tick compression ratio (W3)
flood_eps = 0.05  # m remaining air column below which a cell counts flooded (W3)
boil_rate = 0.02      # m/s flash-boil sink in near-vacuum (W5)
boil_p_thresh = 0.3   # atmosphere below this boils (W5; pressure-keyed — drained rooms boil too, intended)
steam_yield = 4.0     # steam density per metre boiled (W5)
gamma_r = 2.0     # 1/s ripple damping (W6a)
h_cap = 0.25      # m deep-water cap: c^2 = g*min(depth, h_cap) — pins ripple speed at ~4.7 tiles/s (W6a)
k_amp = 0.5       # ripple amplitude clamp |ripple| <= k_amp*depth — waves no taller than the water (W6a)
k_splash = 2.0    # wave_p -> ripple_v splash gain (W6a) — PURE FEEL DIAL, awaiting Erik's eyeball with W6b

[smoke]
# Ray-engine smoke optics (ch.05 §6.1 §6 — decoupled per-channel absorption vs
# glow). Two INDEPENDENT budgets, NOT constrained to absorb + glow = 1:
#
#   transmission:  tau_c = absorption[c] * density * absorb_scale; trans_c = exp(-tau_c)
#   scatter/glow:  smoke_glow[c] += local_light[c] * scatter_albedo[c] * density   (additive)
#
# smoke_absorb_scale is the global "beam reach" dial. Dial it DOWN for the
# long-beam "flashlight travels far through smoke and still glows" look Erik
# wants (exp(-tau) never hard-zeroes the beam, so it survives deep smoke). Dial
# it UP for a beam that dies fast. Defaults below approximate the shipped look:
# exp(-1.4*density) tracks the old (1-density) attenuation at mid density, and
# scatter_albedo = [1,1,1] reproduces the shipped god-ray glow magnitude.
# Per-channel absorption != grey enables COLOURED smoke later (per-channel = hue).
smoke_absorption = [1.0, 1.0, 1.0]       # Beer-Lambert per-channel absorption (R,G,B)
smoke_scatter_albedo = [1.0, 1.0, 1.0]   # additive god-ray/glow gain (R,G,B), decoupled from absorption
smoke_absorb_scale = 1.4                 # beam-reach dial: LOW = long beam (flashlight travels far), HIGH = beam dies fast
# NOTE (Fire & Heat Beauty B2 §3/§6): the old `smoke_render_gamma` render-
# contrast dial was DELETED here — the physical gas-medium pass's tau-curve
# ([render.gas_medium] tau_curve_a / tau_curve_b) subsumes it (contrast now
# lives in TAU-space, before Beer-Lambert, not on the packed alpha). The legacy
# A/B smoke path bakes the old 1.5 default as a frozen constant in
# renderer/game_renderer.py (_LEGACY_SMOKE_GAMMA).

# Multi-gas material table (engine/05 §6.2). Smoke generalises from one scalar
# field to N gas density fields, one row per gas, sharing the SAME diffusion +
# advection solver (all gases ride the same wind). A gas type is data-driven,
# exactly like a material: one [gases.<name>] row. Loaded by
# simulation.gases.GasTable into per-gas arrays (absorption Nx3, scatter Nx3,
# diffusion, decay, flags) + a name->index map.
#
# Columns (research-approved values, §6.2):
#   absorption     [R,G,B] per-unit-density Beer-Lambert absorption (subtractive
#                  tint of transmitted light). M2 sums these density-weighted
#                  across coexisting gases in the raycaster; M1 only loads them.
#   scatter_albedo [R,G,B] additive god-ray/glow gain (decoupled from absorption,
#                  NOT constrained to absorb+glow=1).
#   diffusion      per-gas base diffusion coefficient (the per-gas d_smoke the
#                  transport loop binds before stepping that slice).
#   decay          per-tick decay rate (LOADED for M2/M3; NOT yet applied in
#                  transport — the M1 solver has no decay term, so applying it
#                  would break behaviour preservation; see physics_runner).
#   flammable      ignites where density > threshold (fuel_gas only) — read M3.
#   emits_when_hot black-body emission driven by the heat buffer — read M2/M3.
#   effect         per-gas gameplay tag, read unit-side in mechanics (not here).
#   conservative   EOS refactor P1 (docs/eos_refactor_design.md §2.1/§2.2):
#                  true ONLY for the bulk pair (o2 / inert_n2) below — routes
#                  that plane to donor-cell CONSERVATIVE flux transport
#                  (bulk_transport.cpp) instead of this per-gas semi-Lagrangian
#                  loop. False for every trace gas (unchanged behaviour).
#
# smoke is combustion soot — what fire and explosions emit. Its diffusion
# (0.10) matches today's d_smoke (0.1), so mapping the EXISTING generic smoke to
# the smoke slice is behaviour-preserving (engine/05 §6.2; M1).

# EOS refactor P1 calibration constants (docs/eos_refactor_design.md §2.1).
# Pressure is derived as P = C * N_total * T (Kelvin) once the compressible
# solver lands (P3); nothing physically consumes these yet (P1 is additive-
# only) — this is the calibration WITNESS pinned by
# tests/test_eos_p1_calibration.py: quantize(C * N_amb * T_amb_k) must equal
# quantize(1.0) (today's ambient atmosphere==1.0 scale) within 1 count, so
# every downstream consumer already tuned against "1.0 == 1 atm" keeps its
# calibration at rest when the solver switches over. N_amb == 1.0 (the
# ambient ``o2``+``inert_n2`` split below sums back to exactly 1.0 in Q16.16 —
# 0.21*65536 + 0.79*65536 rounds to 13763+51773 == 65536).
# t_amb_k / C MOVED to [physics.temperature_scale] (eos_t_amb_k / the derived
# C = 1/eos_t_amb_k property, temperature_scale_unification_design_2026-08-13
# §2/§3c, P-K3) — this section no longer carries them; a stale t_amb_k/C key
# here hard-errors at config load (src/temperature_scale.py migration guard).
[physics.eos]
# --- P3 pinned solver constants (docs/eos_refactor_decisions.md 2026-07-10) ---
# c_max/S/N_SUB_MAX/CFL_ADV/N_FLOOR_SOLVER are FROZEN once gated (never
# adaptive) — see cpp/src/eos_solver.h for the load-bearing derivation of
# each. gamma/absorb_strength/T_MIN are secondary dials (compression-work
# adiabatic index, D4 shockwave damping scale, and the T floor) not
# explicitly pinned by the decisions log; defaults mirror the C++ struct.
c_max = 300.0                         # m/s AMBIENT sound speed — NOT a cap: c_local =
                                      # c_max*sqrt(t_max_abs/t_amb), so hot gas is faster
                                      # (eos_solver.cpp:388-391). Under Kwatra's semi-implicit
                                      # scheme c does NOT enter the substep/stability condition
                                      # (measured on eos-prototype: c=120 vs c=60 gave identical
                                      # substep counts) — it governs the STIFFNESS of the
                                      # Helmholtz solve instead, i.e. how many V-cycles the
                                      # pressure solve needs. That is why lowering c_max also
                                      # suppressed the storm; mg_cycles is the honest lever.
S = 8                                 # Helmholtz RB-GS sweep count (gate may pin up to 16).
                                      # Used ONLY on the flat path (use_multigrid=false).
# --- MG V-cycle schedule (PRESSURE ARC 2026-08-18) -------------------------
# docs/pressure_arc_root_cause_2026-08-17.md. Was a C++-only default frozen at
# mg_cycles=2 at the 2026-07-10 MG gate, which measured convergence at only
# ~x0.55/cycle (textbook MG is ~x0.1 — the cause is piecewise-constant
# injection prolongation; see docs/lit_research_2026-08-17_multigrid_and_blast.md)
# and 0.24 atm single-tick error at C=2. C=2 was adopted on a warm-start credit
# validated for 300 ticks on 16^2/160^2 scenarios. At real map size with live
# fires that credit evaporates: on levels/playground, C=2 reaches P_max 103.2
# atm with NEGATIVE P_min and pins n_sub at the cap, reproducing the in-game
# storm; C=8 gives P_max 1.405, zero rail hits, n_sub 1 — and is 18% FASTER per
# tick, because a converged solve collapses the substep count. C=8 and C=16
# agree to 0.3% (converged); C=3 is unstable, matching the gate's own ladder.
mg_cycles = 8                         # V-cycles per tick (was 2)
mg_nu1 = 2                            # pre-smoothing sweeps per level
mg_nu2 = 2                            # post-smoothing sweeps per level
mg_coarsest_sweeps = 32               # RB-GS sweeps at the coarsest level
N_SUB_MAX = 8                         # advection substep cap (accuracy, not stability; re-pinned 16->8, Erik 2026-07-10, decisions #14)
CFL_ADV = 0.5                         # advection CFL number
N_FLOOR_SOLVER = 0.001                # solver-internal N floor (gameplay N unfloored)
adiabatic_index = 1.4                 # ideal-gas adiabatic index (compression work); TUNING DIAL
absorb_strength = 8.0                 # dyn_wave_absorb scale in the velocity-correction damping
T_MIN = -289.0                        # floor on the ambient-relative T field (T_abs >= ~1 K)
U_MAX = 1000.0                        # v2.4 defense-in-depth velocity rail (m/s): the step-4
                                      # store clamp caps |u| at min(c_LOCAL, U_MAX); counted.
                                      # Far above any legit game wind (ambient c=300); exists
                                      # so no T-side change can push stored velocities into
                                      # the int64/narrow overflow regime again (see
                                      # eos_solver.cpp step 4's overflow guard). PROVISIONAL,
                                      # Erik review at P5.
# n_work_ref RETIRED -- gas-energy conservation arc (#54, P-G1a, D11).
# It faded step 4c's compression-work factor on thin-N cells; step 4c is
# gone, replaced by the conservative face-flux energy step, whose
# telescoping and donor-only positivity rail do the job structurally.
# physics_runner raises loudly if this key comes back.
k_drag = 0.5                          # energy-books arc (design §2.8, NEW patch P-E3).
                                      # SHIPPED VALUE 0.5 (Erik, P-E5 2026-08-17) — a
                                      # starting point, not a tuned value: he ruled that
                                      # real tuning waits until the pressure-transient arc
                                      # lands, then one more retune pass over everything.
                                      # NOTE this is NO LONGER the dormant default the
                                      # P-E3 inertness gate was measured at — damping is
                                      # LIVE in the shipped config from here on:
                                      # interior momentum drag with a heat counterparty — the
                                      # storm's honest grave. Per-second rate, applied
                                      # kd = k_drag*dt once per TICK (not per substep) in the
                                      # step-4 kick loop, AFTER the |u| cap. Default 0.0 ships
                                      # the mechanism SILENT (dormancy BY BRANCH on the
                                      # quantized fold kd_q, not this float — a k_drag as
                                      # small as 1e-6 quantizes to kd_q==0). The audit's own
                                      # sizing is ~0.02-0.05 (docs/storm_audit_2026-08-14.md
                                      # §5 mechanism B) but that band is FAR too weak:
                                      # P-E3 MEASURED the free-momentum e-fold at k_drag=0.02
                                      # as ~49.6 s (the design's ~2.1 s estimate was 24x off).
                                      # A ~2 s e-fold needs k_drag ~= 0.5 -- the P-E5 sweep
                                      # value Erik is trying now. Erik picks the shipped value.
                                      # FORBIDDEN BAND (see the [materials.air] wave_absorb
                                      # comment there): this dial is the intended replacement
                                      # for wandering wave_absorb into (0, 0.02) with
                                      # k_wind_strip > 0 — k_drag is a strictly stronger sink
                                      # at the equivalent rate (A@0.02 == k_drag 0.0067).
# k_drag_heat_frac RETIRED -- gas-energy conservation arc (#54, P-G1a,
# design D5/2.1). The drag deposit is no longer a DIAL-scaled fraction of
# the removed kinetic energy divided by the convention c_v: it is the
# DERIVED unit-bridge constant k_ke = gamma*(gamma-1)*T_AMB_K/(2*c_max^2)
# (~9.0e-4 game-deg per (m/s)^2 at the shipped dials) applied to the same
# Delta(|u|^2) bracket. 0.0014 was the hand-rolled stand-in for exactly
# that constant (1/c_v_phys ~= 0.0018). physics_runner raises loudly if
# this key comes back -- see the stale-key guard there.
k_drag2 = 0.0                         # drag-law v2 (design docs/drag_law_v2_design_
                                      # 2026-08-23.md, issue #4 P1): the QUADRATIC
                                      # term of the two-term interior drag law
                                      # F = -k1*u - k2*|u|*u (k1 = k_drag above,
                                      # independent dial). Implicit discretization
                                      # u <- u/(1+k2*dt*|u|) -- exact solution of
                                      # du/dt=-k2*u^2 sampled at ticks, never
                                      # reverses flow or overshoots zero (design R2).
                                      # Default 0.0 ships the mechanism SILENT --
                                      # dormancy BY BRANCH on the quantized fold
                                      # kd2_q, same idiom as k_drag, not this float.
                                      # LANDS DORMANT this arc (P1/P2 auto-merge);
                                      # dial-turning is HUMAN-TEST, waits behind
                                      # #48 (vents) + #6 (smoke), folds into #5's
                                      # retune (P3) -- no re-baseline before that.
                                      # k2 is the storm-killer and lives in a
                                      # narrow honest band (design §1b/§1c: per-tick
                                      # neck retention reaches k_drag=10's molasses
                                      # parity at k2~=0.86; a named ceiling
                                      # u_ceil=1/(k2*dt) caps stored wind); the
                                      # vent-drift protection Erik wants comes from
                                      # sizing k1 DOWN, not from k2's shape.
                                      # FORBIDDEN BAND (see the [materials.air]
                                      # wave_absorb comment below): k2 inherits
                                      # k_drag's contract unchanged (design §10) --
                                      # stage Q is sign-symmetric and strictly
                                      # dissipative (factor in (0,1], trunc toward 0
                                      # both signs), so it cannot rectify
                                      # oscillation or open this window either.

# Canonical game-T -> Kelvin map (temperature_scale_unification_design_
# 2026-08-13 §2). The ONE place these constants are defined — radiation bake,
# render blackbody, and tuning tools all read this section (accessor:
# src/temperature_scale.py). eos_t_amb_k below (derived C = 1/eos_t_amb_k) is
# a DELIBERATE exception to kelvin_ambient (ruling 6): T_game is a ΔT, EOS
# pressure calibration doesn't care what "0" means in Kelvin, and 290 is
# Q16.16-near-optimal where 293 would add 92 extra quantization counts to
# every ambient cell. [physics.eos] no longer carries t_amb_k/C — a stale key
# there hard-errors at load (migration guard, src/temperature_scale.py).
[physics.temperature_scale]
kelvin_ambient = 293.0                 # absolute K at T_game = 0 (~20 C) — THE map ambient
k_temp_to_kelvin = 3.0                 # game-dT -> Kelvin slope (Erik's k_calibr, blessed 2026-08-13)
phi_exp = 0.3333333333333333           # EOS expansion fraction of the Kelvin excess.
# VALUE-FROZEN this arc: phi_exp * k_temp_to_kelvin == 1.0 exactly
# (0.3333333333333333 parses to double(1/3); 3.0*double(1/3) == 1.0, a
# round-to-even tie landing on 1.0 — verified). Retuning phi_exp is the storm
# session's ruling, not this one.
eos_t_amb_k = 290.0                    # EOS absolute-ambient (pressure calibration) — see note above

# EOS refactor P4 — combustion on real O2 (docs/eos_refactor_design.md §5,
# decisions log #12). Own pass, once per tick, after the EOS solver
# materializes P/N/T: burns fuel (flammable + wall_hp>0) against the local
# N_O2 mean, converting consumed O2 into smoke (soot_yield) + inert_N2
# (the remainder — N_total is CONSERVED, never a fake pressure drain) and
# depositing heat via the §4.3 reciprocal (shares c_v/n_floor_heat with
# [physics.thermal] above — ONE combustion/deposit floor in the system, now a
# LOW value-hygiene dial at 0.01 per the energy-books arc's ruling — see
# [physics.thermal]'s n_floor_heat comment for the full rationale; both
# deposit sites also gained an energy-sum counter for the floor's
# destruction, e_deposit_drop_sum, design §2.2/§2.5).
# Sane defaults; feel-tuned at P5 like every other fire/thermal dial.
[physics.combustion]
# Continuous-O2 law (docs/continuous_o2_law_design_2026-07-24.md §2.3): the O2
# demand is now PROPORTIONAL — demand = burn_rate * I * o2f * dt (per claimant),
# where o2f is LINEAR in the air cell's O2 mole fraction (the SAME o2_frac_ext/
# o2_frac_full law the fire logistic uses, bound from [physics.fire]). burn_rate
# drops from the retired uniform-gated 1.0 to the ceiling_h-anchored physical
# value ~1/50: at ceiling_h=2.5 m the per-unit-O2 heat/fuel budget that keeps a
# room-scale flame bounded and Q16.16-safe lands here (Huggett 1980 oxygen-
# consumption calorimetry anchors the scale). RE-TUNE PENDING: the joint re-fit
# of k_grow/k_die/wall_damage/X_ext vs this rate happens AFTER this + the sky-
# exchange build both merge (design §5) — burn_rate is FIXED at 0.02 for that
# re-tune and "never touched again without a real reason" (Erik).
burn_rate         = 0.02   # N_O2 per second per burn site AT I=1, o2f=1 (was 1.0)
o2_thresh_burn    = 0.03   # RETIRED as the burn gate (the o2f law is the throttle);
                            # kept ONLY as an epsilon skip-floor (O2 <= this -> the
                            # air cell is treated as fully starved and skipped)
H_fuel            = 4.0    # heat yield (T-scale ΔT) per unit N_O2 burned
# --- o2_potency — THE SIZING RULING's preserved option (Erik, 2026-08-02) -----
# A LOAD-TIME MULTIPLIER on the baked heat-per-O2 constants (the H_fuel /
# H_BED_M chain above and below). Erik's sizing ruling shipped PACKAGE A —
# draw_r = 2, NO potency now — but ruled potency PRESERVED AS AN EXPLICIT
# OPTION rather than deleted, because it is the one knob that raises fire power
# without touching the supply geometry.
#
# ZERO RUNTIME COST: it is folded into the constants at config-load time, so the
# combustion pass never sees it. DEFAULT 1.0 IS BYTE-NEUTRAL — the multiply is
# an exact IEEE identity, so a default config bakes the identical constants and
# every digest/golden is unmoved.
#
# THE PRICE, stated plainly (this is why it is not free): raising potency
# extracts more heat per unit of oxygen, so a sealed room's FIXED oxygen
# inventory buys proportionally more fire. SEALED-ROOM SMOTHERING WEAKENS BY THE
# SAME FACTOR — at potency 2.0 a sealed room's fire delivers twice the heat
# before it starves, and "seal the compartment" becomes half the counter it was.
# Smothering is a ships requirement (design §0), so this is a real trade, not a
# tuning convenience.
o2_potency        = 1.0    # multiplier on H_fuel + H_bed; 1.0 == byte-neutral
soot_yield        = 0.5    # fraction of consumed O2 -> smoke (rest -> inert_N2)
                           # 2026-08-15 P-S1 visibility bump 0.3->0.5 (Erik-authorized,
                           # provisional): combustion is now the ONE smoke source and
                           # mints ~800x less than the deleted scatter; real smoke
                           # look arrives with the Q6 starved-yield law (P-S2).
# v2.5 — P5.1 stoichiometric fuel consumption (docs/eos_refactor_design.md §5
# v2.5 amendment, decisions #17): the SOURCE tile pays wall_hp for every unit
# of N_O2 its neighbours burn, floored at 1 Q16.16 LSB (smolder NEVER destroys
# — structural destruction stays FireSimulation's I>0 wall_damage path). Wood
# stoichiometry burns ~0.7 mass-units of fuel per unit O2 — physically honest
# default, but in play THE ember-lifetime dial: smaller -> embers glow for
# minutes awaiting oxygen; larger -> they char out fast.
fuel_per_o2       = 0.7
# --- P-O2b: THE EXTENDED OXYGEN DRAW (Erik's Option 2b) ----------------------
# docs/fire_realism_design_2026-08-01.md v5.2 "F-O2b" + the v4 ruling batch
# item (1). A burning tile no longer draws oxygen only from its four open
# faces: it draws from every OPEN cell within `draw_r` BFS hops, expanded
# THROUGH OPEN CELLS ONLY starting at its own open faces (never through a
# solid — a wall breathes only via its open faces, extended outward).
#
# WHY IT EXISTS: round 2's theorem T2 measured the ceiling — diffusive O2
# transport to ONE burning tile caps sustainable delivery far below what any
# honest fire needs, because the engine is 2D and gravity-free and so has NO
# buoyant entrainment (a real crate fire breathes by entrainment; our fire's
# own plume pushes air outward). 2b is the entrainment STAND-IN. Crucially it
# raises DELIVERY without inflating room O2 INVENTORIES, so sealed-room
# smothering stays exactly real — the ships requirement, and the reason this
# is the only supply term in the design.
#
# The demand per (burning tile, reachable cell j) becomes
#     burn_rate*dt * I * o2f_j * W_hop[d(j)] * w_path
# with W_hop the baked 1/(1+d) table NORMALIZED so W_hop[1] == 1, and w_path
# the permeability-multiplicative product over the traversed faces (a crate at
# 0.5 attenuates the draw through itself; a wall at 0 blocks; vacuum
# terminates). The o2f SENSOR stays radius-1 — deliberate: 2b raises delivery,
# not the local sensor, so knee / extinction / smother semantics are unmoved.
#
# draw_r = 1 reproduces the pre-P-O2b 4-face law BIT FOR BIT (the patch's own
# regression oracle, gated byte-identical over the full engine). 2 ships; 3 is
# the design's sweep upper point and the baked tables' ceiling. The
# supply-vs-radius sweep and Erik's fire-power sizing call are P-F4b's job —
# this patch lands the LAW at frozen dials.
draw_r            = 2
# MAX_CLAIMANTS — the declared slot depth of the `dem_acc` demand-accumulator
# plane, which is keyed by the SOURCE OFFSET (2*R*(R+1) offsets: 4 / 12 / 24 at
# R = 1 / 2 / 3). A cap smaller than the radius needs would alias two sources'
# sub-count debts onto one slot, so it is a HARD ERROR in both Python and C++,
# not a note (v5.2: "a hit cap is a violation"). Must be >= 2*draw_r*(draw_r+1).
max_claimants     = 12
# --- P-R4: H_bed, the FUEL-BED deposit (ruling A1) ---------------------------
# With the painter retired, a lone crate's radiation NETS TO ZERO at the source
# (its own tile reads the same E° bucket) and only LOSES to cooler surroundings,
# so combustion has to own the flame plateau. `H_fuel` above cannot: it is the
# GAS-side yield, deposited into the air cell where the flame front sits. The
# missing term is the flame heating its own FUEL BED — real physics (it is how
# fires sustain), and NOT self-radiation. Per claimant k, in Pass A:
#     heat[src_k] += mul_q16(burn_k, H_BED_M) << H_BED_SHIFT
# strictly proportional to the O2 that claimant ACTUALLY consumed.
#
# ONE LOGICAL CONSTANT, SPLIT: H_bed = H_BED_M * 2^H_BED_SHIFT. Two reasons: the
# needed magnitude does not fit a Q16.16 mantissa, and a big mantissa also keeps
# mul_q16's truncation fine against a per-tick claim of only a few raw counts.
#
# DERIVATION (the lone-crate energy balance at the P-R3 anchor dials). Furniture
# conducts nothing (kappa 0 -> NO_FACE) and a lone crate has no absorber within
# its 2.63-tile reach, so radiation-out is ZERO and cool_shift is its only loss:
#     H_bed * B = T* * 2^(heat_inv_shift - cool_shift)
# with B the crate's total per-tick O2 claim = burn_rate*dt*I*o2f*n_faces. At
# T* = 443, his = 3, cool_shift = 9, burn_rate 0.02, dt 1/24 and the FOUR air
# faces that each file a full demand share, the ALGEBRA gives H_bed = 1.07e5 IF
# the fire ran at the ideal anchor (I 0.21, ambient o2f 0.092). NOTE the
# ruling's own 4.3e5 estimate assumed a claim-structure factor of 1 and told us
# to measure it: measured, it is 4 (four air neighbours).
# MEASURED OPERATING POINT (the bench, not the algebra): a lone crate vitiates
# its own flame ring, so it actually sits at o2f 0.0825 (X_local 0.198, not the
# ambient 0.21) and I 0.152 (not 0.21) — both LOWER than the ideal anchor, and
# T* is linear in each. Scaling the algebra by (0.092/0.0825)*(0.21/0.152) and
# placing the result on the bench lands H_bed = 2.02e5, which holds the
# sustained plateau at T* = 440 game (window mean; max 486, gate band 400-500).
# That is 2.1x BELOW the ruling's 4.3e5 estimate — inside its +/-3x sanity band.
#
# HONEST NAMING: this is a CALIBRATED LUMPED CONSTANT exactly like thermal_mass.
# It is Huggett-SHAPED (strictly proportional to O2 consumed — so a choked fire
# deposits nothing and the plateau SAGS with local O2, backdraft-adjacent feel)
# but NOT Huggett-VALUED: thermal_mass = 8 already lumps the ~130x surface-layer
# factor, so no J/mol anchor survives the conversion. Do not read it as an
# enthalpy. RE-TUNE AT P-R5 alongside cool_shift.
H_BED_M           = 18125.0  # mantissa (< 32768, the Q16.16 range). P-K0: promoted from TUNE (P-F1b 25290->18125)
H_BED_SHIFT       = 4        # H_bed = H_BED_M * 2^H_BED_SHIFT = 2.900e5. P-K0: promoted from TUNE (P-F1b 3->4)
# Unit-side suffocation mechanics (LATER arc, design §5): defined here so the
# constant lives at the right layer; nothing reads it yet.
o2_thresh_breathe = 0.08   # min local N_O2 a unit needs to breathe (NOT wired yet)

[gases.steam]            # water vapour / steam
absorption     = [0.10, 0.10, 0.10]   # flat, low — Mie scattering is spectrally neutral
scatter_albedo = [0.92, 0.92, 0.95]   # NEAR-WHITE additive brighten — the dominant visual term
diffusion      = 0.18                 # spreads readily, light gas
decay          = 0.020                # condenses / dissipates moderately fast
glow           = 0.0                  # no self-glow (but scatters local light brightly)
flammable      = false
emits_when_hot = false
effect         = "vision_block"       # pure concealment; clears on decompression
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.smoke]            # combustion soot (== today's generic smoke)
absorption     = [0.88, 0.90, 0.93]   # near-neutral, slight blue tilt: thin soot reads warm/brown
scatter_albedo = [0.04, 0.04, 0.04]   # soot barely scatters — it is the dark gas
diffusion      = 0.10                 # heavier, clings; matches today's d_smoke=0.1 (behaviour-preserving)
decay          = 0.008                # lingers — soot settles slowly
glow           = 0.0                  # cold soot does NOT glow; hot soot via emits_when_hot
flammable      = false                # the soot itself is spent fuel
emits_when_hot = true                 # black-body emission driven by heat buffer (M2/M3)
effect         = "vision_block_heavy" # near-opaque concealment at density
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.poison]                 # chlorine (Cl2), yellow-green
absorption     = [0.45, 0.10, 0.80]   # B absorbed hardest, R moderate, G passes -> yellow-green tint
scatter_albedo = [0.10, 0.30, 0.06]   # faint green inscatter
diffusion      = 0.12                 # creeps and pools (heavier-than-air feel)
decay          = 0.004                # persistent — the hazard lingers
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = "damage_over_time"   # lethal cloud; saturates to iconic green at mid-high density
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.teargas]                # CS aerosol, pale near-white (ambiguous vs steam)
absorption     = [0.12, 0.16, 0.30]   # low overall, B ~2x R -> faint warm/yellow only in thick plumes
scatter_albedo = [0.88, 0.90, 0.92]   # near-white scatter, like steam — sustains the ambiguity
diffusion      = 0.15                 # disperses like a fine aerosol
decay          = 0.010                # clears moderately
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = "area_denial"        # forces units out of the area; non-lethal
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.fuel_gas]               # combustible vapour, faint, FLAMMABLE
absorption     = [0.08, 0.10, 0.16]   # very faint, slight blue tilt — nearly invisible haze
scatter_albedo = [0.20, 0.22, 0.28]   # weak, faintly cool scatter
diffusion      = 0.22                 # GAMEPLAY KNOB: high = gassy cloud, low = tight flamethrower jet
decay          = 0.006                # lingers as an ignition hazard
glow           = 0.0
flammable      = true                 # IGNITES -> spawns heat + smoke; the only flammable gas
emits_when_hot = true                 # while burning it glows via the black-body curve
effect         = "ignition_hazard"    # invisible-ish until lit; then a fireball
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

# EOS refactor P1 — the two BULK species (docs/eos_refactor_design.md §1/§2.1).
# Together they ARE "air": ambient splits 21/79 (O2/inert_N2 by mole fraction,
# gamemap._update_caches / destroy_wall). conservative=true routes both to
# donor-cell CONSERVATIVE flux transport (bulk_transport.cpp) instead of this
# table's per-gas semi-Lagrangian loop. Per the P1 spec: ZERO decay, ALL
# optics zero (invisible bulk — must not tint light or change any visual),
# not flammable, no gameplay effect tag. diffusion=0.0 is inert here (the
# conservative pair never reaches the semi-Lagrangian diffusion step) but
# still must be a number — a config-schema requirement, not a behavior knob.
[gases.o2]                     # molecular oxygen — bulk air, breathable half
absorption     = [0.0, 0.0, 0.0]
scatter_albedo = [0.0, 0.0, 0.0]
diffusion      = 0.0                  # unused — conservative transport bypasses the SL loop
decay          = 0.0                  # bulk air does not decay
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = ""                   # no gameplay tag (unit-side suffocation reads N directly, later)
conservative   = true                 # EOS P1: donor-cell flux transport, not semi-Lagrangian

[gases.inert_n2]                # nitrogen + "burnt products" — bulk air, inert half
absorption     = [0.0, 0.0, 0.0]
scatter_albedo = [0.0, 0.0, 0.0]
diffusion      = 0.0                  # unused — conservative transport bypasses the SL loop
decay          = 0.0                  # bulk air does not decay
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = ""                   # no gameplay tag
conservative   = true                 # EOS P1: donor-cell flux transport, not semi-Lagrangian

# ---------------------------------------------------------------------------
# Duct filter table (vent system PATCH 1, issue #48 — docs/vent_system_
# design_2026-08-23.md §4). A filter is a table row: per-TRACE-gas efficiency
# (Q16 fraction [0,1] of intake mass SCRUBBED into the plenum's counted sink,
# `simulation.vent_system`). Bulk (o2/inert_n2) is NEVER filtered — real
# filters catch particulates, not gas molecules — so a row names only the
# five trace species (steam/smoke/poison/teargas/fuel_gas); a name absent
# from a row is a hard load error (§4: "a filter is a table row", never a
# hardcoded per-gas if). A `duct.filter` field references one row by name,
# loader-validated at build_vents (a config-integrity error, not the generic
# dangling-entity-ref warning — this addresses config.toml, not [[entity]]).
[filters.derelict]     # "ducts merely redistribute" (§4) — the duct schema default
steam    = 0.0
smoke    = 0.0
poison   = 0.0
teargas  = 0.0
fuel_gas = 0.0

[filters.hepa_basic]   # catches particulates (smoke), passes every gas (§4 physical anchor)
steam    = 0.0
smoke    = 1.0
poison   = 0.0
teargas  = 0.0
fuel_gas = 0.0

[display]
panel_width = 250
level = "playground"              # folder under levels/ to load on startup (the standard-values sandbox; ship prototypes retired to prototypes/)
# Water overlay v2 look knobs (water W6b; canon engine/07 §6 — the tasteful
# placeholder, not the shipped optics pass). RENDER-ONLY and RESTART-BOUND:
# GameRenderer binds them once at construction (the water_display_max
# precedent); Ctrl+R re-reads config.toml but does NOT re-bind overlays —
# restart the game to apply. Erik's eyeball-tuning dials.
water_ripple_shade = 0.35   # ripple-slope brightness gain: full +/-35% of the tint at slope 0.05 m/tile (fresh splash)
water_foam_thresh = 0.03    # |grad ripple| (m/tile) above which foam whitens; splash slope ~0.075 foams, settled ~0 never
water_ambient_base = 0.06   # idle ambient-sine shimmer amplitude on standing water; grows with local ripple energy, cap 0.40

# Water surface OPTICS pass (graphics/water_rendering.md §2/§4/§7 — the shipped
# GLSL Fresnel/GGX/refraction look, NOT the CPU placeholder above). RENDER-ONLY
# and RESTART-BOUND: WaterPass binds these once at construction; Ctrl+R re-reads
# config.toml but does NOT re-push them (the renderer-render-params precedent —
# restart to apply). Erik's eyeball-tuning dials. The pass is DORMANT-SAFE: with
# no standing water it outputs alpha 0 (identical render), so these only bite
# once water is on the floor. v1 CORE only — caustics/foam/CA are a later step.
[graphics.water]
roughness_base = 0.08       # GGX roughness floor — still puddles glint sharp (alpha = roughness^2)
roughness_agitation = 0.6   # added roughness per unit local ripple energy — sloshing water shimmers broad
fog_density = 3.0           # Beer-Lambert depth-tint rate: floor fades to water_color over ~1/fog_density m
refract_strength = 0.02     # normal-driven floor-warp magnitude (UV units), scaled by depth (no shoreline swim)
r0 = 0.02                   # Schlick Fresnel reflectance at normal incidence (top-down ~2%; ripple tilts spike it)
ripple_scale = 8.0          # metres-of-ripple-height -> on-screen normal-slope gain (ripples are millimetric vs a 1.0 UV)
water_color = [0.03, 0.10, 0.18]   # deep-water tint (the volume colour the floor fades toward with depth)
# Glint: the GGX highlight is ADDITIVE on top of the see-through base (light
# reflecting OFF the surface), NOT Fresnel-blended at ~2% nor alpha-attenuated.
# glint = ggx * NdotL * lightRGB * glint_strength, added to the premultiplied
# rgb WITHOUT × alpha — survives the premultiplied blit as additive HDR light,
# visible regardless of water transparency. Gated by lightRGB (only under a
# flashlight/fire) and NdotL (no back-lit glint). 2.0 = clearly visible on a
# flashlit rippled puddle; raise for sparklier, lower toward 0 to mute.
glint_strength = 2.0
# Transparency ramp: alpha = clamp(depth * alpha_scale, alpha_min, alpha_max).
# alpha_scale = depth->opacity rate (was the hardcoded 6.0); alpha_min = the
# shoreline floor (was 0.15); alpha_max = the deep-water ceiling (was 0.95).
# The glint does NOT touch alpha. Dial these to make standing water clearer or
# more opaque.
alpha_scale = 6.0
alpha_min = 0.15
alpha_max = 0.95
# --- Phase 2 (mood pass): caustics / foam / chromatic aberration / waves ---
# Caustics (§3): focused light dancing on the flooded floor under a flashlight.
# caustic = max(+laplacian(ripple), 0) * caustic_strength * lightRGB, ADDED
# into the refracted floor term (rides the floor, × alpha). SIGN load-bearing:
# +laplacian focuses (bright in dips); -div(N) ≡ same; +div(N) would invert it.
# caustic_scale > 0 layers a touch of high-frequency procedural detail (× the
# surface energy) for crispness; 0 = pure surface curvature.
caustic_strength = 2.5
caustic_scale = 6.0
# Foam (port of overlays.py:261-277): white whitecaps where |grad ripple| >
# foam_threshold + the wet/dry shoreline (high depth gradient). Composited LAST
# into the base (surface scatter, alpha-bound — NOT additive). foam_intensity
# scales the whiteness; foam_threshold is the steepness/edge above which foam
# starts (lower = more foam).
foam_threshold = 0.02
foam_intensity = 0.6
# Chromatic aberration (subtle polish): floor refraction r/g/b sampled at
# offsets scaled 1 ± ca_amount per channel. Tiny — a barely-there prismatic
# fringe. 0 = off (single sample).
ca_amount = 0.012
# Wave-size dials (Erik: idle shimmer waves read "very big"). wave_scale
# MULTIPLIES the ambient-sine spatial frequencies (higher = smaller/tighter
# waves, lower = bigger). ambient_amp = idle amplitude base (the old hardcoded
# 0.06) — the idle shimmer strength on still water.
wave_scale = 2.0
ambient_amp = 0.06
# --- Heightmap attenuation (alpha-only; graphics/water_rendering.md §2 §8) ---
# An OPTIONAL per-level floor heightmap ([art.bare] height) attenuates the water
# ALPHA where raised relief (crates, consoles, debris) rises above the local
# water depth, so those features poke ABOVE the surface and the water laps around
# them. It does NOT feed depth/volume/tint/refraction (those stay per-tile). On a
# level with no heightmap these dials do nothing (u_has_height = 0 -> the pass is
# bit-identical). wet = clamp((depth - relief*height_scale)/height_edge, 0, 1);
# alpha *= wet.
#   height_scale = relief metres gain — how tall the relief reads vs the water
#     depth. Tuned (~0.4) so furniture pokes through a ~0.3-0.5 m puddle. 0 = off.
#   height_edge  = shoreline softness (m) — the gradient width of the lap edge
#     around a protruding feature (lower = harder cut; higher = softer fade).
#   height_floor = the heightmap value treated as floor level (the "level 0"
#     baseline), subtracted from relief BEFORE scaling. DEFAULT 0.3 — a hand-tuned
#     stopgap for the raw Depth-Anything maps (floor sits at a nonzero relief). A
#     single constant is only APPROXIMATE: the raw maps carry a smooth top-to-
#     bottom relief gradient (DA artifact, ~0.28 top -> ~0.53 bottom on
#     unhcr_vessel_2), so no scalar flattens the whole floor. The proper fix is a
#     re-baseline that subtracts a low-frequency floor SURFACE (background
#     subtraction), not a constant — see docs/heightmap_refinement_tool_design.md
#     §6.1. Until that lands, this dial is the floor's average relief.
height_scale = 0.4
height_edge = 0.1
height_floor = 0.3

# =============================================================================
# Render-layer beauty config (Fire & Heat Beauty arc, B1). ALL keys here are
# RENDER-ONLY and determinism-EXEMPT: they drive renderer/blackbody.py +
# renderer/fire_lights.py, which read gmap.temperature and write only render
# structures. NOTHING here touches the sim, the digest, or a golden. Every
# value is a tune-by-eye dial (Erik), never a gated constant.
# =============================================================================

[render]
# Default overlay visibility (the shipped look; each stays a live in-game
# toggle). Fire & Heat Beauty B1 (Erik feel-check 2026-07-21): the physical
# black-body emissive overlay (T) ships ON — it IS the fire/heat view; the
# legacy flat-orange FireOverlay (F3) stays OFF (superseded); the pressure
# colormap (F7) now ships OFF by default (it washed the scene out — Erik's
# call) but is one keypress away when you want to see shockwaves.
blackbody_overlay_on = true
fire_overlay_on = false
pressure_overlay_on = false
cold_overlay_on = false    # P-W2 blue cold tier — the #8 cold-blast instrument.
                           # OFF in normal play (Erik 2026-08-25: cold reads
                           # TRANSPARENT); flip on for cold-blast sessions.

# Fire & Heat Beauty B2 (§6): the old flat smoke_overlay + additive glow_overlay
# pair, kept behind a toggle for the P2 A/B against the new physical gas medium.
# P1 lays this key (NO consumer yet — the medium pass + the live toggle land in
# P2); it exists so the harness checkbox binds and P2 finds it.
legacy_smoke_on = false

# Blackbody temperature->colour ramp (renderer/blackbody.py; design
# docs/fire_b1_blackbody_fire_lights_design_2026-07-21.md §1). Baked once into a
# 1D LUT at renderer startup. Chroma via the Tanner Helland/Bartlett Kelvin->RGB
# fit (normalized, max channel = 1); brightness via a SEPARATE T⁴-flavour
# intensity ramp (the fits give hue only). Game ΔT -> pseudo-Kelvin is the honest
# dial for "white reserved for extremes": kelvin = kelvin_ambient +
# k_temp_to_kelvin * T_game — the map itself now lives in
# [physics.temperature_scale] (temperature_scale_unification_design_
# 2026-08-13 §2/§3d); this section keeps only the render-only dials. Wood
# ignites at T_game ~300; the physical extreme rail is T_MAX_PHYS = 16000.
[render.blackbody]
kelvin_floor = 800.0       # LUT low end (K)
kelvin_ceil = 10000.0      # LUT high end (K)
lut_size = 256             # LUT entries
kelvin_glow_min = 800.0    # below this: no visible glow (intensity 0)
kelvin_ref = 3000.0        # exposure reference temperature (Macklin)
intensity_exponent = 4.0   # Stefan-Boltzmann flavour (T⁴)
intensity_max = 8.0        # HDR headroom pre-tonemap (16F pipeline + ACES; NO bloom)

# Fire light sources (renderer/fire_lights.py; design §3). Tier 2 of the fire
# glow: the brightest-K hot tiles become omni ray-traced light sources so fire
# lights rooms, walls, and marines (the marine shader samples the same light
# field). Candidates (T_game >= t_light_min) -> 3x3 non-max suppression ->
# brightest max_lights by temperature. RENDER-ONLY: these NEVER write the synced
# heat channel (heat is cast separately in the sim). Cost = sum over sources of
# ceil(2π·range) rays, so max_lights (not range) is the budget lever — range is
# LONG on purpose (geometry caps it; big-room illumination is the point).
[render.fire_lights]
enabled = true             # master on/off for fire lights
t_light_min = 250.0        # game-ΔT candidate threshold
nms_window = 3             # non-max-suppression window (3 or 5; widen if oversubscribed)
max_lights = 16            # brightest-K cap (the budget lever)
light_range = 18.0         # omni reach in tiles (LONG on purpose — Erik ruling)
light_gain = 1.0           # multiplies the black-body intensity into light weight

# --- Lighting pass (master exposure) ---------------------------------------
[render.lighting]
master_gain = 2.0          # ONE master display-exposure dial on the light field
                           # (LightingPass u_light_gain). Was hardcoded 1.0 in
                           # the game while the demo harness tunes at ~10 — the
                           # "too dark everywhere" gap. TRIAL 2.0 (Erik
                           # 2026-08-25, "just double it"); reconcile with the
                           # demo's regime in the pre-tuning instrument pass.

# --- Fire & Heat Beauty B2 gas-medium render pass -------------------------
# P1 PLUMBING ONLY: these blocks have NO consumers yet — renderer/gas_medium.py
# (P2), shaders/gas_medium.fs (P3), the speckle pass (P4) read them later. They
# exist now so the harness sliders bind and P2 finds them cleanly. Defaults are
# the honest / identity values (design §6). RENDER-ONLY, tuned by eye with Erik,
# never gated. (docs/fire_b2_smoke_honesty_design_2026-07-21.md §3-§6.)
[render.gas_medium]
plume_k_scale = 50.0        # RELATIVE multiplier on the shared smoke_absorb_scale base
                            # 2026-08-25 #6 diagnostic (docs/smoke_tau_diagnostic_2026-08-25.md):
                            # the 300.0 hack was calibrated on the old ~0.002-peak soot
                            # regime; real fire sessions live at rho 0.02-0.3, so 300 put
                            # 60-100% of visible smoke past alpha 0.98 (flat black). 50
                            # puts the black knee at the measured p90 density. TRIAL value,
                            # Erik's eye decides; final band placement after #48's drift.
tau_curve_a = 1.0           # tau' = a*tau^b — artistic remap IN tau-SPACE
tau_curve_b = 1.0           #   (b>1 steepens edges; 1/1 = fully honest)
glow_gain = 1.0             # re-match the beloved god-ray brightness (tune)
effect_gas_floor = 0.0      # NON-PHYSICAL legibility floor, poison/teargas
fuel_haze_on = false        # stretch: fuel_gas refraction shimmer

[render.gas_detail]
enabled = true
noise_octaves = 4           # fBm, persistence ~0.56 (Kolmogorov-flavored)
noise_wavelength_tiles = 3.0
adv_gain = 1.0              # k_adv: wind -> UV advection rate
cycle_seconds = 2.5         # tau, from the 1/3-distortion rule
erode_strength = 0.6        # low-density erosion depth
warp_px = 3.0               # sampling-UV domain warp
dither_on = true

[render.props]
# 3D props & vegetation — WIND SWAY (arc #60 P4, design §4.3 "Sway (P4)").
# Read EVERY FRAME by renderer/static_props.py (via SwaySettings.from_config),
# so Ctrl+R retunes the motion live: this section is the whole tuning surface
# for "how much does the tree move". Render-only; no sim, no digest, no golden.
#
# The wind a prop sways by is the TAMED wind (renderer/gas_detail.py::tame_wind,
# the same product the smoke detail pass advects with) — never the raw fire-
# spiked -grad(P) planes.
sway_strength = 0.06     # MASTER. Crown offset at full wind, as a fraction of
                         # the prop's height (0.06 = a 2.4 m tree's crown leans
                         # ~14 cm). 0 = sway off entirely (props draw rigid).
flutter_strength = 0.38  # leaf-tuft jitter, as a fraction of the bend
                         # displacement, weighted by the baked flutter alpha
                         # (0 = the canopy bends as one solid mass)
gust_speed = 1.15        # rad/s of the slow gust envelope (~0.18 Hz)
gust_depth = 0.38        # envelope depth: bend scales (1-d)..(1+d) over a gust
flutter_speed = 1.0      # rate multiplier on the high-frequency leaf jitter
idle_wind = 0.0          # floor on the wind fraction (0..1). ERIK'S RULING
                         # (2026-09-07): "we're in a spaceship — leaves should
                         # be TOTALLY STILL unless there is actual wind", so the
                         # shipped floor is 0 and sway is a SIGNAL of real
                         # atmosphere motion (blast front, breach, vent), never
                         # ambient decoration. The dial stays for experiments
                         # (a planetside scene); >0 makes calm air breathe.
wind_ref = 0.08          # tamed speed (tiles/tick) that counts as FULL sway;
                         # = gas_detail's saturation ceiling (its largest
                         # possible output), so the fraction lands in 0..1

[render.speckle]
mode = "soot"               # "off" | "noise" | "soot"  (A/B in studio)
amp = 0.25

# Material property table (named-key format, ch.02 — Material System).
# One [materials.<name>] row per material id; columns indexed into per-id
# arrays by simulation.materials.MaterialTable.
#   hp            structural HP (0 = not a destructible wall)
#   flammable     can ignite
#   mobility      ease-of-movement coefficient in fixed-point milli-units
#                 (1000 = normal walk speed; 400 = 40% speed / 2.5x step time;
#                 0 = impassable wall). Replaces the old `passable` bool:
#                 walkability is the derived view `mobility > 0`, and the
#                 movement cadence area-averages it over the unit footprint.
#                 (door has mobility 1000 — walk-through — but still occludes.)
#   light_atten   [R,G,B] per-channel optic attenuation (1=opaque, 0=clear)
#   heat_atten    heat-ray attenuation
#   conductivity  thermal: high = heat spreads fast (metal)
#   thermal_mass  heat-units to raise one tile 1 degree (the analogue of
#                 volumetric heat capacity rho*c). POWER OF TWO (it sits on a
#                 divide: temperature += heat >> log2(thermal_mass)). Anchored
#                 to real rho*c (~5x metal:wood spread): steel/hull 32, glass
#                 16, wood/door/furniture 8, air 1 (engine/06 §1, proposal §1.1).
#   ignition_temp catches fire at this temperature (0 = non-flammable)
#   wave_absorb   per-cell velocity-damping weight in the EOS correction
#                 (dyn_wave_absorb x absorb_strength). NOT a transmission
#                 model: on the EOS substrate a wall is a perm=0 face — zero
#                 designed transmission for every material. (wave_reflect,
#                 the old "transmit = 1 - reflect - absorb" column, had no
#                 consumer and was deleted 2026-08-29 — Erik's ruling: no
#                 feature intent in the tables until what exists works.)
#   blast_resist  structural blast resistance
#   burst_threshold  max pressure DIFFERENTIAL a wall holds before it fails
#                    (over-pressure relief valve). 0 = n/a (air). Interior
#                    pressure is ~1.0, so thresholds sit comfortably above 1.
#   permeability  OPTIONAL gas/smoke flow coefficient (0 sealed, 1 open air,
#                 partial = porous). Omitted -> derived: sealed where the
#                 material occludes light, open otherwise (legacy solid set).
#   cover_exposure  exposure-vs-cover probability (mechanics/03 §3, 06 §5; W2).
#                 1.0 = no concealment (a shot entering a unit footprint from
#                 this tile never rolls); < 1.0 = soft cover: the shot connects
#                 with this probability, else it is ABSORBED by the tile
#                 (deposits its wall damage there — suppressive fire chews the
#                 crate until it stops being cover). Solid walls keep 1.0 —
#                 they stop the march physically, no roll needed.
# Optics/acoustic/thermal columns are STORED but not yet consumed (CPU
# foundation); values are illustrative and tuned later in the demos.

[materials.air]
hp = 0
flammable = false
mobility = 1000
light_atten = [0.0, 0.0, 0.0]
heat_atten = 0.0
# EOS refactor P2 (docs/eos_refactor_design.md §4, §8 patch P2): air gets a
# small NONZERO conductivity so the EXISTING whole-grid conduction pass
# (temperature_solver.cpp, no solid/air branch) does air<->air AND the
# solid<->air interface exchange for free — the sealed-room energy sink.
# Chosen so the derived face_shift_table[air][air] == 11: THREE steps
# slower than wood's face_shift_table[wood][wood] == 8 (the §9 "2-4 steps
# slower than wood" bound), comfortably inside [SHIFT_MIN=2, NO_FACE=63].
# Derivation (materials.py._build_conduction_tables, harmonic-mean face,
# shift = round(-log2(hm/KAPPA_REF)), KAPPA_REF=50):
#   face[air,air] = round(-log2(0.024/50)) = round(11.02) = 11
# The air<->solid interface shifts (harmonic mean, dominated by the more
# resistive material = air) land at ~10 for every solid — a hair FASTER
# than air-air (11) but far slower than any solid-solid face (hull/steel
# self-face == 2, wood-wood == 8): the physically-expected "air is the
# bottleneck resistor" ordering. furniture keeps conductivity=0.0
# (unaffected — NO_FACE either side, unchanged).
conductivity = 0.024
thermal_mass = 0     # air: 0 == the GAS thermal regime (thermal-mass axis design
                     # §2.1). The derived `thermal_solid` mask (thermal_mass > 0)
                     # IS the guard now, so no 0-shift placeholder is needed: air
                     # never reaches the >>shift convert path at all.
# COOL-SHIFT AXIS (2026-07-30) — the LOSS-side twin of `thermal_mass`. The
# per-tick Newtonian decay toward ambient on a THERMAL-SOLID tile:
#       T -= T >> cool_shift          (T is ΔT above ambient, so T_amb == 0)
# At the 24 Hz tick the e-fold time is 2^cool_shift / 24 seconds:
#       5 -> 1.3 s     8 -> 10.7 s    10 -> 43 s    12 -> 171 s   14 -> 11 min
# It was ONE global ([physics.thermal] COOL_SHIFT) until the thermal-mass arc
# made furniture a thermal solid whose ONLY loss channel is this dial
# (conductivity = 0 -> NO_FACE both ways -> no conduction face). A number fast
# enough for thin hull plate is absurd for a wooden crate and vice versa, so it
# is now a PER-MATERIAL FEEL DIAL — the same argument the gain side won with
# `thermal_mass`. Legal range [SHIFT_MIN=2, 20]; 0 would mean `T -= T`, an
# instant total wipe, and is rejected by the loader. A vacuum-exposed tile
# takes the offset form documented at [physics.thermal] COOL_SHIFT above.
# EVERY ROW IS SEEDED AT THE OLD GLOBAL (5) — this column is byte-identical on
# arrival; moving a row is a deliberate, HUMAN-TESTED feel change.
cool_shift = 5       # air: unused (the cooling pass is thermal-solid only), sane value
ignition_temp = 0.0
# FORBIDDEN BAND (storm audit 2026-08-14 §5, row d/d', §5B; energy-books
# design §2.8): wave_absorb in the OPEN interval (0, 0.02) WHILE
# [physics.fire] k_wind_strip > 0 is the historical rectifier window — a
# live fire in that band goes violently unstable (KE burst, T-floor
# spiral). Dormant at k_wind_strip=0.0 (shipped), but physics_runner.py
# warns loudly at load if this band is ever wandered into unwarned. Prefer
# [physics.eos] k_drag (P-E3, design §2.8) for interior damping — a
# strictly stronger sink at the equivalent rate that ships with a heat
# counterparty, so it never opens this window.
wave_absorb = 0.0
blast_resist = 0.0
burst_threshold = 0.0
cover_exposure = 1.0

[materials.hull]
hp = 300
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 50.0
thermal_mass = 32    # steel (real rho*c ~3.8): heats slowly per ray (heat >> 5)
cool_shift = 5       # ambient decay T -= T>>5 (e-fold 2^5/24 = 1.3 s). SEEDED AT
                     # THE OLD GLOBAL — see the axis note on [materials.air]
ignition_temp = 0.0
wave_absorb = 0.1
blast_resist = 0.0
burst_threshold = 0.0  # 0 = never; the hull breaches via damage/explosions, not over-pressure
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.wood]
hp = 60
flammable = true
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.15
thermal_mass = 8     # softwood (real rho*c ~0.7): heats fast & locally (heat >> 3)
cool_shift = 13      # ambient decay T -= T>>13 (e-fold 2^13/24 = 341.3 s). P-K0:
                     # promoted from TUNE (P-F1b 9->13, THE SPREAD DIAL; wood
                     # moves with furniture — both cellulosic, both thermal_mass 8)
ignition_temp = 300.0
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.door]
hp = 40
# NOTE: ch.02 / architecture.md illustrate door as flammable=true, but the old
# _update_caches hardcoded `flammable = (material == WOOD)`, so doors were NOT
# flammable in practice. Kept false here to preserve existing physics behaviour
# (doors don't ignite). Flip to true once that gameplay change is intended.
flammable = false
mobility = 1000
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.3
thermal_mass = 8     # wood-like door: heats fast (heat >> 3)
cool_shift = 5       # ambient decay T -= T>>5 (e-fold 2^5/24 = 1.3 s). SEEDED AT
                     # THE OLD GLOBAL — see the axis note on [materials.air]
ignition_temp = 280.0
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.steel]
hp = 200
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 45.0
thermal_mass = 32    # steel (real rho*c ~3.8): heats slowly per ray (heat >> 5)
cool_shift = 5       # ambient decay T -= T>>5 (e-fold 2^5/24 = 1.3 s). SEEDED AT
                     # THE OLD GLOBAL — see the axis note on [materials.air]
ignition_temp = 0.0
wave_absorb = 0.1
blast_resist = 0.8
burst_threshold = 10.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.glass]
hp = 15
flammable = false
mobility = 0
light_atten = [0.1, 0.1, 0.1]
heat_atten = 0.3
conductivity = 1.0
thermal_mass = 16    # glass (real rho*c ~2.1): half metal's mass (heat >> 4)
cool_shift = 5       # ambient decay T -= T>>5 (e-fold 2^5/24 = 1.3 s). SEEDED AT
                     # THE OLD GLOBAL — see the axis note on [materials.air]
ignition_temp = 0.0
wave_absorb = 0.1
blast_resist = 0.0
burst_threshold = 1.0
cover_exposure = 1.0   # solid pane: stops the march physically (until it shatters)

# Furniture: crates/shelving/bunks (editor proposal Q2 — dedicated material
# row: lower hp, partial permeability so smoke drifts past crates, flammable).
[materials.furniture]
hp = 30              # burns out / breaks fast; fuel for fire = wall_hp
flammable = true
mobility = 400       # climbable at a penalty: 40% speed = 2.5x step time (you clamber over a crate)
permeability = 0.5   # partial: smoke/air drift past crates (sealed walls omit this -> 0)
light_atten = [0.55, 0.55, 0.55]   # partial occlusion: a crate stack leaks some light
heat_atten = 0.5
conductivity = 0.0   # kappa 0 = no conduction face (like air); fire eats it via flammability instead
thermal_mass = 8     # wood-like (real rho*c ~0.7): heats fast & locally (heat >> 3)
cool_shift = 13      # THE dial for a crate: conductivity = 0 means the ambient
                     # decay above is furniture's ONE loss channel (thermal-mass
                     # design §2.2), so this alone sets how long a burning crate
                     # stays hot. e-fold 2^13/24 = 341.3 s. P-K0: promoted from
                     # TUNE (P-F1b 9->13, THE SPREAD DIAL).
ignition_temp = 280.0   # wood-like; slightly easier to light than a solid wood wall (300)
wave_absorb = 0.5    # soft stuff soaks blasts
blast_resist = 0.0
burst_threshold = 2.0   # overpressure can topple/burst furniture (door-equal; TUNING DIAL)
cover_exposure = 0.55   # soft cover (mechanics/03 §3): a shot crossing a crate into a
                        # unit connects with p=0.55, else the crate eats it (wall chew).
                        # STANDARD VALUE — Erik's dial; interesting range ~0.3 (bunker
                        # furniture) .. 0.8 (thin concealment)

[materials.door_closed]
# A6 (docs/a6_doors_v0_impl_2026-07-19.md §1): the ENTITY door's CLOSED
# stamp — [materials.door] values with mobility = 0 (fully solid to movement
# AND flow). permeability deliberately OMITTED so it derives 0 from the
# occluding light_atten, exactly like door. MAT_DOOR stays the legacy
# painted door (walkable-but-flow-solid) until the A7 migration.
hp = 40
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.3
thermal_mass = 8     # wood-like door: heats fast (heat >> 3)
cool_shift = 5       # ambient decay T -= T>>5 (e-fold 2^5/24 = 1.3 s). SEEDED AT
                     # THE OLD GLOBAL — see the axis note on [materials.air]
ignition_temp = 280.0
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

# P-F4a (docs/fire_realism_design_2026-08-01.md v5.2 execution order; plain
# edition §10, v4 ruling 2): the CAMPFIRE REFERENCE OBJECT — the 1-3 kg
# effective-class tuning-reference fuel Erik's feel verdicts are actually
# calibrated on (the old 6-8 min universal band + lone-crate reference are
# RETIRED; burn durations are per-material-family now). Registered as a real
# material id (bench-side; no shipped level paints it) so the room/vent bench
# and the still-air arena can ignite it. Cellulosic values COPIED FROM
# [materials.furniture] EXCEPT the four columns called out below (locked spec,
# P-F4a task order item 2 — do not retune without a design amendment).
[materials.kindling]
hp = 8                # SMALL FUEL STORE (spec-locked, ~= 8): fuel is still
                       # combat-hp-coupled TODAY — this hp doubles as both the
                       # object's combat health AND the fire-energy store. The
                       # fuel-column decoupling (v5.3: a dedicated `fuel`
                       # column, hp stays combat health) lands in a LATER
                       # patch; until then, sizing this small is what makes a
                       # kindling-class object burn down kindling-fast.
flammable = true
mobility = 400        # copied from furniture (climbable at a penalty)
permeability = 0.5    # copied from furniture (smoke/air drift past it)
light_atten = [0.55, 0.55, 0.55]   # copied from furniture (partial occlusion)
heat_atten = 0.5      # spec value (== furniture's)
conductivity = 0.0    # spec value: crate-conduction lands with the law
                       # patches (P-F1a/P-F3), not here
thermal_mass = 8       # spec value (== furniture's; wood-like, heat >> 3)
cool_shift = 13        # P-K0: promoted from TUNE (P-F1b 9->13, matches
                       # furniture/wood — all three cellulosic materials moved
                       # together). e-fold 2^13/24 = 341.3 s.
ignition_temp = 280.0  # spec value: furniture's, PER THE ROW CONVENTIONS —
                       # do NOT import literature values (~250 C) raw here.
wave_absorb = 0.5      # copied from furniture
blast_resist = 0.0     # copied from furniture
burst_threshold = 2.0  # copied from furniture
cover_exposure = 0.55  # copied from furniture

# Props & vegetation arc #60 P3 (docs/architecture/graphics/props_and_
# vegetation.md §4.1/§6.1.2, Erik's ruling 2026-09-07): the prop entity's
# ONE material row. APPENDED — must stay the LAST material id (ids are
# positional/contiguous; MaterialTable asserts it, and
# tests/test_prop_entity.py pins MAT_FOLIAGE's actual id).
#
# Spec: fully walkable (no movement/wind/vision interaction beyond
# burning), flammable, fuel/hp ~= 2x furniture's ACTUAL hp (furniture = 30
# -> foliage = 60, the clean 2x Erik's "~60-70" range asked for).
[materials.foliage]
hp = 60               # == 2 * furniture.hp (30) — the P3 spec number
flammable = true
mobility = 1000       # fully walkable — no movement penalty (unlike furniture's 400)
permeability = 1.0    # explicit: no wind interaction (a walk-through canopy)
light_atten = [0.0, 0.0, 0.0]   # explicit: no vision interaction (see straight through)
heat_atten = 0.0      # no interaction beyond burning
conductivity = 0.0    # kappa 0 = no conduction face (like furniture/kindling);
                       # fire eats it via flammability instead
thermal_mass = 8       # wood-like (cellulosic), heats fast & locally (heat >> 3)
cool_shift = 13        # THE dial: conductivity = 0 means the ambient decay is
                       # foliage's ONE loss channel, same as furniture/wood/
                       # kindling (all cellulosic materials move together).
                       # e-fold 2^13/24 = 341.3 s.
ignition_temp = 280.0  # wood-like, matches furniture/kindling
wave_absorb = 0.0      # no interaction beyond burning (not a blast damper)
blast_resist = 0.0
burst_threshold = 0.0  # not a wall — no over-pressure relief relevance
cover_exposure = 1.0   # no vision interaction -> no concealment, never a roll

# =============================================================================
# Weapons framework (mechanics/03 §4) — three data tables loaded by
# simulation.weapons: [weapons.*] the delivery instrument, [ammo.*] the round,
# [payloads.*] what happens at the destination. W1 re-home: the old
# [weapons.rifle]/[weapons.grenade]/[weapons.door_explosive] sections live on
# as rows here with the SAME NUMBERS — zero behavior change; the unified
# march / spread split / crits / payload executor / ammo economy are W2/W3.
# Unlisted columns take the loader defaults (spread 0, shots 1, rof 0, mag 0,
# crit_chance 0, crit_mult 2.0, mass 0, loudness 0, payload columns 0/empty).
#
# METER-BASED RANGES (W6, Erik's design decision 2026-07-07): weapon reach is
# authored as range_m — PHYSICAL METERS — and converts to the integer tile
# range at Simulation construction using the loaded level's tile_size_m:
#     range_tiles = max(1, int(range_m / tile_size_m + 0.5))    # round-half-up
# quantized ONCE at table build (engine/14 door 2; the divide is door 3), so a
# weapon reaches the same physical distance on any grid resolution. The pinned
# test worlds are 1.0 m/tile (meters == tiles: every pre-W6 tile count below
# became the same number in meters — bit-identical effective ranges); the
# playground (0.333 m/tile) derives 3x the tiles for the same physical reach.
# The ONE deliberate exception: dragon_7 rescaled to 10 m (Erik's call — the
# W4 value, 8 tiles, was authored pre-meters and read as 2.7 m in-playground).
# =============================================================================

[weapons.k5_carbine]                  # assault rifle — the shipped rifle, re-homed
archetype = "projectile"
