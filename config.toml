# --- W4 SPRAY rows (mechanics/03 §5/§6): sustained cone of FIELD WRITES ------
# CONE-ANGLE CONVENTION OF RECORD: the armory table (§6) quotes the FULL cone
# ("30° cone"); config authors the HALF-angle — the membership test's natural
# quantity (bearing-off-axis <= half angle) — so Dragon-7's 30° cone is
# cone_half_angle_degrees = 15.0. One trigger = one BURST = burst_seconds of
# per-tick cone deposits (1.5 s -> 36 ticks @ 24 tps); mag_size counts BURSTS
# (W3 machinery). v1 rules: explicit stationary fire orders only (no move
# order in the same phase), auto-fire skips sprays, interruption (can_act
# False) consumes the order. Spread fields 0: a cone weapon draws no spread —
# and no RNG at all (the W4 determinism gate).

[weapons.dragon_7]                    # flamethrower — the FIRST SPRAY (W4)
archetype = "spray"
ammo_family = "fuel_tank"
cone_half_angle_degrees = 15.0        # armory "30° cone" = the FULL angle
# range_m — THE W6 RESCALE (Erik's logged intent): 10 m standard. The W4 row
# authored 8 TILES pre-meters, which read as a 2.7 m sputter on the 0.333
# m/tile playground — the feel-check's "invisible flamethrower" in numbers.
# 10 m -> 30 tiles in the playground, 10 tiles in the 1.0 m/tile test worlds.
# heat_deposit scales with it — see [ammo.fuel_standard] for the derivation.
range_m = 10.0
burst_seconds = 1.5                   # -> 36 deposit ticks @ 24 tps
spread_deg = 0.0
spread_snap_deg = 0.0
mag_size = 4                          # 4 BURSTS per tank (bursts, not rounds)
reload_seconds = 4.0                  # tank swap stall -> 96 ticks @ 24 tps
ap_cost = 1
crit_chance = 0.0                     # sprays never touch units — no crit path
crit_mult = 2.0
mass_kg = 8.0
loudness = 0.6                        # reserved, no consumer yet (stealth layer)

