# mitigation) AND a payload ref (the splash executes at the stop tile —
# first solid / footprint / cover absorption / max range, event kind
# "shell"). glow = "plasma" makes the march emit the render-only
# ProjectileGlowEvent each tick — the slow bolt is VISIBLE (1.5 t/t = 36
# tiles/s: dodgeable, watchable, a flying ember).
[ammo.plasma_standard]                # the Sunspot bolt
family = "cell_plasma"
damage = 40                           # armory "40 HEAT + splash" — the direct hit
dtype = "heat"
ap = 0
speed_tiles_per_tick = 1.5            # armory 1.5 t/t — a slow glowing bolt
wall_damage = 0                       # the SPLASH does the wall work (40mm rule)
payload = "plasma_splash_small"
glow = "plasma"

[ammo.plasma_heavy]                   # the Helios bolt
family = "cell_plasma"
damage = 70                           # armory "70 HEAT + splash"
dtype = "heat"
ap = 0
speed_tiles_per_tick = 1.25           # armory 1.25 t/t — slower, heavier
wall_damage = 0
payload = "plasma_splash_large"
glow = "plasma"

[ammo.fuel_heavy]                     # the Dragon-9's tank (default_ammo)
family = "fuel_tank"
damage = 0                            # sprays apply no packets, ever (W4 invariant)
dtype = "heat"                        # bookkeeping only (no packet path)
ap = 0
# heat_deposit 4800 — the fuel_standard derivation (see above) re-targeted
# at the Dragon-9's 20 m range on the playground grid (0.333 m/tile ->
# range_tiles 60): sustained-jet ignition needs D >= 77.4 * d, so the far
# edge d = 60 needs D >= 4645 -> 4800 (reach ~62 tiles). Twice the
# Dragon-7's 2400 for twice the reach — the same discipline, one dial.
heat_deposit = 4800.0
gas_species = "fuel_gas"
gas_amount = 0.25                     # a thicker haze than the Dragon-7's 0.15

[ammo.grenade_incendiary]             # incendiary hand grenade (mechanics/03 §6)
family = "hand_grenade"
damage = 0
dtype = "blast"
ap = 0
speed_tiles_per_tick = 1.25           # the shipped grenade flight (30 tiles/s)
travel_speed_tiles_per_second = 30.0
payload = "incendiary_splash"

[ammo.40mm_incendiary]                # 40 mm incendiary — SAME payload row as the
family = "40mm"                       # hand grenade (one definition of "incendiary",
damage = 0                            # two deliveries — the W3 row-identity rule)
dtype = "blast"
ap = 0
speed_tiles_per_tick = 1.25
wall_damage = 0
payload = "incendiary_splash"

# The W1-finding smoke boolean SPLIT (mechanics/03 §8, wired W3): clear_smoke
# documents apply_explosion's built-in inner-radius (40%) smoke clearing — v1
# keeps that clear INSIDE apply_explosion, so the column is data-of-record,
# wired live when FieldEdit takes over the explosion internals.
# emit_blast_smoke is LIVE: the payload executor (simulation.payloads) gates
# add_explosion_smoke (the noisy textured cloud) on it. BOTH must be true on
# frag_standard AND breach_focus or the door charge silently loses its smoke.
[payloads.frag_standard]              # the shipped grenade blast, byte-for-byte
radius = 5                            # was blast_radius
pressure = 10.0
wall_damage = 200
unit_damage = 60
gas_species = ""
gas_amount = 0.0
gas_radius = 0
ignite_radius = 0.0
ignite_intensity = 0.0
clear_smoke = true                    # data-of-record: the inner clear lives in apply_explosion (v1)
emit_blast_smoke = true               # LIVE: the executor's add_explosion_smoke gate (W3)

[payloads.breach_focus]               # the shipped door charge, byte-for-byte
radius = 3
pressure = 5.0
wall_damage = 500
unit_damage = 60
clear_smoke = true                    # data-of-record (see frag_standard)
emit_blast_smoke = true               # LIVE: the door charge keeps its smoke (W1 finding)

# --- W3 payload rows (mechanics/03 §6) — STANDARD VALUES for Erik's tuning --
# Gas payloads put gas IN THE AIR (a deterministic radial deposit into the
# engine/05 §6.2 gas slice, no RNG); what the gas DOES to lungs/eyes rides the
# mechanics/05 coupling table ([exchange] below), same as heat. gas_amount
# above 1.0 saturates the cloud core to full density (the [0,1] slice clamp)
# and feathers the edge.
[payloads.smoke_screen]               # the laser countermeasure / concealment cloud
gas_species = "steam"
gas_amount = 1.5                      # saturates the core out to ~1/3 radius; interesting range 0.5..2.0
gas_radius = 4

[payloads.tear_burst]                 # area denial: teargas -> BLINDED (snap-cone fire)
gas_species = "teargas"
gas_amount = 1.0
gas_radius = 3

[payloads.poison_cloud]               # lethal cloud: poison -> POISON DoT (zombies immune)
gas_species = "poison"
gas_amount = 1.0
gas_radius = 3

[payloads.incendiary_splash]          # ignition ring: fire = max(fire, intensity*falloff)
ignite_radius = 2.5                   # tiles; flammable tiles only (fire policy skip-mask)
ignite_intensity = 0.5                # seed intensity at the centre; never lowers a bigger fire

[payloads.demolition_c4]              # "bigger bombs" (mechanics/03 §5): C4 satchel warhead
radius = 8
pressure = 25.0
wall_damage = 800
unit_damage = 150
clear_smoke = true
emit_blast_smoke = true

# --- W6 plasma splashes ------------------------------------------------------
# Small-radius HEAT/IGNITE + modest wall damage (the launch-note spec). The
# bolt's DIRECT HIT carries the unit damage (ammo damage 40/70 HEAT);
# unit_damage here stays 0 — units near the splash cook through the existing
# heat|max exchange row reading the heat_amount deposit (two-terminals, zero
# new damage code). heat_amount derivation (engine/06 convert, one-shot):
# centre temperature jump = heat/thermal_mass; wood (mass 8) ignites at 300,
# and the same-tick cooling (x31/32) shaves ~3%, so the centre needs
# heat >= 8 * 300 * 32/31 ~= 2477 to ignite wood INSTANTLY where the bolt
# lands -> 3200 (jump 400 -> ~387 after cool: comfortable margin, and the
# LINEAR falloff keeps instant-ignition inside ~1/5 of heat_radius; the
# ignite ring below guarantees the visible fire pop regardless).
[payloads.plasma_splash_small]        # Sunspot
radius = 2                            # modest wall damage + a small pressure pop
# wall_damage 25 — a SCORCH, not a breacher: wood walls carry hp 60, so a
# Sunspot bolt chips the partition it wants to IGNITE rather than blowing
# it away before the fire takes (3 bolts to break wood, and by then it
# burns). STANDARD VALUE: 10 (cosmetic) .. 60 (one-bolts a wood wall).
pressure = 1.5
wall_damage = 25
heat_amount = 3200.0                  # centre jump 400 (wood ignites instantly)
heat_radius = 2.0
ignite_radius = 1.5                   # the guaranteed fire pop (flammables only)
ignite_intensity = 0.5
clear_smoke = false                   # a bolt is not a blast wave
emit_blast_smoke = false              # its smoke comes from what it BURNS

[payloads.plasma_splash_large]        # Helios
radius = 3
pressure = 2.5
# wall_damage 45 — heavier scorch (2 Helios bolts break a wood wall; steel
# shrugs). STANDARD VALUE: 25 (the Sunspot) .. 120 (breacher-lite — but
# then the bolt destroys the very wall it just set alight, see above).
wall_damage = 45
heat_amount = 5600.0                  # centre jump 700 — ignites past half-radius
heat_radius = 3.0
ignite_radius = 2.5
ignite_intensity = 0.6
clear_smoke = false
emit_blast_smoke = false

[zombie]
hp = 400
seconds_per_tile = 0.58333333      # 7/12 s -> 7 ticks @ 12 tps (faster than marine attack move)
melee_damage = 60
trigger_radius = 48
propagation_radius = 15
bullet_damage_multiplier = 0.25
# fire_damage_multiplier: the zombie's HEAT vulnerability — since P5 this key
# IS the live source of resist_mult[HEAT] on the zombie mitigation table
# (species.ZOMBIE_MITIGATION, mechanics/06 §2: "a vulnerability is just a
# resistance above 1"). 4.0 = a zombie takes 4x a marine's heat/burn damage
# (feel: fire is THE zombie answer; lower it and flamethrowers stop being a
# crowd solution). STANDARD VALUE placeholder for Erik's tuning (mechanics/06
# §8). Interesting range: 1.0 (no vulnerability) .. 8.0 (tinder). Read ONCE at
# species-table import -> RESTART to apply, not Ctrl+R (the PhysicsRunner
# construction-bind precedent, engine/12 §5). The two heat tests
# (test_unit_heat_damage / test_fire_heat_source) read the same key as the
# expected zombie/marine damage ratio, so sim + tests move together.
fire_damage_multiplier = 4.0
# stability: knockdown susceptibility (mechanics/06 §4) — a blast knocks a
# unit down when its per-tick |dv| >= knockdown_dv_threshold * stability, so
# LOWER = topples easier. 0.9 = shamblers go down slightly easier than a
# braced marine (feel: the outer blast ring bowls the horde over while the
# marines stagger). The ONE non-physical knockdown knob (mass/footprint are
# Newtonian; resist tables mitigate damage only). STANDARD VALUE placeholder
# (mechanics/06 §8). Interesting range: ~0.5 (bowling pins) .. 1.5 (rooted).
# Q16.16-snapped at species-table import (door 2) -> RESTART to apply, not
# Ctrl+R. The marine baseline (1.0) lives on EnvironmentProfile.stability.
stability = 0.9
attack_cooldown_seconds = 1.0      # 1.0 s -> 12 ticks @ 12 tps

[marine]
hp = 100
grenades = 2
explosives = 2
# weapon — the marine's default [weapons.*] row (W4: data-driven, replaces
# W1's code literal; consumed at Unit construction). ERIK'S FEEL-CHECK LOOP:
# set to "dragon_7" (or "miasma_vent"), RESTART the game (units + weapon
# tables are construction-bound — Ctrl+R alone re-reads config but re-arms
# nothing, engine/12 §5), launch `main.py --level playground`, issue fire
# orders, watch rooms burn.
weapon = "k5_carbine"
# OnePhaseWEGO loadout (onephase_wego design §15): primary + secondary, swapped
# freely for 0 cost except the 0.75 s swap CD — "the design intent is *lots* of
# weapon changes, choosing the tool for the task". `weapon` above is the
# PRIMARY (and remains what every other ruleset arms a marine with, untouched);
# `secondary` fills the second slot. A slot may hold a weapon OR an item (§15),
# so any [weapons.*] row name is valid here.
secondary = "p12_whisper"
# The quick-item belt (§15, the Dark Souls 3 pattern): 4-5 slots for
# seldom-used items. Belt slots ARE hotbar slots — same action-registry rows,
# one system wearing two skins — so entries name LOBBED/PLACED weapon rows,
# which is what the registry generates its `use_*` item actions from.
belt = ["hand_grenade", "breach_charge"]

[rendering]
# Resolution of the world composite RT in pixels per tile — the sharpness
# CEILING for everything (art, lights, overlays): art above this is
# downsampled on entry, zoom beyond it shows scaled-up RT pixels. The v2 art
# is 78 px/tile; 48 matches the deepest practical on-screen zoom (sharp in
# play), 78 = true native (RT grows ~2.6x, GPU fill cost rises with it).
# Read at renderer construction (restart, not Ctrl+R).
world_px_per_tile = 48.0
# Pressure colormap: [pressure, R, G, B, alpha]
# Linear interpolation between stops. Tweak and restart to iterate.
pressure_scale = 2.0    # scales deviation from 1.0: displayed = 1 + (raw - 1) * scale
pressure_stops = [
    [0.0,    0,   0,   0,   0],       # vacuum: fully transparent
    [3.3,  255, 255, 255,   5],       # normal air: faint white veil
    [6.0,  255, 255, 255,  15],       # slight overpressure: steam
    [7.0,  200,  50,  30, 120],       # shockwave: dark red
    [8.0,  255, 140,  30, 180],       # blast: orange
    [9.0,  255, 220,  80, 220],       # intense: yellow
    [10.0, 255, 255, 255, 255],       # max: white
]

[combat]
blast_damage_threshold = 5
unit_absorption = 0.85
unit_reflectivity = 0.10
shot_tracer_duration = 0.4

# --- Crit arc multipliers (mechanics/06 §5, W2) ------------------------------
# On a connecting projectile hit: crit% = weapon.crit_chance x arc multiplier,
# classified from the shot's incoming direction vs the TARGET's synced facing
# (arc widths are species-profile data: EnvironmentProfile.front/behind_arc_deg).
# STANDARD VALUES (mechanics/06 §5: x1 front, x2 flank, x4 behind — Erik's
# dials). All shipped weapons carry crit_chance = 0, so no roll is ever drawn
# in-game yet (the lazy-roll rule); a crit multiplies the packet amount by
# weapon.crit_mult before mitigation.
crit_front_mult = 1.0
crit_flank_mult = 2.0
crit_behind_mult = 4.0

# --- Unit heat damage (engine/06 §4, proposal §4.2) -----------------------
# A LIVING unit sampled at its footprint takes radiant heat damage from the
# already-occluded `heat` buffer (units are full ray-blockers, so heat[tile]
# IS the incident, distance-attenuated, occluded radiant flux at that tile):
#
#   Phi     = max(heat over footprint) / HEAT_SCALE          # incident flux
#   Phi_abs = Phi * unit_absorption * (1 - unit_reflectivity) # 0.85 * 0.90 = 0.765
#   T_felt  = heat_ambient_ref + heat_flux_to_temp * Phi_abs  # radiation -> felt temp
#   over    = T_felt - temperature_max                        # damage band (per-unit profile)
#   dmg     = environmental_damage_rate * (1 + heat_overtemp_scale * over) * dt_tick
#   -> DamagePacket(dmg, HEAT) through the mechanics/06 pipeline: the zombie
#      x4 is resist_mult[HEAT] on species.ZOMBIE_MITIGATION (same position,
#      pre-quantize), a marine's neutral table is an exact no-op.
#
# Defaults are tuned so a unit in a strong beam cooks while a warm room is
# survivable (temperature_max defaults to 60 in EnvironmentProfile):
#   - faint warmth (Phi ~1):  T_felt ~26  -> over < 0  -> no damage (survivable)
#   - modest beam  (Phi ~10): T_felt ~81  -> over ~21  -> ~2 HP/s on a marine
#   - strong beam  (Phi ~100):T_felt ~632 -> over ~572 -> ~30 HP/s (cooks in ~3 s)
# environmental_damage_rate / temperature_max come from each unit's
# EnvironmentProfile (config keys below are the global fallback if absent).
# dt_tick = 1/ticks_per_second keeps the real DPS tick-rate independent.
heat_flux_to_temp = 8.0          # felt-degrees per absorbed heat-unit (k_flux_to_temp)
heat_ambient_ref = 20.0          # baseline felt temperature, no beam (T_ambient_ref)
heat_overtemp_scale = 0.05       # damage ramp above the band (k_over), small +ve
temperature_max = 60.0           # global fallback band ceiling if a unit has no EnvironmentProfile
environmental_damage_rate = 1.0  # global fallback env-damage rate (per unit/sec) if no profile

# --- The physics<->unit exchange layer (mechanics/05) ------------------------
# Constants for the coupling-table rows that are not weapon numbers. First
# resident: the wave_p impulse-push row + its KNOCKED_DOWN trigger
# (mechanics/05 §1 / 06 §4; simulation/exchange.apply_wave_push, invoked at
# Simulation.step 9c2 — after heat damage, before the recorder snapshot).
#
#   (gx, gy) = reduce_grad(wave_p, footprint)          # Q16.16 counts, uphill
#   dv       = k_push * (-g / 65536) / unit.mass       # tiles/s, per tick
#   dx       = clamp(dv * dt_tick, +-push_max_tile_per_tick)   # the nudge
#   knocked  = dvx^2 + dvy^2 >= (knockdown_dv_threshold * stability)^2
#
# ALL FOUR ARE STANDARD-VALUE PLACEHOLDERS FOR ERIK'S TUNING (mechanics/06
# §8). Calibrated 2026-07-05 against a grenade (radius 5, pressure 10.0,
# unit_damage 60, mass-80 marine, 24 tps, 48x48 open room):
#   - meaningful blast DAMAGE reaches ~4.6 tiles (geometric falloff vs the
#     blast_damage_threshold);
#   - with k_push=400 / threshold=6.0 the KNOCKDOWN ring reaches ~9-10 tiles
#     (peak per-tick |dv| tiles/s by distance: d=4: 11.3, d=6: 9.1, d=7: 8.0,
#     d=8: 6.4, d=9: 7.0, d=10: 5.8, d=12: 5.7, d=14: 4.5, d=16: 3.3) —
#     i.e. knockdown_radius ~= 2x damage_radius, the mechanics/06 §4
#     "knocks marines sprawling without killing them" signature;
#   - the visible motion is a BUFFET: peak single-tick hop 0.3-0.5 tile with
#     a partial spring-back as the pulse's tail passes (linear acoustics:
#     a passing wave's net impulse largely cancels — measured net drift
#     +-0.2 tile, max forward excursion ~0.2-0.4 tile at k_push=400). A
#     SUSTAINED 1-tile-class throw would need the atmosphere-dome (blast
#     wind) term — a separate coupling row, Erik's design call, not in v1.
#
# HOT-RELOAD: all four apply LIVE via Ctrl+R — apply_wave_push reads
# CFG.exchange every tick, and config.py re-derives knockdown_getup_ticks
# from the seconds on every reload. Edit -> Ctrl+R -> re-throw, no restart.
[exchange]
# k_push — how hard shockwaves shove bodies. Feel: at 400 a grenade buffets
# marines 0.3-0.5 tile; the same dial scales the knockdown dv, so raising it
# WIDENS the knockdown ring too. Interesting range ~100 (a nudge you barely
# see) .. 2000 (ragdoll cannon: everything near a blast hits the cap and
# goes down).
k_push = 400.0                   # impulse gain: dv = k_push * grad / mass (tiles/s per unit gradient)
# push_max_tile_per_tick — motion sanity rail, NOT the knockdown gate (the
# trigger uses the uncapped dv). Feel: the max per-tick hop a violent
# gradient can produce. Interesting range 0.1 (stiff) .. 1.0 (teleporty at
# point blank); above ~1 a hop can visually skip a tile.
push_max_tile_per_tick = 0.5     # sanity cap on the per-tick displacement (tiles)
# knockdown_dv_threshold — the topple gate at stability 1.0. Feel: LOWER =
# blasts floor people farther out (at 6.0 a grenade's knockdown ring is
# ~9-10 tiles, ~2x its damage ring). Interesting range ~3 (twitchy — any
# passing wave floors you) .. 12 (stoic — only point-blank blasts topple).
knockdown_dv_threshold = 6.0     # |dv| (tiles/s) at stability 1.0 that triggers KNOCKED_DOWN
# knockdown_getup_seconds — prone time (no move/act, sprite sideways). Feel:
# the crowd-control payoff window after a good grenade. Interesting range
# 0.5 (a stumble) .. 4.0 (a real opening). Re-knocks refresh the timer.
knockdown_getup_seconds = 1.5    # prone time; config.py derives knockdown_getup_ticks (36 @ 24 tps)

# --- The W3 gas coupling rows (mechanics/05 §1: gas[teargas] / gas[poison]) --
# Both rows read the unit footprint with the heat row's reduction (max — the
# densest gas tile on the body is the exposure that matters), threshold-gated
# (Q16.16 integer compare, quantized once per pass), NO RNG. ALL FOUR ARE
# STANDARD-VALUE PLACEHOLDERS FOR ERIK'S TUNING (mechanics/06 §8).
# teargas_blind_density — footprint-max teargas density above which a unit is
# BLINDED (can_aim suppressed -> fires with the SNAP cone even on aimed
# orders). Feel: LOWER = the cloud edge already stings. Interesting range
# ~0.05 (wisps blind) .. 0.5 (only the thick core).
teargas_blind_density = 0.15
# teargas_blind_seconds — BLINDED duration per qualifying tick (refresh-
# stacked: standing in the cloud re-ups it every tick; it outlasts leaving
# the cloud by this much). Interesting range 0.5 (blink it away) .. 3.0
# (staggering out half-blind).
teargas_blind_seconds = 1.0
# poison_min_density — footprint-max poison density below which no dose
# accumulates (the cloud's harmless fringe). Interesting range 0.02 .. 0.2.
poison_min_density = 0.05
# poison_dps — POISON damage per second at FULL density (1.0); the per-tick
# packet scales linearly with the footprint-max density (dps * density / tps
# through the mechanics/06 pipeline -> marine resist 1.0, zombie resist 0.0:
# they don't breathe — and poison must NOT become the anti-horde cheese;
# fire is the answer). Interesting range ~2 (a lingering hazard) .. 20
# (a death sentence to stand in).
poison_dps = 6.0

[recorder]
# Physics ring-buffer length in seconds. config.py derives the integer slot
# capacity via round(replay_seconds * ticks_per_second). 100 s -> 1200 @ 12 tps.
replay_seconds = 100.0
