[clock]
ticks_per_second = 24
phases_per_round = 2
phase_duration_seconds = 5.0
ap_per_phase = 2

[movement]
# Per-second tunables (tick-rate independent). config.py derives the integer
# *_ticks_per_tile counts via max(1, round(seconds * ticks_per_second)).
# Values chosen to reproduce the legacy 12-tps integers (9, 6, 4).
marine_attack_seconds_per_tile = 0.75       # 0.75 s/tile -> 9 ticks @ 12 tps
marine_cover_seconds_per_tile = 0.5         # 0.5  s/tile -> 6 ticks @ 12 tps
marine_sprint_seconds_per_tile = 0.33333333 # 1/3  s/tile -> 4 ticks @ 12 tps
xeno_sprint_ticks_per_tile = 1

[physics]
wave_c = 66.0                        # wave speed (tiles/s), ~c / 3 m/s physical
wave_damping = 3.0                    # wave velocity damping (1/s)
wave_transfer = 0.5                   # wave_p -> atmosphere transfer rate (1/s)
source_feed_rate = 200.0              # wave_source -> wave_p feed rate (1/s)
d_atm = 200.0                         # atmosphere diffusion (IMEX = no CFL limit!)
# Patch 2b (2026-06-22): smoke now moves on the REAL dt (the double-applied
# smoke_dt_scale=3.0 -> 9× fudge is GONE). advection_rate was bumped ×9 (100->900)
# to preserve the visible wind-ride; the smoke DIFFUSION is now ~9× weaker than
# the shipped build, so d_smoke (and the per-gas [gases.*] diffusion table) WANT A
# RE-TUNE by eye. "Tuning isn't sacred" — these are sensible defaults, not final.
d_smoke = 0.1                          # FLAG: ~9× weaker effective diffusion now (dt_scale removed) — re-tune
advection_rate = 900.0                # smoke wind-ride coefficient on the real dt (was 100 × dt_scale²=9)
breach_rate = 5.0                     # relaxation rate toward vacuum at hull breaches (1/s)
max_source_per_step = 10.0             # max wave energy fed per substep (IMEX handles big spikes)
wind_diffusion_scale = 50.0            # wind-dependent diffusion: D = d_smoke * (1 + scale * |wind|)
smoke_sink_strength = 2.0              # smoke-side sink-pull toward nearest breach (cells/hop along the breach-ward gradient, capped at 1 to follow the BFS path). 0 = off (sealed-room behaviour); >=1 = full per-hop pull. Sealed room always untouched. Binds at PhysicsRunner construction (restart, not Ctrl+R).
smoke_vent_hops = 16                   # Patch 2b: K = vent hops/tick — how many 1-cell breach-sink passes run each tick, decoupled from the wave CFL. Default ≈ the old n_wave so venting starts where it was. Erik tunes by eye (more = faster drain).
explosion_smoke_noise = 0.85           # per-tile contrast of the explosion smoke deposit (add_explosion_smoke). The per-tile multiplier is drawn uniform in [1 - noise, 1.0]: noise=0 => flat blob (no texture); noise=0.6 => the old [0.4,1.0] look; noise=0.85 (default) drops the floor to 0.15 so some tiles read near-empty (ragged holes / missing patches) giving the cloud visible initial texture for advection to grab; noise=1.0 => full contrast ([0.0,1.0], maximal holes). Seeded RNG => deterministic.
unit_permeability = 0.5                # gas/smoke permeability of a living unit's footprint (0 = seals, 1 = open; 0.5 = porous body slows flow)
unit_wave_absorb = 0.5                  # shockwave energy a living unit's footprint absorbs (0 = none, 1 = full; high = a body soaks the blast)
wave_absorb_strength = 8.0             # global scale on per-cell wave_absorb damping (tuned so units visibly soak the wave without nuking it)
burst_enabled = true                   # over-pressure wall failure (emergent pressure-relief valve)
burst_max_per_tick = 16                # cap on walls that may burst in one tick (anti-runaway)
physics_dt = 0.001                # 1ms (CFL stable for c=300 tiles/s)
physics_substeps = 8              # 8 * 1ms = 8ms physics per game tick

# Temperature / conduction constants (engine/06 §2, proposal §7.2). Q16.16
# domain shared with `heat` (TEMP_SCALE == HEAT_SCALE). The self/face shift
# tables are derived from `conductivity` ONCE at load using these; the runtime
# conduction pass is a pure signed-add + arithmetic right shift (no float, no
# divide) -> deterministic / bit-identical cross-machine.
[physics.thermal]
TEMP_SCALE   = 65536    # Q16.16, = HEAT_SCALE (shared temperature/heat domain)
SHIFT_AT_REF = 2        # metal self-rate = 1/4 (fastest stable on a 4-nbr grid)
SHIFT_MIN    = 2        # rate floor / stability bound: 4 faces * 1/4 = 1 (convex)
KAPPA_REF    = 50.0     # reference conductivity (hull) for the log bucket
NO_FACE      = 63       # sentinel: kappa==0 face / grid edge -> zero conduction
# Ambient cooling (engine/06 §3, proposal §3.3). Newtonian decay toward ambient
# (T_ambient == 0, since temperature stores ΔT above a reference): T -= T >> shift.
# Interior tiles use COOL_SHIFT; a tile whose 4-neighbourhood touches vacuum (or
# atmosphere < o2_vacuum_thresh) sheds via the smaller COOL_SHIFT_VACUUM, so a
# space-facing breached wall cools 4× faster. Pure signed-add + arithmetic right
# shift -> deterministic. These are the burn-out tuning dials.
COOL_SHIFT        = 5    # interior decay: T -= T >> 5 (~1/32 per tick, ~32-tick e-fold)
COOL_SHIFT_VACUUM = 3    # space-exposed decay: T -= T >> 3 (~1/8 per tick, 4× faster)
o2_vacuum_thresh  = 0.3  # atmosphere below which a 4-neighbour counts as vacuum-exposed

# EOS refactor P2 — unified temperature, gas-T dials (docs/eos_refactor_design.md
# §4, §9). TUNING DIALS (feel-gated, first real pass at P5); sane starting points.
gas_advection_rate = 900.0  # gas-T wind->displacement scale; SAME convention/value
                             # as [physics].advection_rate (smoke) — hot air rides the
                             # wind at smoke's visual rate until P3 makes `wind` a real
                             # velocity, at which point this dial goes away.
c_v               = 1.0     # gas heat capacity for the radiation deposit
                             # ΔT = ΔE/(N·c_v) (§4.3). 1.0 = neutral scale (ΔT≈ΔE at
                             # ambient N=1.0); no real-gas anchor yet (P3 territory).
n_floor_heat      = 0.05    # floor on the per-tile N divisor (the real bulk N_total
                             # since P3) for the SAME deposit divide — INDEPENDENT of
                             # o2_vacuum_thresh / any other floor.
                             # CHECKED against the v2.4 single-tick criterion and KEPT
                             # (eos-p3fix-thermal-ceiling):
                             #   n_floor_heat >= heat_tick_max / (T_MAX_PHYS * c_v)
                             # measured heat_tick ~330 (one adjacent I=0.8 fire) =>
                             # worst one-tick deposit at the floor = 6,600 K <
                             # T_MAX_PHYS = 16,000 — holds at 0.05. A stacked firestorm
                             # ring (~8x) can exceed the ceiling in one tick; that case
                             # is bounded by the counted T_MAX_PHYS rail (its job). A
                             # trial raise to 0.2 measurably perturbed marginal
                             # ignition timings suite-wide for no correctness gain.
T_MAX_PHYS        = 16000.0 # v2.4 counted physical-maximum rail on the temperature
                             # FIELD (K above ambient), ~2x the design's stated 9000 K
                             # extreme — clamps every T deposit/write path (EOS step 4c,
                             # thermal Pass 1, combustion), each with a hit counter.
                             # Stands in for the fast equilibration a real near-vacuum
                             # gas would have (its T is thermodynamically ill-defined).
                             # Full rationale: cpp/src/eos_solver.h. PROVISIONAL,
                             # Erik review at P5.

# Fire / ignition-from-temperature (engine/06 §4, proposal §6 step 4b). The READ
# side of the temperature substrate: a flammable tile whose `temperature` (set by
# the conduction pass above) crosses its quantized `ignition_temp` AND has oxygen
# ignites via `fire = max(fire, ignition_seed)`. This is a SECOND ignition path
# that runs alongside the existing cellular fire spread (it does not replace it).
# Dormant in-game until fire/beams emit heat (temperature is ~0 with no sources).
# EOS refactor P4 (docs/eos_refactor_design.md §6): o2_threshold now reads the
# REAL N_O2 scale, not the old atmosphere/P (~1.0 ambient) scale — see the
# o2_threshold/P_min/P_full recalibration note in the fire feedback block below.
[physics.fire]
ignition_seed = 0.1   # seed fire intensity a temperature-ignited tile gets (I_seed)
o2_threshold  = 0.01  # min air-side-neighbour REAL N_O2 to ignite (mirrors the fire's
                       # P_min — see the v2.4 hot-zone-equilibrium recalibration note at
                       # P_min/P_full below; was 0.12 on the near-ambient-density assumption)

# --- Signed-logistic fire FEEDBACK (fire_design_proposal §2/§3/§5) ------------
# Cellular spread is DELETED: spread is now radiation -> heat -> temperature ->
# ignition (apply_temperature_ignition above). The fire step is purely the
# life/death of an already-lit tile. Per burning tile of intensity I in [0,1]:
#   T     = temperature[i] / TEMP_SCALE              (game units; ignition_temp=300 wood)
#   F     = clamp01(wall_hp[i] / fuel_ref)           (fuel from remaining wall HP)
#   O2    = mean REAL gas[o2] over open (non-solid,non-vacuum) 4-neighbours
#           (EOS refactor P4 — was the atmosphere/P proxy; design §6, item 3)
#   W     = |wind| from the SHARED wind field (= -grad p, incl. shockwaves)
#   hot   = clamp01((T - fire_T_ext) / fire_T_span)
#   o2    = smoothstep(P_min, P_full, O2)            (the REAL local O2 gate)
#   avail = F * o2
#   grow  = k_grow * avail * hot * I*(1-I) * (1 + k_wind_fan*W)   (logistic, wind-fanned)
#   die   = k_die*(1 - avail*hot)*I + k_wind_strip*W*(1-I)*I      (decay + wind blow-out)
#   I    += dt*(grow - die);  clamp01;  if I < I_min -> 0 (snap-extinguish)
# Plume: temperature[i] += the plume->T shim deposit (fire_pressure_gain-scaled,
#   self-limiting on `atmosphere[i]/p_expand_ref` — unchanged by P4, still reads
#   REAL pressure, not O2) -> p* rises -> wind points OUTWARD -> smoke pushed away.
# A sealed-room fire over-pressurises -> may pop a weak wall (find_burst_walls) -> vents
# -> P falls -> starves; ALSO now (P4) the room's REAL O2 depletes as it burns ->
# o2 -> 0 -> starves even in a wall that never bursts. Both emergent. Erik tunes
# all of these live.
k_grow            = 4.0    # logistic growth gain (1/s)
k_die             = 2.0    # decay rate when starved/cold (1/s)
fire_T_ext        = 350.0  # extinction temperature (~ignition_temp + 50; below it, fire dies)
fire_T_span       = 150.0  # width of the `hot` ramp above fire_T_ext
fuel_ref          = 60.0   # wall_hp normaliser: F = clamp01(wall_hp/fuel_ref)
# EOS refactor P4 RECALIBRATION (design §6): P_min/P_full used to be read against
# `atmosphere` (P), where ambient == 1.0. They now read REAL gas[o2], where
# ambient == ~0.21 (the P1 calibration: 0.21*N_amb O2 / 0.79*N_amb inert_N2, P1
# §2.1). P4's first rescale preserved the OLD 60%-of-ambient cutoff fraction
# (P_min = 0.60*0.21 = 0.126, P_full = 0.21).
# v2.4 SECOND RESCALE (eos-p3fix-thermal-ceiling; PROVISIONAL, Erik review at
# P5): onto the HOT-ZONE-EQUILIBRIUM scale. Derivation: at ideal-gas pressure
# equilibrium (P = C*N*T), the gas density beside a flame is
#     N_local ~= N_amb * T_amb_abs / T_air_abs
# so air at flame-zone temperatures (measured ~3-4 kK-rel with the v2.4
# absorption-proportional deposit) holds N ~= 0.07-0.09, i.e. N_O2 ~= 0.015-
# 0.02 — the 0.126 gate implicitly assumed NEAR-AMBIENT density at the flame
# edge, an atmosphere-proxy-era assumption P = C*N*T revokes. (Real fires keep
# their flame edge oxygenated by buoyant entrainment — fresh air drawn in at
# the base; this 2D no-gravity model has no buoyancy, so the gate scale
# compensates.) Measured sweep (branch report): 0.01/0.03 restores STRONG
# O2-differentiation (sealed 172 / vented 49 / flooded 39 ticks) and the
# original ignition budgets (dragon dist-3 t=28) through genuine oxygen
# physics; 0.02/0.05 differentiates weakly (44/42/39); 0.005/0.02 never
# starves a sealed fire.
# v2.5 re-measure (P5.1 stoichiometric fuel, design §5 v2.5 / decisions #17):
# the trio is now sealed 265 / vented 48 / flooded 39 — the ember-scale fuel
# drain weakens F and a weaker sealed flame starves its room more slowly.
# Ordering preserved, still bit-stable under the 1e-5 dial perturbation gate
# (test_payoff_orderings_perturbation_robust).
P_min             = 0.01   # local N_O2 below which the O2 proxy is 0 (O2 starves the fire)
P_full            = 0.03   # local N_O2 at which the O2 proxy saturates full
I_min             = 0.02   # snap-to-zero extinguish floor
k_wind_fan        = 0.5    # (1 + k_wind_fan*W) fans growth into a firestorm. NEEDS TUNING vs the live wind scale (a shockwave is a large transient spike).
k_wind_strip      = 0.5    # W*(1-I)*I blows out small/marginal fires (the realistic crossover). NEEDS TUNING vs the live wind scale.
fire_pressure_gain = 0.15  # own-tile plume overpressure gain (1/s) — pushes smoke OUTWARD
p_expand_ref      = 1.30   # self-limiting plume saturation ceiling (atm + thermal-expansion headroom)
smoke_emission    = 0.8    # smoke produced per second per unit intensity (KEPT)
wall_damage       = 0.4    # wall HP lost per second per unit intensity (KEPT — the burn-out brake)

# --- K2: fire as a sim-side heat ray source (proposal §1, fire_design_notes) --
# Each burning tile (fire > 0) becomes a short-range heat `LightSource` cast IN
# THE SIM at the START of the physics step, BEFORE the TemperatureSolver, so this
# tick's fire heat converts to temperature this same tick. The cast deposits ONLY
# into `gmap.heat` (Q16.16, saturating-add, attenuated by `heat_atten` per K1) —
# the render-side light glow is a separate later step. DETERMINISTIC: fixed ray
# count, fixed angles (no RNG), fixed row-major source order, integer add.
#
# Per burning tile of intensity I (fire value in [0,1]):
#   heat       = k_fire_heat * I                 (the gameplay payload — energy)
#   max_range  = range_base + range_per_I * I    (tiles; hotter fire reaches farther)
#   intensity  = intensity_base + intensity_per_I * I   (ray light weight; ~render)
#   ray_count  = fire_ray_count  (FIXED 8, no auto, no jitter)
#   color      = warm orange (render-only tint; heat is the sim payload)
#
# k_fire_heat is tuned (proposal §1 target): a lone burning tile (I=0.8) self-
# heats its own wood cell and conducts toward an adjacent wood wall's ignition_temp
# (300) so the neighbour crosses it over a FEW SECONDS (~1.5 s here — toward but
# not instantly past), while the existing cellular fire spread (spread_rate 0.3,
# neighbour ignition in a few ticks) still DOMINATES the spread. The heat path
# mainly adds unit damage + a slow secondary heat-ignition; it does NOT firestorm
# the map in a couple of ticks. Erik tunes this live. (`temperature` is ΔT in
# game units above a 20° reference, not literal Celsius — a fire reads hot.)
# PURE-DENSITY RE-TUNE (engine/08 §Falloff is density, 2026-06-28): the raycaster
# now divides each source's emitted power by its ray count (energy = power/N), so
# `heat` here is the burning tile's TOTAL heat power, no longer a per-ray amount.
# The old per-ray value (200) summed to ~8× at the source over the 8 fixed rays;
# to preserve the same deposited energy (and ignition/kill behaviour) it is scaled
# by fire_ray_count -> 1600. (Heat now radiates with a physical 1/r reach instead
# of the old steep 1/(1+d²) — slightly longer reach is the intended improvement.)
k_fire_heat          = 1600.0 # TOTAL heat energy per unit fire intensity, per tick (was 200/ray)
fire_ray_count       = 8      # FIXED rays per burning tile (no auto-count, no RNG dither)
range_base           = 2.0    # max_range = range_base + range_per_intensity * I  (tiles)
range_per_intensity  = 3.0
intensity_base       = 0.3    # ray light intensity = intensity_base + intensity_per_I * I
intensity_per_intensity = 0.7
color                = [1.0, 0.45, 0.12]   # warm orange (render-only; heat is colourless)
coarse_cluster       = 3      # reuse the raycaster's coarse clustering when many tiles burn

# Water pipe model (engine/07 §2, water plan W2). The C++ WaterSolver advances
# gmap.water_depth (metres of standing water) each tick: damped velocity kick +
# donor-cell upwind flux + per-cell outflow limiter. All keys are RESTART-BOUND
# (engine/12 §5: PhysicsRunner binds once at construction; Ctrl+R does NOT
# re-bind solver params). `dx` has no key — it binds from the level's
# tile_size_m, never assumed. No `substeps` key either: the count is derived
# house-style from the solver's CFL bound, n = ceil(sim_time / max_dt()) — 3 at
# 24 tps with the shipped k_p = 0.5 (2 with k_p = 0). ratio_cap/flood_eps drive
# the W3 displacement; boil_* drive the W5 flash-boil (steam_yield is SHARED
# with the fire side's evaporative heat-boil, so all steam puffs consistently).
# gamma_r/h_cap/k_amp/k_splash drive the W6a ripple — the VISUAL-ONLY surface
# wave (canon §6): it never feeds back into transport.
[physics.water]
g = 9.81          # m/s^2
damping = 1.0     # 1/s pipe friction (prototype-validated: fluid_test.py used 1.0)
v_max = 8.0       # m/s velocity clamp (paired with the C++ outflow limiter)
depth_eps = 1e-5  # m dry snap
k_p = 0.5         # pressure head m/atm — ON (W4): THE tuning dial. Physical 10.3 is excluded by feel
                  # (wave_p rings ~1 s vs a real blast's ms) AND by numerics: the head stiffens the wave,
                  # c_eff = sqrt(g*h*(1 + k_p*P/free_h)) — near-flooded cells (free_h -> 0) are the worst case.
ceiling_h = 2.5   # m air column (W3 displacement + the solver's h_ref CFL reference)
ratio_cap = 1.5   # max per-tick compression ratio (W3)
flood_eps = 0.05  # m remaining air column below which a cell counts flooded (W3)
boil_rate = 0.02      # m/s flash-boil sink in near-vacuum (W5)
boil_p_thresh = 0.3   # atmosphere below this boils (W5; pressure-keyed — drained rooms boil too, intended)
steam_yield = 4.0     # white_smoke density per metre boiled (W5)
gamma_r = 2.0     # 1/s ripple damping (W6a)
h_cap = 0.25      # m deep-water cap: c^2 = g*min(depth, h_cap) — pins ripple speed at ~4.7 tiles/s (W6a)
k_amp = 0.5       # ripple amplitude clamp |ripple| <= k_amp*depth — waves no taller than the water (W6a)
k_splash = 2.0    # wave_p -> ripple_v splash gain (W6a) — PURE FEEL DIAL, awaiting Erik's eyeball with W6b

[smoke]
# Ray-engine smoke optics (ch.05 §6.1 §6 — decoupled per-channel absorption vs
# glow). Two INDEPENDENT budgets, NOT constrained to absorb + glow = 1:
#
#   transmission:  tau_c = absorption[c] * density * absorb_scale; trans_c = exp(-tau_c)
#   scatter/glow:  smoke_glow[c] += local_light[c] * scatter_albedo[c] * density   (additive)
#
# smoke_absorb_scale is the global "beam reach" dial. Dial it DOWN for the
# long-beam "flashlight travels far through smoke and still glows" look Erik
# wants (exp(-tau) never hard-zeroes the beam, so it survives deep smoke). Dial
# it UP for a beam that dies fast. Defaults below approximate the shipped look:
# exp(-1.4*density) tracks the old (1-density) attenuation at mid density, and
# scatter_albedo = [1,1,1] reproduces the shipped god-ray glow magnitude.
# Per-channel absorption != grey enables COLOURED smoke later (per-channel = hue).
smoke_absorption = [1.0, 1.0, 1.0]       # Beer-Lambert per-channel absorption (R,G,B)
smoke_scatter_albedo = [1.0, 1.0, 1.0]   # additive god-ray/glow gain (R,G,B), decoupled from absorption
smoke_absorb_scale = 1.4                 # beam-reach dial: LOW = long beam (flashlight travels far), HIGH = beam dies fast
# Render-contrast curve applied to the *rendered* smoke opacity only (ch.05 §6.1
# step 5 "smoke^gamma"): value = pow(saturate(smoke_density), gamma) at pack time
# in FieldOverlay.update. This NEVER touches the simulation field — pure look.
# gamma > 1 crushes thin smoke toward transparent and sharpens wispy edges
# (filmic), killing the flat-fog look. Useful range ~1.2 (dense, soft) -> 2.5
# (thin, very wispy). 1.0 = off / identity (linear density-opacity, the old look).
smoke_render_gamma = 1.5                  # default mild, visible contrast bump (1.0 = off)

# Multi-gas material table (engine/05 §6.2). Smoke generalises from one scalar
# field to N gas density fields, one row per gas, sharing the SAME diffusion +
# advection solver (all gases ride the same wind). A gas type is data-driven,
# exactly like a material: one [gases.<name>] row. Loaded by
# simulation.gases.GasTable into per-gas arrays (absorption Nx3, scatter Nx3,
# diffusion, decay, flags) + a name->index map.
#
# Columns (research-approved values, §6.2):
#   absorption     [R,G,B] per-unit-density Beer-Lambert absorption (subtractive
#                  tint of transmitted light). M2 sums these density-weighted
#                  across coexisting gases in the raycaster; M1 only loads them.
#   scatter_albedo [R,G,B] additive god-ray/glow gain (decoupled from absorption,
#                  NOT constrained to absorb+glow=1).
#   diffusion      per-gas base diffusion coefficient (the per-gas d_smoke the
#                  transport loop binds before stepping that slice).
#   decay          per-tick decay rate (LOADED for M2/M3; NOT yet applied in
#                  transport — the M1 solver has no decay term, so applying it
#                  would break behaviour preservation; see physics_runner).
#   flammable      ignites where density > threshold (fuel_gas only) — read M3.
#   emits_when_hot black-body emission driven by the heat buffer — read M2/M3.
#   effect         per-gas gameplay tag, read unit-side in mechanics (not here).
#   conservative   EOS refactor P1 (docs/eos_refactor_design.md §2.1/§2.2):
#                  true ONLY for the bulk pair (o2 / inert_n2) below — routes
#                  that plane to donor-cell CONSERVATIVE flux transport
#                  (bulk_transport.cpp) instead of this per-gas semi-Lagrangian
#                  loop. False for every trace gas (unchanged behaviour).
#
# black_smoke is combustion soot — what fire and explosions emit. Its diffusion
# (0.10) matches today's d_smoke (0.1), so mapping the EXISTING generic smoke to
# the black_smoke slice is behaviour-preserving (engine/05 §6.2; M1).

# EOS refactor P1 calibration constants (docs/eos_refactor_design.md §2.1).
# Pressure is derived as P = C * N_total * T (Kelvin) once the compressible
# solver lands (P3); nothing physically consumes these yet (P1 is additive-
# only) — this is the calibration WITNESS pinned by
# tests/test_eos_p1_calibration.py: quantize(C * N_amb * T_amb_k) must equal
# quantize(1.0) (today's ambient atmosphere==1.0 scale) within 1 count, so
# every downstream consumer already tuned against "1.0 == 1 atm" keeps its
# calibration at rest when the solver switches over. N_amb == 1.0 (the
# ambient ``o2``+``inert_n2`` split below sums back to exactly 1.0 in Q16.16 —
# 0.21*65536 + 0.79*65536 rounds to 13763+51773 == 65536). C = 1/t_amb_k.
[physics.eos]
t_amb_k = 290.0                       # ambient gas temperature, Kelvin (§2.1's "290.0K-form")
C = 0.0034482758620689655             # 1/t_amb_k — chosen so C*N_amb*T_amb_k reproduces 1.0
# --- P3 pinned solver constants (docs/eos_refactor_decisions.md 2026-07-10) ---
# c_max/S/N_SUB_MAX/CFL_ADV/N_FLOOR_SOLVER are FROZEN once gated (never
# adaptive) — see cpp/src/eos_solver.h for the load-bearing derivation of
# each. gamma/absorb_strength/T_MIN are secondary dials (compression-work
# adiabatic index, D4 shockwave damping scale, and the T floor) not
# explicitly pinned by the decisions log; defaults mirror the C++ struct.
c_max = 300.0                         # m/s capped sound speed (Erik's call — retires wave_c=66)
S = 8                                 # Helmholtz RB-GS sweep count (gate may pin up to 16)
N_SUB_MAX = 8                         # advection substep cap (accuracy, not stability; re-pinned 16->8, Erik 2026-07-10, decisions #14)
CFL_ADV = 0.5                         # advection CFL number
N_FLOOR_SOLVER = 0.001                # solver-internal N floor (gameplay N unfloored)
adiabatic_index = 1.4                 # ideal-gas adiabatic index (compression work); TUNING DIAL
absorb_strength = 8.0                 # dyn_wave_absorb scale in the velocity-correction damping
T_MIN = -289.0                        # floor on the ambient-relative T field (T_abs >= ~1 K)
U_MAX = 1000.0                        # v2.4 defense-in-depth velocity rail (m/s): the step-4
                                      # store clamp caps |u| at min(c_LOCAL, U_MAX); counted.
                                      # Far above any legit game wind (ambient c=300); exists
                                      # so no T-side change can push stored velocities into
                                      # the int64/narrow overflow regime again (see
                                      # eos_solver.cpp step 4's overflow guard). PROVISIONAL,
                                      # Erik review at P5.

# EOS refactor P4 — combustion on real O2 (docs/eos_refactor_design.md §5,
# decisions log #12). Own pass, once per tick, after the EOS solver
# materializes P/N/T: burns fuel (flammable + wall_hp>0) against the local
# N_O2 mean, converting consumed O2 into black_smoke (soot_yield) + inert_N2
# (the remainder — N_total is CONSERVED, never a fake pressure drain) and
# depositing heat via the §4.3 reciprocal (shares c_v/n_floor_heat with
# [physics.thermal] above — ONE combustion/deposit floor in the system).
# Sane defaults; feel-tuned at P5 like every other fire/thermal dial.
[physics.combustion]
burn_rate         = 1.0    # N_O2 consumed per second, per open-neighbour burn site
o2_thresh_burn    = 0.03   # min local N_O2 to sustain combustion (below fire's
                            # P_min=0.126 so the VISIBLE flame dies first)
H_fuel            = 4.0    # heat yield (T-scale ΔT) per unit N_O2 burned
soot_yield        = 0.3    # fraction of consumed O2 -> black_smoke (rest -> inert_N2)
# v2.5 — P5.1 stoichiometric fuel consumption (docs/eos_refactor_design.md §5
# v2.5 amendment, decisions #17): the SOURCE tile pays wall_hp for every unit
# of N_O2 its neighbours burn, floored at 1 Q16.16 LSB (smolder NEVER destroys
# — structural destruction stays FireSimulation's I>0 wall_damage path). Wood
# stoichiometry burns ~0.7 mass-units of fuel per unit O2 — physically honest
# default, but in play THE ember-lifetime dial: smaller -> embers glow for
# minutes awaiting oxygen; larger -> they char out fast.
fuel_per_o2       = 0.7
# Unit-side suffocation mechanics (LATER arc, design §5): defined here so the
# constant lives at the right layer; nothing reads it yet.
o2_thresh_breathe = 0.08   # min local N_O2 a unit needs to breathe (NOT wired yet)

[gases.white_smoke]            # water vapour / steam
absorption     = [0.10, 0.10, 0.10]   # flat, low — Mie scattering is spectrally neutral
scatter_albedo = [0.92, 0.92, 0.95]   # NEAR-WHITE additive brighten — the dominant visual term
diffusion      = 0.18                 # spreads readily, light gas
decay          = 0.020                # condenses / dissipates moderately fast
glow           = 0.0                  # no self-glow (but scatters local light brightly)
flammable      = false
emits_when_hot = false
effect         = "vision_block"       # pure concealment; clears on decompression
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.black_smoke]            # combustion soot (== today's generic smoke)
absorption     = [0.88, 0.90, 0.93]   # near-neutral, slight blue tilt: thin soot reads warm/brown
scatter_albedo = [0.04, 0.04, 0.04]   # soot barely scatters — it is the dark gas
diffusion      = 0.10                 # heavier, clings; matches today's d_smoke=0.1 (behaviour-preserving)
decay          = 0.008                # lingers — soot settles slowly
glow           = 0.0                  # cold soot does NOT glow; hot soot via emits_when_hot
flammable      = false                # the soot itself is spent fuel
emits_when_hot = true                 # black-body emission driven by heat buffer (M2/M3)
effect         = "vision_block_heavy" # near-opaque concealment at density
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.poison]                 # chlorine (Cl2), yellow-green
absorption     = [0.45, 0.10, 0.80]   # B absorbed hardest, R moderate, G passes -> yellow-green tint
scatter_albedo = [0.10, 0.30, 0.06]   # faint green inscatter
diffusion      = 0.12                 # creeps and pools (heavier-than-air feel)
decay          = 0.004                # persistent — the hazard lingers
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = "damage_over_time"   # lethal cloud; saturates to iconic green at mid-high density
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.teargas]                # CS aerosol, pale near-white (ambiguous vs steam)
absorption     = [0.12, 0.16, 0.30]   # low overall, B ~2x R -> faint warm/yellow only in thick plumes
scatter_albedo = [0.88, 0.90, 0.92]   # near-white scatter, like steam — sustains the ambiguity
diffusion      = 0.15                 # disperses like a fine aerosol
decay          = 0.010                # clears moderately
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = "area_denial"        # forces units out of the area; non-lethal
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

[gases.fuel_gas]               # combustible vapour, faint, FLAMMABLE
absorption     = [0.08, 0.10, 0.16]   # very faint, slight blue tilt — nearly invisible haze
scatter_albedo = [0.20, 0.22, 0.28]   # weak, faintly cool scatter
diffusion      = 0.22                 # GAMEPLAY KNOB: high = gassy cloud, low = tight flamethrower jet
decay          = 0.006                # lingers as an ignition hazard
glow           = 0.0
flammable      = true                 # IGNITES -> spawns heat + black_smoke; the only flammable gas
emits_when_hot = true                 # while burning it glows via the black-body curve
effect         = "ignition_hazard"    # invisible-ish until lit; then a fireball
conservative   = false                # trace gas — semi-Lagrangian transport (unchanged)

# EOS refactor P1 — the two BULK species (docs/eos_refactor_design.md §1/§2.1).
# Together they ARE "air": ambient splits 21/79 (O2/inert_N2 by mole fraction,
# gamemap._update_caches / destroy_wall). conservative=true routes both to
# donor-cell CONSERVATIVE flux transport (bulk_transport.cpp) instead of this
# table's per-gas semi-Lagrangian loop. Per the P1 spec: ZERO decay, ALL
# optics zero (invisible bulk — must not tint light or change any visual),
# not flammable, no gameplay effect tag. diffusion=0.0 is inert here (the
# conservative pair never reaches the semi-Lagrangian diffusion step) but
# still must be a number — a config-schema requirement, not a behavior knob.
[gases.o2]                     # molecular oxygen — bulk air, breathable half
absorption     = [0.0, 0.0, 0.0]
scatter_albedo = [0.0, 0.0, 0.0]
diffusion      = 0.0                  # unused — conservative transport bypasses the SL loop
decay          = 0.0                  # bulk air does not decay
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = ""                   # no gameplay tag (unit-side suffocation reads N directly, later)
conservative   = true                 # EOS P1: donor-cell flux transport, not semi-Lagrangian

[gases.inert_n2]                # nitrogen + "burnt products" — bulk air, inert half
absorption     = [0.0, 0.0, 0.0]
scatter_albedo = [0.0, 0.0, 0.0]
diffusion      = 0.0                  # unused — conservative transport bypasses the SL loop
decay          = 0.0                  # bulk air does not decay
glow           = 0.0
flammable      = false
emits_when_hot = false
effect         = ""                   # no gameplay tag
conservative   = true                 # EOS P1: donor-cell flux transport, not semi-Lagrangian

[display]
panel_width = 250
level = "unhcr_vessel_2"          # folder under levels/ to load on startup (the repainted v2 ship; v1 = "unhcr_vessel")
# Water overlay v2 look knobs (water W6b; canon engine/07 §6 — the tasteful
# placeholder, not the shipped optics pass). RENDER-ONLY and RESTART-BOUND:
# GameRenderer binds them once at construction (the water_display_max
# precedent); Ctrl+R re-reads config.toml but does NOT re-bind overlays —
# restart the game to apply. Erik's eyeball-tuning dials.
water_ripple_shade = 0.35   # ripple-slope brightness gain: full +/-35% of the tint at slope 0.05 m/tile (fresh splash)
water_foam_thresh = 0.03    # |grad ripple| (m/tile) above which foam whitens; splash slope ~0.075 foams, settled ~0 never
water_ambient_base = 0.06   # idle ambient-sine shimmer amplitude on standing water; grows with local ripple energy, cap 0.40

# Water surface OPTICS pass (graphics/water_rendering.md §2/§4/§7 — the shipped
# GLSL Fresnel/GGX/refraction look, NOT the CPU placeholder above). RENDER-ONLY
# and RESTART-BOUND: WaterPass binds these once at construction; Ctrl+R re-reads
# config.toml but does NOT re-push them (the renderer-render-params precedent —
# restart to apply). Erik's eyeball-tuning dials. The pass is DORMANT-SAFE: with
# no standing water it outputs alpha 0 (identical render), so these only bite
# once water is on the floor. v1 CORE only — caustics/foam/CA are a later step.
[graphics.water]
roughness_base = 0.08       # GGX roughness floor — still puddles glint sharp (alpha = roughness^2)
roughness_agitation = 0.6   # added roughness per unit local ripple energy — sloshing water shimmers broad
fog_density = 3.0           # Beer-Lambert depth-tint rate: floor fades to water_color over ~1/fog_density m
refract_strength = 0.02     # normal-driven floor-warp magnitude (UV units), scaled by depth (no shoreline swim)
r0 = 0.02                   # Schlick Fresnel reflectance at normal incidence (top-down ~2%; ripple tilts spike it)
ripple_scale = 8.0          # metres-of-ripple-height -> on-screen normal-slope gain (ripples are millimetric vs a 1.0 UV)
water_color = [0.03, 0.10, 0.18]   # deep-water tint (the volume colour the floor fades toward with depth)
# Glint: the GGX highlight is ADDITIVE on top of the see-through base (light
# reflecting OFF the surface), NOT Fresnel-blended at ~2% nor alpha-attenuated.
# glint = ggx * NdotL * lightRGB * glint_strength, added to the premultiplied
# rgb WITHOUT × alpha — survives the premultiplied blit as additive HDR light,
# visible regardless of water transparency. Gated by lightRGB (only under a
# flashlight/fire) and NdotL (no back-lit glint). 2.0 = clearly visible on a
# flashlit rippled puddle; raise for sparklier, lower toward 0 to mute.
glint_strength = 2.0
# Transparency ramp: alpha = clamp(depth * alpha_scale, alpha_min, alpha_max).
# alpha_scale = depth->opacity rate (was the hardcoded 6.0); alpha_min = the
# shoreline floor (was 0.15); alpha_max = the deep-water ceiling (was 0.95).
# The glint does NOT touch alpha. Dial these to make standing water clearer or
# more opaque.
alpha_scale = 6.0
alpha_min = 0.15
alpha_max = 0.95
# --- Phase 2 (mood pass): caustics / foam / chromatic aberration / waves ---
# Caustics (§3): focused light dancing on the flooded floor under a flashlight.
# caustic = max(+laplacian(ripple), 0) * caustic_strength * lightRGB, ADDED
# into the refracted floor term (rides the floor, × alpha). SIGN load-bearing:
# +laplacian focuses (bright in dips); -div(N) ≡ same; +div(N) would invert it.
# caustic_scale > 0 layers a touch of high-frequency procedural detail (× the
# surface energy) for crispness; 0 = pure surface curvature.
caustic_strength = 2.5
caustic_scale = 6.0
# Foam (port of overlays.py:261-277): white whitecaps where |grad ripple| >
# foam_threshold + the wet/dry shoreline (high depth gradient). Composited LAST
# into the base (surface scatter, alpha-bound — NOT additive). foam_intensity
# scales the whiteness; foam_threshold is the steepness/edge above which foam
# starts (lower = more foam).
foam_threshold = 0.02
foam_intensity = 0.6
# Chromatic aberration (subtle polish): floor refraction r/g/b sampled at
# offsets scaled 1 ± ca_amount per channel. Tiny — a barely-there prismatic
# fringe. 0 = off (single sample).
ca_amount = 0.012
# Wave-size dials (Erik: idle shimmer waves read "very big"). wave_scale
# MULTIPLIES the ambient-sine spatial frequencies (higher = smaller/tighter
# waves, lower = bigger). ambient_amp = idle amplitude base (the old hardcoded
# 0.06) — the idle shimmer strength on still water.
wave_scale = 2.0
ambient_amp = 0.06
# --- Heightmap attenuation (alpha-only; graphics/water_rendering.md §2 §8) ---
# An OPTIONAL per-level floor heightmap ([art.bare] height) attenuates the water
# ALPHA where raised relief (crates, consoles, debris) rises above the local
# water depth, so those features poke ABOVE the surface and the water laps around
# them. It does NOT feed depth/volume/tint/refraction (those stay per-tile). On a
# level with no heightmap these dials do nothing (u_has_height = 0 -> the pass is
# bit-identical). wet = clamp((depth - relief*height_scale)/height_edge, 0, 1);
# alpha *= wet.
#   height_scale = relief metres gain — how tall the relief reads vs the water
#     depth. Tuned (~0.4) so furniture pokes through a ~0.3-0.5 m puddle. 0 = off.
#   height_edge  = shoreline softness (m) — the gradient width of the lap edge
#     around a protruding feature (lower = harder cut; higher = softer fade).
#   height_floor = the heightmap value treated as floor level (the "level 0"
#     baseline), subtracted from relief BEFORE scaling. DEFAULT 0.3 — a hand-tuned
#     stopgap for the raw Depth-Anything maps (floor sits at a nonzero relief). A
#     single constant is only APPROXIMATE: the raw maps carry a smooth top-to-
#     bottom relief gradient (DA artifact, ~0.28 top -> ~0.53 bottom on
#     unhcr_vessel_2), so no scalar flattens the whole floor. The proper fix is a
#     re-baseline that subtracts a low-frequency floor SURFACE (background
#     subtraction), not a constant — see docs/heightmap_refinement_tool_design.md
#     §6.1. Until that lands, this dial is the floor's average relief.
height_scale = 0.4
height_edge = 0.1
height_floor = 0.3

# =============================================================================
# Render-layer beauty config (Fire & Heat Beauty arc, B1). ALL keys here are
# RENDER-ONLY and determinism-EXEMPT: they drive renderer/blackbody.py +
# renderer/fire_lights.py, which read gmap.temperature and write only render
# structures. NOTHING here touches the sim, the digest, or a golden. Every
# value is a tune-by-eye dial (Erik), never a gated constant.
# =============================================================================

[render]
# Default overlay visibility (the shipped look; each stays a live in-game
# toggle). Fire & Heat Beauty B1 (Erik feel-check 2026-07-21): the physical
# black-body emissive overlay (T) ships ON — it IS the fire/heat view; the
# legacy flat-orange FireOverlay (F3) stays OFF (superseded); the pressure
# colormap (F7) now ships OFF by default (it washed the scene out — Erik's
# call) but is one keypress away when you want to see shockwaves.
blackbody_overlay_on = true
fire_overlay_on = false
pressure_overlay_on = false

# Blackbody temperature->colour ramp (renderer/blackbody.py; design
# docs/fire_b1_blackbody_fire_lights_design_2026-07-21.md §1). Baked once into a
# 1D LUT at renderer startup. Chroma via the Tanner Helland/Bartlett Kelvin->RGB
# fit (normalized, max channel = 1); brightness via a SEPARATE T⁴-flavour
# intensity ramp (the fits give hue only). Game ΔT -> pseudo-Kelvin is the honest
# dial for "white reserved for extremes": kelvin = kelvin_ambient +
# k_temp_to_kelvin * T_game. Wood ignites at T_game ~300; the physical extreme
# rail is T_MAX_PHYS = 16000.
[render.blackbody]
kelvin_floor = 800.0       # LUT low end (K)
kelvin_ceil = 10000.0      # LUT high end (K)
lut_size = 256             # LUT entries
kelvin_ambient = 293.0     # pseudo-Kelvin at T_game = 0 (ambient)
k_temp_to_kelvin = 2.0     # game-ΔT -> Kelvin slope  (TUNE BY EYE)
kelvin_glow_min = 800.0    # below this: no visible glow (intensity 0)
kelvin_ref = 3000.0        # exposure reference temperature (Macklin)
intensity_exponent = 4.0   # Stefan-Boltzmann flavour (T⁴)
intensity_max = 8.0        # HDR headroom pre-tonemap (16F pipeline + ACES; NO bloom)

# Fire light sources (renderer/fire_lights.py; design §3). Tier 2 of the fire
# glow: the brightest-K hot tiles become omni ray-traced light sources so fire
# lights rooms, walls, and marines (the marine shader samples the same light
# field). Candidates (T_game >= t_light_min) -> 3x3 non-max suppression ->
# brightest max_lights by temperature. RENDER-ONLY: these NEVER write the synced
# heat channel (heat is cast separately in the sim). Cost = sum over sources of
# ceil(2π·range) rays, so max_lights (not range) is the budget lever — range is
# LONG on purpose (geometry caps it; big-room illumination is the point).
[render.fire_lights]
enabled = true             # master on/off for fire lights
t_light_min = 250.0        # game-ΔT candidate threshold
nms_window = 3             # non-max-suppression window (3 or 5; widen if oversubscribed)
max_lights = 16            # brightest-K cap (the budget lever)
light_range = 18.0         # omni reach in tiles (LONG on purpose — Erik ruling)
light_gain = 1.0           # multiplies the black-body intensity into light weight

# Material property table (named-key format, ch.02 — Material System).
# One [materials.<name>] row per material id; columns indexed into per-id
# arrays by simulation.materials.MaterialTable.
#   hp            structural HP (0 = not a destructible wall)
#   flammable     can ignite
#   mobility      ease-of-movement coefficient in fixed-point milli-units
#                 (1000 = normal walk speed; 400 = 40% speed / 2.5x step time;
#                 0 = impassable wall). Replaces the old `passable` bool:
#                 walkability is the derived view `mobility > 0`, and the
#                 movement cadence area-averages it over the unit footprint.
#                 (door has mobility 1000 — walk-through — but still occludes.)
#   light_atten   [R,G,B] per-channel optic attenuation (1=opaque, 0=clear)
#   heat_atten    heat-ray attenuation
#   conductivity  thermal: high = heat spreads fast (metal)
#   thermal_mass  heat-units to raise one tile 1 degree (the analogue of
#                 volumetric heat capacity rho*c). POWER OF TWO (it sits on a
#                 divide: temperature += heat >> log2(thermal_mass)). Anchored
#                 to real rho*c (~5x metal:wood spread): steel/hull 32, glass
#                 16, wood/door/furniture 8, air 1 (engine/06 §1, proposal §1.1).
#   ignition_temp catches fire at this temperature (0 = non-flammable)
#   wave_reflect  fraction of shockwave energy reflected
#   wave_absorb   fraction damped; transmit = 1 - reflect - absorb
#   blast_resist  structural blast resistance
#   burst_threshold  max pressure DIFFERENTIAL a wall holds before it fails
#                    (over-pressure relief valve). 0 = n/a (air). Interior
#                    pressure is ~1.0, so thresholds sit comfortably above 1.
#   permeability  OPTIONAL gas/smoke flow coefficient (0 sealed, 1 open air,
#                 partial = porous). Omitted -> derived: sealed where the
#                 material occludes light, open otherwise (legacy solid set).
#   cover_exposure  exposure-vs-cover probability (mechanics/03 §3, 06 §5; W2).
#                 1.0 = no concealment (a shot entering a unit footprint from
#                 this tile never rolls); < 1.0 = soft cover: the shot connects
#                 with this probability, else it is ABSORBED by the tile
#                 (deposits its wall damage there — suppressive fire chews the
#                 crate until it stops being cover). Solid walls keep 1.0 —
#                 they stop the march physically, no roll needed.
# Optics/acoustic/thermal columns are STORED but not yet consumed (CPU
# foundation); values are illustrative and tuned later in the demos.

[materials.air]
hp = 0
flammable = false
mobility = 1000
light_atten = [0.0, 0.0, 0.0]
heat_atten = 0.0
# EOS refactor P2 (docs/eos_refactor_design.md §4, §8 patch P2): air gets a
# small NONZERO conductivity so the EXISTING whole-grid conduction pass
# (temperature_solver.cpp, no solid/air branch) does air<->air AND the
# solid<->air interface exchange for free — the sealed-room energy sink.
# Chosen so the derived face_shift_table[air][air] == 11: THREE steps
# slower than wood's face_shift_table[wood][wood] == 8 (the §9 "2-4 steps
# slower than wood" bound), comfortably inside [SHIFT_MIN=2, NO_FACE=63].
# Derivation (materials.py._build_conduction_tables, harmonic-mean face,
# shift = round(-log2(hm/KAPPA_REF)), KAPPA_REF=50):
#   face[air,air] = round(-log2(0.024/50)) = round(11.02) = 11
# The air<->solid interface shifts (harmonic mean, dominated by the more
# resistive material = air) land at ~10 for every solid — a hair FASTER
# than air-air (11) but far slower than any solid-solid face (hull/steel
# self-face == 2, wood-wood == 8): the physically-expected "air is the
# bottleneck resistor" ordering. furniture keeps conductivity=0.0
# (unaffected — NO_FACE either side, unchanged).
conductivity = 0.024
thermal_mass = 1     # air: irrelevant (conversion skips non-solids); 1 avoids a 0-shift guard
ignition_temp = 0.0
wave_reflect = 0.0
wave_absorb = 0.0
blast_resist = 0.0
burst_threshold = 0.0
cover_exposure = 1.0

[materials.hull]
hp = 300
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 50.0
thermal_mass = 32    # steel (real rho*c ~3.8): heats slowly per ray (heat >> 5)
ignition_temp = 0.0
wave_reflect = 0.9
wave_absorb = 0.1
blast_resist = 0.0
burst_threshold = 0.0  # 0 = never; the hull breaches via damage/explosions, not over-pressure
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.wood]
hp = 60
flammable = true
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.15
thermal_mass = 8     # softwood (real rho*c ~0.7): heats fast & locally (heat >> 3)
ignition_temp = 300.0
wave_reflect = 0.5
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.door]
hp = 40
# NOTE: ch.02 / architecture.md illustrate door as flammable=true, but the old
# _update_caches hardcoded `flammable = (material == WOOD)`, so doors were NOT
# flammable in practice. Kept false here to preserve existing physics behaviour
# (doors don't ignite). Flip to true once that gameplay change is intended.
flammable = false
mobility = 1000
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.3
thermal_mass = 8     # wood-like door: heats fast (heat >> 3)
ignition_temp = 280.0
wave_reflect = 0.5
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.steel]
hp = 200
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 45.0
thermal_mass = 32    # steel (real rho*c ~3.8): heats slowly per ray (heat >> 5)
ignition_temp = 0.0
wave_reflect = 0.9
wave_absorb = 0.1
blast_resist = 0.8
burst_threshold = 10.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

[materials.glass]
hp = 15
flammable = false
mobility = 0
light_atten = [0.1, 0.1, 0.1]
heat_atten = 0.3
conductivity = 1.0
thermal_mass = 16    # glass (real rho*c ~2.1): half metal's mass (heat >> 4)
ignition_temp = 0.0
wave_reflect = 0.3
wave_absorb = 0.1
blast_resist = 0.0
burst_threshold = 1.0
cover_exposure = 1.0   # solid pane: stops the march physically (until it shatters)

# Furniture: crates/shelving/bunks (editor proposal Q2 — dedicated material
# row: lower hp, partial permeability so smoke drifts past crates, flammable).
[materials.furniture]
hp = 30              # burns out / breaks fast; fuel for fire = wall_hp
flammable = true
mobility = 400       # climbable at a penalty: 40% speed = 2.5x step time (you clamber over a crate)
permeability = 0.5   # partial: smoke/air drift past crates (sealed walls omit this -> 0)
light_atten = [0.55, 0.55, 0.55]   # partial occlusion: a crate stack leaks some light
heat_atten = 0.5
conductivity = 0.0   # kappa 0 = no conduction face (like air); fire eats it via flammability instead
thermal_mass = 8     # wood-like (real rho*c ~0.7): heats fast & locally (heat >> 3)
ignition_temp = 280.0   # wood-like; slightly easier to light than a solid wood wall (300)
wave_reflect = 0.2
wave_absorb = 0.5    # soft stuff soaks blasts
blast_resist = 0.0
burst_threshold = 2.0   # overpressure can topple/burst furniture (door-equal; TUNING DIAL)
cover_exposure = 0.55   # soft cover (mechanics/03 §3): a shot crossing a crate into a
                        # unit connects with p=0.55, else the crate eats it (wall chew).
                        # STANDARD VALUE — Erik's dial; interesting range ~0.3 (bunker
                        # furniture) .. 0.8 (thin concealment)

[materials.door_closed]
# A6 (docs/a6_doors_v0_impl_2026-07-19.md §1): the ENTITY door's CLOSED
# stamp — [materials.door] values with mobility = 0 (fully solid to movement
# AND flow). permeability deliberately OMITTED so it derives 0 from the
# occluding light_atten, exactly like door. MAT_DOOR stays the legacy
# painted door (walkable-but-flow-solid) until the A7 migration.
hp = 40
flammable = false
mobility = 0
light_atten = [1.0, 1.0, 1.0]
heat_atten = 1.0
conductivity = 0.3
thermal_mass = 8     # wood-like door: heats fast (heat >> 3)
ignition_temp = 280.0
wave_reflect = 0.5
wave_absorb = 0.4
blast_resist = 0.0
burst_threshold = 2.0
cover_exposure = 1.0   # solid wall: stops the march physically, no roll

# =============================================================================
# Weapons framework (mechanics/03 §4) — three data tables loaded by
# simulation.weapons: [weapons.*] the delivery instrument, [ammo.*] the round,
# [payloads.*] what happens at the destination. W1 re-home: the old
# [weapons.rifle]/[weapons.grenade]/[weapons.door_explosive] sections live on
# as rows here with the SAME NUMBERS — zero behavior change; the unified
# march / spread split / crits / payload executor / ammo economy are W2/W3.
# Unlisted columns take the loader defaults (spread 0, shots 1, rof 0, mag 0,
# crit_chance 0, crit_mult 2.0, mass 0, loudness 0, payload columns 0/empty).
#
# METER-BASED RANGES (W6, Erik's design decision 2026-07-07): weapon reach is
# authored as range_m — PHYSICAL METERS — and converts to the integer tile
# range at Simulation construction using the loaded level's tile_size_m:
#     range_tiles = max(1, int(range_m / tile_size_m + 0.5))    # round-half-up
# quantized ONCE at table build (engine/14 door 2; the divide is door 3), so a
# weapon reaches the same physical distance on any grid resolution. The pinned
# test worlds are 1.0 m/tile (meters == tiles: every pre-W6 tile count below
# became the same number in meters — bit-identical effective ranges); the
# playground (0.333 m/tile) derives 3x the tiles for the same physical reach.
# The ONE deliberate exception: dragon_7 rescaled to 10 m (Erik's call — the
# W4 value, 8 tiles, was authored pre-meters and read as 2.7 m in-playground).
# =============================================================================

