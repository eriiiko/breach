[clock]
ticks_per_second = 12
phases_per_round = 2
phase_duration_seconds = 5.0
ap_per_phase = 2

[movement]
marine_attack_ticks_per_tile = 9
marine_cover_ticks_per_tile = 6
marine_sprint_ticks_per_tile = 4
xeno_sprint_ticks_per_tile = 1

[physics]
wave_c = 66.0                        # wave speed (tiles/s), ~c / 3 m/s physical
wave_damping = 3.0                    # wave velocity damping (1/s)
wave_transfer = 0.5                   # wave_p -> atmosphere transfer rate (1/s)
source_feed_rate = 200.0              # wave_source -> wave_p feed rate (1/s)
d_atm = 200.0                         # atmosphere diffusion (IMEX = no CFL limit!)
d_smoke = 0.1
advection_rate = 100.0                # smoke advection by wind (higher = smoke moves more)
breach_rate = 5.0                     # relaxation rate toward vacuum at hull breaches (1/s)
max_source_per_step = 10.0             # max wave energy fed per substep (IMEX handles big spikes)
smoke_dt_scale = 3.0                  # smoke time multiplier (>1 = smoke reacts faster to wind)
wind_diffusion_scale = 50.0            # wind-dependent diffusion: D = d_smoke * (1 + scale * |wind|)
physics_dt = 0.001                # 1ms (CFL stable for c=300 tiles/s)
physics_substeps = 8              # 8 * 1ms = 8ms physics per game tick

[display]
fine_tile_px = 10
coarse = 3
map_w = 40
map_h = 25
panel_width = 250

[materials]
# Material properties: [hp, reflectivity, absorption, flammable, passable]
# 0=air, 1=hull, 2=wood, 3=door
air = [0, 0.0, 0.0, false, true]
hull = [300, 0.9, 0.1, false, false]
wood = [60, 0.4, 0.5, true, false]
door = [40, 0.3, 0.3, true, true]

[weapons.rifle]
damage_per_bullet = 10
bullets_per_burst = 5
cone_half_angle_degrees = 3.0
range_tiles = 90
ap_cost = 1
burst_interval_ticks = 2

[weapons.grenade]
blast_radius = 5
pressure = 10.0
fuse_min_seconds = 0.0
fuse_max_seconds = 10.0
fuse_default_seconds = 1.0
ap_cost = 1
max_throw_range = 30
unit_damage = 60
wall_damage = 200
travel_speed = 30.0

[weapons.door_explosive]
blast_radius = 3
pressure = 5.0
wall_damage = 500
ap_cost = 1
unit_damage = 60

[zombie]
hp = 400
ticks_per_tile = 7                 # slightly faster than marine attack move (9)
melee_damage = 60
trigger_radius = 48
propagation_radius = 15
bullet_damage_multiplier = 0.25
fire_damage_multiplier = 4.0
attack_cooldown_ticks = 12

[marine]
hp = 100
grenades = 2
explosives = 2

[rendering]
# Pressure colormap: [pressure, R, G, B, alpha]
# Linear interpolation between stops. Tweak and restart to iterate.
pressure_scale = 2.0    # scales deviation from 1.0: displayed = 1 + (raw - 1) * scale
pressure_stops = [
    [0.0,    0,   0,   0,   0],       # vacuum: fully transparent
    [3.3,  255, 255, 255,   5],       # normal air: faint white veil
    [6.0,  255, 255, 255,  15],       # slight overpressure: steam
    [7.0,  200,  50,  30, 120],       # shockwave: dark red
    [8.0,  255, 140,  30, 180],       # blast: orange
    [9.0,  255, 220,  80, 220],       # intense: yellow
    [10.0, 255, 255, 255, 255],       # max: white
]

[combat]
blast_damage_threshold = 5
unit_absorption = 0.85
unit_reflectivity = 0.10
shot_tracer_duration = 0.4
