mass_kg = 0.3
loudness = 0.05                       # near-silent — the stealth identity
                                      # (reserved column, no consumer yet)

[weapons.arc_baton]                   # melee — the crowd-control stick (W5)
archetype = "melee"
ammo_family = "none"
# CHAIN-STUN (W5 finding of record, mechanics/03 §8 — ERIK'S CALL; numbers
# deliberately untouched at W6): the 19-tick strike cadence re-stuns inside
# every 36-tick stun window (statuses tick before shooting, shooting before
# zombie AI), so one marine with a baton holds one zombie indefinitely
# (10 hp/strike). THE DIAL PAIR is right here: rof_interval_seconds (next
# line) vs status_seconds (below) — cadence > duration breaks the chain.
rof_interval_seconds = 0.8            # armory "1 @ 0.8 s" -> 19 ticks @ 24 tps
ap_cost = 1
crit_chance = 0.0                     # no crit path — the baton's work is the stun
crit_mult = 2.0
# 10 ENERGY: a compliance jolt, not a lethal hit (10 strikes to drop a
# marine on damage alone). STANDARD VALUE: 5 (taser tickle) .. 25 (riot rod).
melee_damage = 10
melee_dtype = "energy"
# The delivery-site status (mechanics/03 §1 two-terminals: statuses at the
# site, packets stay damage-only): STUNNED where it connects — can_act +
# can_aim suppressed (a stunned zombie can't bite, mechanics/06 §4).
# 1.5 s -> 36 ticks @ 24 tps; refresh-stacked (chain-stunning re-ups the
# timer). STANDARD VALUE: 0.5 (a flinch) .. 3.0 (a dropped guard).
