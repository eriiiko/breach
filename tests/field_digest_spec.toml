# Canonical per-tick FIELD DIGEST spec — the FROZEN cross-GPU bit-identity
# contract (CUDA-S0). This file is the human-readable, version-controlled mirror
# of tests/field_digest.py's DIGEST_FIELDS. Two machines (Ampere / Ada / Turing)
# only produce comparable digests if they agree on this exact spec.
#
# CHANGE PROCEDURE: if a field's dtype/shape/membership/order changes, bump
# `version`, update `fields` here AND DIGEST_FIELDS in field_digest.py to match,
# and regenerate every committed golden/digest in the SAME commit (plan §7.6
# gate-7 — CI must reject a stale digest tag).

version = 4                    # v4 (2026-08-02, P-O2b): dem_acc widens to (max_claimants, h, w)
hash = "blake2b-256"
byte_order = "little"          # x86 + CUDA; big-endian dtypes are refused
serialization = "per-field: ascii header 'name|dtype.str|shape' then C-order raw bytes"

# The integer/bool SYNCED fields hashed into the digest, IN THIS ORDER.
# `gas` is the 3D (n_gas, h, w) multi-gas stack (smoke is a view into it).
# `ignition_armed` (v2) is the per-tile edge-trigger arm for temperature ignition
# (combat.apply_temperature_ignition; Fable zombie-smolder ruling 2026-07-24).
fields = [
    { name = "atmosphere",     dtype = "int32" },
    { name = "wave_p",         dtype = "int32" },
    { name = "wave_v",         dtype = "int32" },
    { name = "wave_source",    dtype = "int32" },
    { name = "wind_x",         dtype = "int32" },
    { name = "wind_y",         dtype = "int32" },
    { name = "gas",            dtype = "int32" },
    { name = "fire",           dtype = "int32" },
    { name = "water_depth",    dtype = "int32" },
    { name = "flow_vx",        dtype = "int32" },
    { name = "flow_vy",        dtype = "int32" },
    { name = "heat",           dtype = "int32" },
    { name = "temperature",    dtype = "int32" },
    { name = "wall_hp",        dtype = "int32" },
    { name = "material",       dtype = "int8"  },
    { name = "obstacles",      dtype = "bool"  },
    { name = "is_vacuum",      dtype = "bool"  },
    { name = "ignition_armed", dtype = "bool"  },
    # v3: the per-slot sub-count oxygen debt the combustion demand accumulator
    # carries ACROSS ticks (ruling amendment 5, D1). Persistent synced state —
    # a desync here forks the oxygen draw and the whole fire stream. The
    # per-TICK radiation planes (rad_net / rad_flux) are wiped at end of tick,
    # so they are identically zero at every snapshot and are deliberately
    # excluded — as is P-O2b's per-tick `dep_site` deposit plane, which lives
    # only inside the combustion pass.
    # v4 (P-O2b): shape widens from (4, h, w) to (max_claimants, h, w) — the
    # extended oxygen draw keys the accumulator by SOURCE OFFSET over the
    # 2*R*(R+1) offsets within BFS hop-radius DRAW_R (12 at the shipped R = 2)
    # instead of by the 4 faces. Ring 1 of the offset table is exactly D4's
    # order, so at DRAW_R = 1 the bytes are identical to v3.
    { name = "dem_acc",        dtype = "int32" },
]

# Float sim fields deliberately EXCLUDED from the cross-GPU integer digest
# (render/lighting-bound or a known residual float boundary; still covered
# same-machine by field_ab_harness.diff_trajectories). The synced UNIT state
# (HP/life/event stream) is folded in separately via field_digest.tick_digest.
excluded_float_fields = [
    "ripple", "ripple_v", "dyn_permeability", "dyn_wave_absorb", "dyn_light_atten",
]

# A4 (ADDITIVE — docs/a4_digest_impl_note_2026-07-18.md): the __entity__ /
# __signals__ sections fold into tick_digest ONLY when a snapshot's presence
# carrier says n_entities > 0, so entity-free digests are byte-identical to
# spec v1 without this section and NO golden regenerates for it. `version`
# above stays 1; the sections carry their own version in their hashed
# preambles (a future entity-format change bumps ENTITY_SECT_V1 loudly
# without touching entity-free bytes).
[entity_section]
format        = "ENTITY_SECT_V1"    # hashed preamble, section-local version
signal_format = "SIGNAL_SECT_V1"    # defined now, empty until Arc B's SignalBus
serializer    = "simulation.entities.serialize.serialize_entity_state (the ONE serializer — digest and recorder consume the same bytes)"
encoding      = "per entity in ordinal (file) order: ascii header 'ordinal|id|class', then per SYNCED declared field in schema declaration order 'name|' + signed little-endian int64 + newline, then the 'alive|' row, then per-class runtime rows, then a newline record terminator"
synced_kinds  = ["int", "q16", "bool", "enum", "entity_ref"]
# length_m is authoring-bound (stored unquantized); its synced consequence is
# quantized tile state already hashed via material/obstacles/wall_hp. The
# other exclusions are render/authoring-only by declaration.
excluded_kinds = ["length_m", "float_render", "str", "color_rgb", "str_list"]
# The entity field list/order is NOT frozen here: it is defined by the entity
# registry at the recorded content-hash (registry_content_hash — folds the
# entities.toml effective defaults). Entity-present digests are only
# comparable at equal registry hash; every entity-present artifact records it
# (xarch line 'ents=N,esect_v1,reg=<hash12>', recorder 'entity_registry_hash').
field_list = "defined by the entity registry at the recorded content-hash"
