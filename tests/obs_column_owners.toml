# THE COLUMN-TO-PATCH TABLE (#29 P8, residency design §4.4c "P8 RE-CUT,
# VERSION 2", "Rules every gate follows"; filled by P8.0 from the inventory's
# part A, docs/residency_p8_observation_inventory_2026-11-20.md). Every column
# and plane of the observation, the full view, the masks and the reward has
# ONE owning patch of the version-2 table: a P8 gate compares exactly what it
# and every earlier patch own (tests/cuda_obs_check.py reads this file), and
# counts each owned column's non-default values, failing on one that is
# constant over its corpus. tests/test_device_obs.py holds every served column
# to exactly one owner and simulation.device_obs.BUILT to the rows owned by
# the patches landed so far.
#
# [columns.<key>] names a key's columns (vector / list: obs_spec_v1's
# VECTOR_COLUMNS / ENTRY_COLUMNS) or planes (the four window keys: the spec's
# *_PLANES); [keys] owns a whole key (one owner for every column of it).
# Every key has a final_ twin (the terminal observation): [final] owns them.
#
# Choices where the inventory leaves an owner open (vetoable): a list column
# is built where the list is built (P8.4b) unless its builder is the
# decoder's (P8.6a: on_next_tick, prev_aim) or the order's (P8.6b);
# P8.4a's served column is the lanes plane (its aim_of / line-of-fire
# answers are compared as intermediates until the list exists);
# "sees_target" sits with the two sight planes of P8.5a and reads 0 without
# the decoder's aims (corpus (c) exercises it).

