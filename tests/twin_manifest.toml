# THE TWIN MANIFEST (#29 P1b, residency design §6; critique 4 B1/B2, critique 5
# B1/M5/M6). Every DEVICE TWIN -- device code that mirrors a reference law --
# is one [twins.<name>] table here. Read by tools/twin_debt.py (the debt
# ledger), tests/test_twin_debt.py (coverage + staleness),
# tests/test_class_p_level.py (Class-P enforcement) and
# rl_env.require_snapshot (the device door). Debt is COMPUTED, never
# remembered.
#
# A twin's keys:
#   class    "P" (the played --cuda / --resident game runs it: kept level PER
#            PATCH, never in debt, enforced by .cuda_green + test_class_p_level)
#            or "T" (only training runs it: carries debt, refused at the
#            training doors while in debt). The first Class-T row is
#            exposure_decay (#29 P6.1, the device unit store's slot 1c).
#   kind     "per-call" (a per-call wrapper over host mirrors), "resident
#            launch core" (a cuda_resident.h core), or "driver" (a resident
#            driver chaining cores).
#   device   the twin's OWN device sources (hand-kept: they are the twin).
#   slots    what it mirrors: labels of tools/tick_stage_profile.py (a slot
#            of Simulation.step, or a stage of slot 7), or "<label> / <part>"
#            for a part of a stage the tracer sees as one C++ call.
#   level    false while the twin is known NOT level (then `issue` names the
#            catch-up); twin_debt.py reports it as debt whatever the diff.
#   level_at the commit at which the twin was last level (an ancestor of
#            HEAD). twin_debt.py reports the twin when any of its `files`
#            changed in `git diff level_at..HEAD`. A patch that moves a twin's
#            files AND its device side together (every Class-P patch) sets
#            level_at, in its last commit, to the commit holding the complete
#            change: `tools/twin_debt.py --mark-level <twin>` (the .cuda_green
#            stamp is the proof it is level).
#   files    GENERATED by tools/twin_manifest_gen.py -- never edit by hand: the
#            src/ files the corpus executed under the twin's slots (sys.settrace)
#            + the C++ of its slots' [cpp_stages] rows with their local
#            #include closure. test_twin_debt fails when it is stale:
#            regenerate and commit.
#
# The corpus traces the CPU path only, so a law the corpus does not exercise
# contributes only what ran: water is DORMANT on ship_demo (no water), so the
# water twin's traced Python is the early return in physics_runner.py --
# water_fixed.py joins its set when a wet scene joins the corpus.

[corpus]
# The medium match the generator traces (MatchSession, CPU build).
level = "ship_demo"
seed = 1
ticks = 300

[class_p]
# Paths outside every twin's `files` that still make a change Class P: the
# build, the bindings, every device source and device header. A change here or
# in a Class-P twin's `files` / `device` needs the stamp (test_class_p_level).
build = [
    "cpp/CMakeLists.txt",
    "cpp/gen_build_id.cmake",
    "cpp/build_cuda*.bat",
    "cpp/src/bindings.cpp",
    "cpp/src/*.cu",
    "cpp/src/*.cuh",
    "cpp/src/cuda_*.h",
]

[cpp_stages]
# The C++ translation units each stage runs (C++ cannot be traced from Python:
# kept by hand, checked by the reviewer). physics_engine.cpp is the
# orchestration (PhysicsEngine::step_water / run_substeps / step_tail).
"6 stamp_units" = ["cpp/src/physics_engine.cpp"]
"7 water (cpu/per-call)" = ["cpp/src/water_solver.cpp", "cpp/src/physics_engine.cpp"]
"7 EOS run_substeps (cpu/per-call)" = ["cpp/src/eos_solver.cpp", "cpp/src/bulk_transport.cpp", "cpp/src/physics_engine.cpp"]
"7 EOS run_substeps (cpu/per-call) / trace tail" = ["cpp/src/bulk_transport.cpp", "cpp/src/physics_engine.cpp"]
"7 EOS run_substeps (cpu/per-call) / div_source" = ["cpp/src/eos_solver.cpp", "cpp/src/physics_engine.cpp"]
"7 EOS run_substeps (cpu/per-call) / energy flux" = ["cpp/src/eos_solver.cpp"]
"7 combustion (host)" = ["cpp/src/combustion.cpp"]
"7 step_tail (ripple+fire+temp+sweep) / temperature" = ["cpp/src/temperature_solver.cpp", "cpp/src/physics_engine.cpp"]
"7 step_tail (ripple+fire+temp+sweep) / fire" = ["cpp/src/fire_simulation.cpp", "cpp/src/physics_engine.cpp"]
"7 step_tail (ripple+fire+temp+sweep) / sweep" = ["cpp/src/radiation_sweep.cpp", "cpp/src/emissive_table.cpp", "cpp/src/physics_engine.cpp"]

